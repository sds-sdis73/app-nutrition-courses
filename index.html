<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f9d55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Nutri Semaine</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js" defer></script>
<style>
:root {
  --bg: #f4f7f4;
  --surface: #ffffff;
  --surface-2: #eef3ef;
  --text: #17231b;
  --muted: #5d6b62;
  --border: #dbe4dd;
  --primary: #1f9d55;
  --primary-strong: #167a42;
  --primary-soft: #e3f4ea;
  --on-primary: #ffffff;
  --danger: #d64532;
  --excellent: #1e8f4e;
  --bon: #7cbf3a;
  --mediocre: #f0a031;
  --mauvais: #e04f2f;
  --shadow: 0 6px 24px rgba(16, 40, 24, .10);
  --radius: 16px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612;
    --surface: #18211c;
    --surface-2: #212c25;
    --text: #e7efe9;
    --muted: #9db0a3;
    --border: #2c3a31;
    --primary: #34b96c;
    --primary-strong: #4fd083;
    --primary-soft: #1d3326;
    --on-primary: #08130c;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #18211c; --surface-2: #212c25; --text: #e7efe9; --muted: #9db0a3;
  --border: #2c3a31; --primary: #34b96c; --primary-strong: #4fd083; --primary-soft: #1d3326;
  --on-primary: #08130c; --shadow: 0 6px 24px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary-strong); }
img { display: block; max-width: 100%; }

/* En-tête et navigation */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: calc(10px + var(--safe-t)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.topbar h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -.01em; }
main { padding: 4px 16px calc(var(--nav-h) + var(--safe-b) + 24px); max-width: 760px; margin: 0 auto; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(3, 1fr);
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: var(--surface); border-top: 1px solid var(--border);
}
.tabbar button {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600;
}
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button[aria-current="page"] { color: var(--primary); }

/* Composants communs */
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent;
  display: inline-grid; place-items: center; color: var(--text);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.btn {
  min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none; color: var(--text);
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.soft { background: var(--primary-soft); border-color: transparent; color: var(--primary-strong); }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 12px; }
.section-title { font-size: 18px; margin: 24px 0 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.field { display: block; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface-2); outline: none;
}
.input:focus { border-color: var(--primary); }
textarea.input { resize: vertical; min-height: 72px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty svg { width: 56px; height: 56px; color: var(--primary); opacity: .8; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; z-index: 100;
  opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100vw - 32px); font-size: 15px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 24px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Feuilles (bottom sheets) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; transition: .25s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 16px calc(24px + var(--safe-b));
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-width: 760px; margin: 0 auto;
}
.sheet.full { height: 100vh; max-height: 100vh; border-radius: 0; padding-top: calc(8px + var(--safe-t)); }
.sheet-wrap.open .sheet { transform: none; }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-size: 20px; flex: 1; }
.menu-list { display: grid; gap: 4px; }
.menu-list button {
  min-height: 52px; border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 12px;
  display: flex; align-items: center; gap: 12px; font-weight: 600;
}
.menu-list button:hover { background: var(--surface-2); }
.menu-list svg { width: 22px; height: 22px; color: var(--muted); }

/* Scan */
.scan-hero {
  display: grid; gap: 12px; padding: 20px; text-align: center;
  background: linear-gradient(160deg, var(--primary) 0%, var(--primary-strong) 100%); color: #fff; border-radius: 22px;
}
.scan-hero h2 { margin: 0; font-size: 20px; }
.scan-hero p { margin: 0; opacity: .9; font-size: 15px; }
.scan-hero .btn { background: #fff; color: #167a42; border: 0; min-height: 56px; font-size: 17px; }
.manual { display: flex; gap: 8px; }
.manual .input { background: rgba(255,255,255,.18); border-color: transparent; color: #fff; }
.manual .input::placeholder { color: rgba(255,255,255,.75); }
.manual .btn { min-height: 44px; font-size: 15px; }
.prod-row {
  display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: var(--surface);
  border: 0; width: 100%; text-align: left; box-shadow: var(--shadow);
}
.prod-row + .prod-row { margin-top: 10px; }
.thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: contain; background: #fff; flex: none; border: 1px solid var(--border); }
.thumb.ph { display: grid; place-items: center; color: var(--muted); background: var(--surface-2); }
.prod-name { font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
.score-line { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-top: 2px; }
.lvl-excellent { --lvl: var(--excellent); } .lvl-bon { --lvl: var(--bon); } .lvl-mediocre { --lvl: var(--mediocre); } .lvl-mauvais { --lvl: var(--mauvais); } .lvl-na { --lvl: #9aa59e; }
.dot { background: var(--lvl); }

.prod-head { display: flex; gap: 14px; align-items: flex-start; }
.prod-head img, .prod-head .ph { width: 96px; height: 96px; border-radius: 14px; object-fit: contain; background: #fff; border: 1px solid var(--border); flex: none; }
.big-score { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.big-score .dot { width: 20px; height: 20px; }
.big-score strong { font-size: 22px; }
.analysis h3 { font-size: 17px; margin: 22px 0 6px; display: flex; justify-content: space-between; }
.analysis h3 span { font-size: 13px; color: var(--muted); font-weight: 500; }
.crit { display: grid; grid-template-columns: 36px 1fr auto; gap: 4px 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.crit .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); grid-row: span 2; }
.crit .ico svg { width: 20px; height: 20px; }
.crit .lbl { font-weight: 700; }
.crit .sub { color: var(--muted); font-size: 14px; grid-column: 2; }
.crit .val { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; grid-row: span 2; }
.gauge { grid-column: 1 / -1; position: relative; height: 8px; border-radius: 4px; display: flex; overflow: hidden; margin-top: 6px; }
.gauge i { flex: 1; } .gauge i + i { margin-left: 2px; }
.gauge b { position: absolute; top: -3px; width: 4px; height: 14px; border-radius: 2px; background: var(--text); }
.alt-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x mandatory; }
.alt-card { flex: none; width: 150px; scroll-snap-align: start; background: var(--surface-2); border-radius: 14px; padding: 10px; border: 0; text-align: left; }
.alt-card img, .alt-card .ph { width: 100%; height: 100px; object-fit: contain; background: #fff; border-radius: 10px; margin-bottom: 8px; }
.badge-u { display: inline-block; font-size: 11px; font-weight: 800; background: #e30613; color: #fff; padding: 2px 6px; border-radius: 6px; margin-top: 4px; }

/* Scanner */
.scanner { position: fixed; inset: 0; z-index: 80; background: #000; color: #fff; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scanner .frame {
  position: absolute; left: 50%; top: 42%; width: min(80vw, 340px); height: min(46vw, 190px); transform: translate(-50%, -50%);
  border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); border: 3px solid rgba(255,255,255,.9);
}
.scanner .frame::after { content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d; animation: scanline 1.6s ease-in-out infinite alternate; }
@keyframes scanline { from { transform: translateY(-60px); } to { transform: translateY(60px); } }
.scanner .top { position: absolute; top: calc(12px + var(--safe-t)); left: 12px; right: 12px; display: flex; justify-content: space-between; }
.scanner .top .icon-btn { background: rgba(0,0,0,.45); color: #fff; }
.scanner .hint { position: absolute; left: 16px; right: 16px; top: calc(42% + min(23vw, 95px) + 24px); text-align: center; font-weight: 600; }
.scanner .bottom { position: absolute; left: 16px; right: 16px; bottom: calc(24px + var(--safe-b)); display: flex; justify-content: center; }

/* Recettes */
.searchbar { position: relative; }
.searchbar svg { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--muted); }
.searchbar .input { padding-left: 40px; }
.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
.recipe-card { border: 0; padding: 0; text-align: left; overflow: hidden; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.recipe-card .cover { aspect-ratio: 4/3; width: 100%; object-fit: cover; background: var(--primary-soft); }
.recipe-card .cover.ph { display: grid; place-items: center; color: var(--primary); }
.recipe-card .cover.ph svg { width: 40px; height: 40px; }
.recipe-card .body { padding: 10px 12px 12px; }
.recipe-card h3 { font-size: 15px; margin: 0 0 4px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; gap: 10px; font-size: 13px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.meta svg { width: 15px; height: 15px; vertical-align: -3px; }
.fav { color: #e0475b; }
.detail-cover { width: calc(100% + 32px); margin: -8px -16px 12px; aspect-ratio: 16/10; object-fit: cover; background: var(--primary-soft); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.stepper button { width: 40px; height: 40px; border: 0; background: var(--surface-2); font-size: 20px; font-weight: 700; }
.stepper span { min-width: 44px; text-align: center; font-weight: 700; }
.ing-list { list-style: none; padding: 0; margin: 0; }
.ing-list li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
.ing-list .q { min-width: 84px; font-weight: 700; color: var(--primary-strong); }
.step-list { list-style: none; padding: 0; margin: 0; counter-reset: s; }
.step-list li { position: relative; padding: 10px 0 12px 44px; border-bottom: 1px solid var(--border); }
.step-list li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-strong); display: grid; place-items: center; font-weight: 800; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.ahead { background: var(--primary-soft); color: var(--primary-strong); }

/* Éditeur */
.ed-block { background: var(--surface-2); border-radius: 14px; padding: 12px; }
.ed-ing { display: grid; grid-template-columns: 70px 92px 1fr 40px; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.ed-ing .aisle { grid-column: 1 / 4; }
.ed-ing .score { grid-column: 4; justify-self: center; }
.ed-ing .input { min-height: 40px; padding: 8px; background: var(--surface); }
.ed-step { display: grid; grid-template-columns: 32px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.ed-step.dragging { opacity: .6; }
.handle { touch-action: none; cursor: grab; color: var(--muted); display: grid; place-items: start center; padding-top: 10px; }
.handle svg { width: 22px; height: 22px; }
.ed-step .input { background: var(--surface); }
.ed-step .opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.ed-step .opts .input { min-height: 38px; padding: 6px 8px; width: auto; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; min-height: 38px; }
.check input { width: 20px; height: 20px; accent-color: var(--primary); }
.photo-pick { position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: var(--primary-soft); display: grid; place-items: center; color: var(--primary-strong); font-weight: 700; border: 2px dashed color-mix(in srgb, var(--primary) 40%, transparent); }
.photo-pick .row { white-space: nowrap; }
.photo-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* Mode cuisine */
.cook { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; padding: calc(12px + var(--safe-t)) 20px calc(20px + var(--safe-b)); }
.cook .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0 24px; }
.cook .progress i { display: block; height: 100%; background: var(--primary); transition: width .3s; }
.cook .step-text { font-size: clamp(22px, 5.5vw, 30px); line-height: 1.4; font-weight: 600; flex: 1; overflow-y: auto; }
.cook .timer { font-size: 44px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; margin: 16px 0; }
.cook .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cook .nav .btn { min-height: 60px; font-size: 18px; }

/* Planning */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { border: 0; background: none; min-height: 40px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.week-nav { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
.week-nav strong { flex: 1; text-align: center; }
.day { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 12px; }
.day + .day { margin-top: 10px; }
.day.today { outline: 2px solid var(--primary); }
.day h3 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; }
.slot { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; border: 0; background: none; text-align: left; padding: 6px 0; border-radius: 10px; }
.slot + .slot { border-top: 1px dashed var(--border); }
.slot .when { width: 44px; flex: none; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.slot .sthumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--primary-soft); flex: none; display: grid; place-items: center; color: var(--primary); }
.slot .sthumb svg { width: 20px; height: 20px; }
.slot .add { color: var(--primary-strong); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.slot .add svg { width: 20px; height: 20px; }
.slot.target { background: var(--primary-soft); }
.slot.moving { outline: 2px dashed var(--primary); }
.move-banner { position: sticky; top: calc(64px + var(--safe-t)); z-index: 10; background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; }
.phase { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
.phase + .phase { margin-top: 12px; }
.phase h3 { margin: 0 0 4px; font-size: 17px; display: flex; gap: 10px; align-items: center; }
.phase h3 .num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 14px; flex: none; }
.phase ul { margin: 8px 0 0; padding-left: 20px; }
.phase li { margin: 6px 0; }
.phase li .rec { font-size: 12px; font-weight: 700; color: var(--primary-strong); background: var(--primary-soft); border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
.summary-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.summary-box div { background: var(--surface); border-radius: 14px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
.summary-box strong { display: block; font-size: 22px; }
.summary-box span { font-size: 12px; color: var(--muted); }
.aisle h3 { font-size: 15px; margin: 18px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.shop-item { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.shop-item input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--primary); }
.shop-item.done .nm { text-decoration: line-through; color: var(--muted); }
.shop-item .nm { font-weight: 600; }
.shop-item .for { font-size: 12px; color: var(--muted); }
.shop-item .acts { display: flex; gap: 4px; }

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
function fail(err, msg = 'Une erreur est survenue') {
  console.error(err);
  toast(`${msg}${navigator.onLine ? '' : ' (hors ligne)'}`);
}

function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const fmtDay = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

function fmtNum(n) {
  if (!isFinite(n)) return '';
  const r = n >= 10 ? Math.round(n) : Math.round(n * 10) / 10;
  return String(r).replace('.', ',');
}

  recipes: [],

};
const recipeById = (id) => state.recipes.find((r) => r.id === id);

// ---------------------------------------------------------------------------
// Accès aux données (Supabase)
// ---------------------------------------------------------------------------
const Data = {
  async loadAll() {
    const [s, r, l, sc] = await Promise.all([
      db.from('settings').select('*').eq('id', 1).maybeSingle(),
      db.from('recipes').select('*').order('updated_at', { ascending: false }),
      db.from('product_links').select('*'),
      db.from('scans').select('*').order('scanned_at', { ascending: false }).limit(150),
    ]);
    for (const res of [s, r, l, sc]) if (res.error) throw res.error;
    if (s.data) state.settings = s.data;
    state.recipes = r.data;
    state.links = Object.fromEntries(l.data.map((x) => [x.ingredient, x]));
    state.scans = sc.data;
  },
  async loadWeek() {
    const week = isoDate(state.week);
    const [p, c] = await Promise.all([
      db.from('meal_plan').select('*').eq('week', week),
      db.from('shopping_checks').select('*').eq('week', week),
    ]);
    if (p.error) throw p.error;
    if (c.error) throw c.error;
    state.plan = p.data;
    state.checks = Object.fromEntries(c.data.map((x) => [x.item, x.checked]));
  },
  async saveRecipe(r) {
    const row = { ...r, updated_at: new Date().toISOString() };
    const { data, error } = await db.from('recipes').upsert(row).select().single();
    if (error) throw error;
    const i = state.recipes.findIndex((x) => x.id === data.id);
    if (i >= 0) state.recipes.splice(i, 1);
    state.recipes.unshift(data);
    return data;
  },
  async deleteRecipe(id) {
    const { error } = await db.from('recipes').delete().eq('id', id);
    if (error) throw error;
    state.recipes = state.recipes.filter((r) => r.id !== id);
    state.plan = state.plan.filter((m) => m.recipe_id !== id);
  },
  async setMeal(day, slot, recipe_id, servings) {
    const row = { week: isoDate(state.week), day, slot, recipe_id, servings };
    const { data, error } = await db.from('meal_plan').upsert(row, { onConflict: 'week,day,slot' }).select().single();
    if (error) throw error;
    state.plan = state.plan.filter((m) => !(m.day === day && m.slot === slot));
    state.plan.push(data);
  },
  async updateMeal(id, patch) {
    const { data, error } = await db.from('meal_plan').update(patch).eq('id', id).select().single();
    if (error) throw error;
    const i = state.plan.findIndex((m) => m.id === id);
    state.plan[i] = data;
  },
  async removeMeals(ids) {
    if (!ids.length) return;
    const { error } = await db.from('meal_plan').delete().in('id', ids);
    if (error) throw error;
    state.plan = state.plan.filter((m) => !ids.includes(m.id));
  },
  async addScan(p, score) {
    const row = { ean: p.code, name: p.product_name_fr || p.product_name || null, brand: p.brands || null, image_url: p.image_front_small_url || p.image_front_url || null, score };
    await db.from('scans').delete().eq('ean', p.code);
    const { data, error } = await db.from('scans').insert(row).select().single();
    if (error) throw error;
    state.scans = [data, ...state.scans.filter((s) => s.ean !== p.code)];
  },
  async clearScans() {
    const { error } = await db.from('scans').delete().not('id', 'is', null);
    if (error) throw error;
    state.scans = [];
  },
  async saveLink(ingredient, url, label) {
    const row = { ingredient, url, label, updated_at: new Date().toISOString() };
    const { error } = await db.from('product_links').upsert(row);
    if (error) throw error;
    state.links[ingredient] = row;
  },
  async deleteLink(ingredient) {
    const { error } = await db.from('product_links').delete().eq('ingredient', ingredient);
    if (error) throw error;
    delete state.links[ingredient];
  },
  async setCheck(item, checked) {
    const { error } = await db.from('shopping_checks').upsert({ week: isoDate(state.week), item, checked });
    if (error) throw error;
    state.checks[item] = checked;
  },
  async saveSettings(patch) {
    const { data, error } = await db.from('settings').update({ ...patch, updated_at: new Date().toISOString() }).eq('id', 1).select().single();
    if (error) throw error;
    state.settings = data;
  },
};

const RISK = [
  { label: 'Sans risque', lvl: 'excellent' },
  { label: 'Risque limité', lvl: 'bon' },
  { label: 'Risque modéré', lvl: 'mediocre' },
  { label: 'Risque élevé', lvl: 'mauvais' },
];

function additiveInfo(tag) {
  const code = String(tag).replace(/^[a-z]{2}:/, '').toUpperCase();
  const base = code.match(/^E\d+[A-Z]?/)?.[0] || code;
  const info = ADDITIVES[code] || ADDITIVES[base] || ADDITIVES[base.replace(/[A-Z]$/, '')];
  return { code: base, name: info ? info[0] : 'Additif', risk: info ? info[1] : 0, known: !!info };
}

const isOrganic = (p) => (p.labels_tags || []).some((l) => ['en:organic', 'en:eu-organic', 'fr:ab-agriculture-biologique', 'fr:agriculture-biologique'].includes(l));
const isBeverage = (p) => p.nutriscore_data?.is_beverage === 1 || p.nutriscore_data?.is_beverage === true || (p.categories_tags || []).includes('en:beverages');

function computeScore(p) {
  const grade = String(p.nutriscore_grade || '').toLowerCase();
  if (!/^[a-e]$/.test(grade)) return { total: null };
  const band = { a: [48, 60], b: [36, 47], c: [24, 35], d: [12, 23], e: [0, 11] }[grade];
  let nutri = { a: 60, b: 45, c: 30, d: 15, e: 0 }[grade];
  if (!isBeverage(p) && typeof p.nutriscore_score === 'number') nutri = Math.round((60 * (19 - p.nutriscore_score)) / 27);
  nutri = clamp(nutri, band[0], band[1]);

  const additives = [...new Set(p.additives_tags || [])].map(additiveInfo);
  let add = 30;
  let cap = 100;
  for (const a of additives) {
    if (a.risk === 3) { add = 0; cap = 49; }
    else if (a.risk === 2) add -= 10;
    else if (a.risk === 1) add -= 4;
  }
  add = clamp(add, 0, 30);
  const bio = isOrganic(p) ? 10 : 0;
  return { total: Math.min(cap, nutri + add + bio), nutri, add, bio, additives, grade };
}

function scoreLevel(total) {
  if (total == null) return { lvl: 'na', label: 'Non noté' };
  if (total >= 75) return { lvl: 'excellent', label: 'Excellent' };
  if (total >= 50) return { lvl: 'bon', label: 'Bon' };
  if (total >= 25) return { lvl: 'mediocre', label: 'Médiocre' };
  return { lvl: 'mauvais', label: 'Mauvais' };
}
const scoreHtml = (total, cls = 'score-line') => {
  const s = scoreLevel(total);
  return `<span class="${cls} lvl-${s.lvl}"><span class="dot"></span>${total == null ? s.label : `${total}/100 · ${s.label}`}</span>`;
};

// Seuils pour 100 g (solides) ou 100 ml (boissons).
const NUTRIENTS = [
  { key: 'energy-kcal_100g', label: 'Calories', unit: 'kcal', icon: 'flame', neg: true, t: [160, 360, 560], bev: [14, 35, 48], txt: ['Peu calorique', 'Faible impact', 'Un peu trop calorique', 'Trop calorique'] },
  { key: 'sugars_100g', label: 'Sucres', unit: 'g', icon: 'cube', neg: true, t: [9, 18, 31], bev: [1.5, 3, 7], txt: ['Peu sucré', 'Faible quantité de sucre', 'Un peu trop sucré', 'Trop sucré'] },
  { key: 'saturated-fat_100g', label: 'Graisses saturées', unit: 'g', icon: 'drop', neg: true, t: [2, 4, 7], bev: [1, 2, 4], txt: ['Peu de graisses saturées', 'Faible quantité', 'Un peu trop gras', 'Trop gras'] },
  { key: 'salt_100g', label: 'Sel', unit: 'g', icon: 'flask', neg: true, t: [0.46, 0.92, 1.62], bev: [0.2, 0.4, 0.7], txt: ['Peu salé', 'Faible quantité de sel', 'Un peu trop salé', 'Trop salé'] },
  { key: 'fiber_100g', label: 'Fibres', unit: 'g', icon: 'grain', neg: false, t: [1.9, 3.5], txt: ['Quelques fibres', 'Riche en fibres'] },
  { key: 'proteins_100g', label: 'Protéines', unit: 'g', icon: 'muscle', neg: false, t: [4.7, 8], txt: ['Quelques protéines', 'Excellente quantité de protéines'] },
  { key: 'fruits-vegetables-legumes-estimate-from-ingredients_100g', label: 'Fruits, légumes', unit: '%', icon: 'apple', neg: false, t: [40, 80], txt: ['Quelques fruits et légumes', 'Riche en fruits et légumes'] },
];

function gaugeHtml(value, th, neg) {
  const max = th[th.length - 1] * 1.5;
  const colors = neg ? ['excellent', 'bon', 'mediocre', 'mauvais'] : ['mauvais', 'bon', 'excellent'];
  const pos = clamp((value / max) * 100, 0, 98.5);
  return `<div class="gauge">${colors.map((c) => `<i style="background:var(--${c})"></i>`).join('')}<b style="left:${pos}%"></b></div>`;
}

function analyse(p, sc) {
  const defects = [];
  const qualities = [];
  const n = p.nutriments || {};
  const bev = isBeverage(p);
  for (const def of NUTRIENTS) {
    const v = n[def.key];
    if (typeof v !== 'number') continue;
    const th = bev && def.bev ? def.bev : def.t;
    const val = `${fmtNum(v)} ${def.unit}`;
    if (def.neg) {
      const lvl = v <= th[0] ? 0 : v <= th[1] ? 1 : v <= th[2] ? 2 : 3;
      const item = { icon: def.icon, label: def.label, sub: def.txt[lvl], val, lvl: RISK[lvl].lvl, gauge: gaugeHtml(v, th, true) };
      (lvl >= 2 ? defects : qualities).push(item);
    } else if (v >= th[0] && !bev) {
      const lvl = v >= th[1] ? 1 : 0;
      qualities.push({ icon: def.icon, label: def.label, sub: def.txt[lvl], val, lvl: lvl ? 'excellent' : 'bon', gauge: gaugeHtml(v, th, false) });
    }
  }
  const risky = sc.additives.filter((a) => a.risk > 0);
  if (risky.length) defects.unshift({ icon: 'flask', label: 'Additifs', sub: `${risky.length} additif${risky.length > 1 ? 's' : ''} à risque`, val: '', lvl: RISK[Math.max(...risky.map((a) => a.risk))].lvl });
  else if (!sc.additives.length) qualities.unshift({ icon: 'flask', label: 'Additifs', sub: 'Sans additifs', val: '', lvl: 'excellent' });
  if (sc.bio) qualities.unshift({ icon: 'leaf', label: 'Bio', sub: 'Produit naturel', val: '', lvl: 'excellent' });
  return { defects, qualities };
}

const critHtml = (c) => `<div class="crit"><div class="ico">${ICON[c.icon]}</div><div class="lbl">${esc(c.label)}</div>
  <div class="val lvl-${c.lvl}">${esc(c.val)}<span class="dot"></span></div><div class="sub">${esc(c.sub)}</div>${c.gauge || ''}</div>`;

async function fetchJson(url, tries = 3) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url);
      const type = r.headers.get('content-type') || '';
      if (type.includes('json')) return await r.json();
    } catch (e) {
      if (i === tries - 1) throw e;
    }
    await sleep(700 * (i + 1));
  }
  throw new Error('Open Food Facts indisponible');
}
async function fetchProduct(ean) {
  const d = await fetchJson(`${OFF}/product/${encodeURIComponent(ean)}.json?fields=${OFF_FIELDS}`);
  return d.status === 1 && d.product ? { ...d.product, code: d.product.code || ean } : null;
}
const isU = (p) => (p.stores_tags || []).some((s) => /(^|[-\s])u($|[-\s])|super-?u|hyper-?u|magasins-?u|systeme-?u|courses-?u|u-express/i.test(s));

async function findAlternatives(p, current) {
  const cats = (p.categories_tags || []).filter((t) => /^en:[a-z0-9-]+$/.test(t));
  for (const cat of cats.slice(-2).reverse()) {
    const url = `${OFF}/search?categories_tags=${encodeURIComponent(cat)}&countries_tags=en:france&sort_by=nutriscore_score&page_size=60&fields=${OFF_FIELDS}`;
    const d = await fetchJson(url);
    const list = (d.products || [])
      .filter((x) => x.code !== p.code && (x.product_name_fr || x.product_name))
      .map((x) => ({ ...x, _s: computeScore(x).total }))
      .filter((x) => x._s != null && x._s >= Math.min(75, (current ?? 0) + 10));
    if (list.length) {
      list.sort((a, b) => (isU(b) - isU(a)) || (b._s - a._s));
      return list.slice(0, 12);
    }
  }
  return [];
}

const sheets = [];
function openSheet(html, { full = false, onClose } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-backdrop" data-act="close-sheet"></div><div class="sheet ${full ? 'full' : ''}" role="dialog" aria-modal="true">${full ? '' : '<div class="sheet-grip"></div>'}${html}</div>`;
  document.body.append(wrap);
  sheets.push({ wrap, onClose });
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  return wrap.querySelector('.sheet');
}
function closeSheet() {
  const s = sheets.pop();
  if (!s) return;
  s.onClose?.();
  s.wrap.classList.remove('open');
  setTimeout(() => s.wrap.remove(), 280);
}
const topSheet = () => sheets[sheets.length - 1]?.wrap.querySelector('.sheet');
const sheetHead = (title, extra = '') => `<div class="sheet-head"><h2>${esc(title)}</h2>${extra}<button class="icon-btn" data-act="close-sheet" aria-label="Fermer">${ICON.close}</button></div>`;

function confirmSheet(message, okLabel = 'Confirmer', danger = true) {
  return new Promise((resolve) => {
    let done = false;
    const el = openSheet(`<p style="font-size:17px;font-weight:600;margin:4px 0 16px">${esc(message)}</p>
      <div class="grid2"><button class="btn" data-x="no">Annuler</button><button class="btn ${danger ? 'primary' : 'primary'}" data-x="yes" style="${danger ? 'background:var(--danger);border-color:var(--danger)' : ''}">${esc(okLabel)}</button></div>`,
      { onClose: () => { if (!done) resolve(false); } });
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-x]');
      if (!b) return;
      done = true;
      resolve(b.dataset.x === 'yes');
      closeSheet();
    });
  });
}

const Scanner = {
  el: null, stream: null, controls: null, raf: 0, done: false,
  async open(onCode) {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      toast('Caméra indisponible : ouvrez l\'app en https');
      return manualEntry(onCode);
    }
    if (!store.get('camExplained', false)) {
      const ok = await new Promise((resolve) => {
        let done = false;
        const el = openSheet(`<div style="text-align:center;padding:8px 4px 4px">
          <div style="width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center">${ICON.camera.replace('<svg', '<svg width="36" height="36"')}</div>
          <h2 style="margin:0 0 8px">Autoriser l'appareil photo</h2>
          <p class="muted" style="margin:0 0 18px">Pour scanner le code-barres d'un produit, l'application a besoin d'accéder à votre appareil photo. Aucune image n'est enregistrée.</p>
          <button class="btn primary block" data-x="yes">Autoriser l'accès</button>
          <button class="btn block" data-x="no" style="margin-top:8px;border:0">Saisir le code à la main</button></div>`,
          { onClose: () => { if (!done) resolve(null); } });
        el.addEventListener('click', (e) => {
          const b = e.target.closest('[data-x]');
          if (!b) return;
          done = true;
          resolve(b.dataset.x === 'yes');
          closeSheet();
        });
      });
      if (ok === null) return;
      if (!ok) return manualEntry(onCode);
      store.set('camExplained', true);
    }
    this.done = false;
    this.el = document.createElement('div');
    this.el.className = 'scanner';
    this.el.innerHTML = `<video playsinline muted autoplay></video><div class="frame"></div>
      <div class="top"><button class="icon-btn" data-sc="close" aria-label="Fermer">${ICON.close}</button>
      <button class="icon-btn" data-sc="torch" aria-label="Lampe" hidden>${ICON.sparkle}</button></div>
      <div class="hint">Placez le code-barres dans le cadre</div>
      <div class="bottom"><button class="btn" data-sc="manual">Saisir le code</button></div>`;
    document.body.append(this.el);
    this.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sc]');
      if (!b) return;
      if (b.dataset.sc === 'close') this.close();
      if (b.dataset.sc === 'manual') { this.close(); manualEntry(onCode); }
      if (b.dataset.sc === 'torch') this.toggleTorch();
    });
    const video = $('video', this.el);
    const found = (code) => {
      if (this.done || !/^\d{8,14}$/.test(code)) return;
      this.done = true;
      navigator.vibrate?.(80);
      this.close();
      onCode(code);
    };
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = this.stream;
      await video.play();
      const track = this.stream.getVideoTracks()[0];
      if (track?.getCapabilities?.().torch) $('[data-sc="torch"]', this.el).hidden = false;

      const formats = 'BarcodeDetector' in window ? await Promise.resolve(BarcodeDetector.getSupportedFormats?.()).catch(() => []) : [];
      const native = Array.isArray(formats) && formats.includes('ean_13');
      if (native) {
        const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
        const loop = async () => {
          if (!this.el || this.done) return;
          try {
            const codes = await detector.detect(video);
            if (codes[0]) return found(codes[0].rawValue);
          } catch { /* image non prête */ }
          this.raf = requestAnimationFrame(loop);
        };
        loop();
      } else {
        await waitFor(() => window.ZXingBrowser);
        const reader = new ZXingBrowser.BrowserMultiFormatReader();
        this.controls = await reader.decodeFromVideoElement(video, (res) => { if (res) found(res.getText()); });
      }
    } catch (e) {
      this.close();
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
        openSheet(`${sheetHead('Accès à la caméra refusé')}<p>Pour scanner, autorisez l'appareil photo :</p>
          <ul class="muted"><li><b>iPhone</b> : Réglages › Safari › Appareil photo › Autoriser</li><li><b>Android</b> : icône à gauche de l'adresse › Autorisations › Caméra</li></ul>
          <button class="btn primary block" data-act="close-sheet">Compris</button>`);
      } else {
        fail(e, 'Impossible de démarrer la caméra');
      }
    }
  },
  async toggleTorch() {
    const track = this.stream?.getVideoTracks()[0];
    if (!track) return;
    this.torch = !this.torch;
    try { await track.applyConstraints({ advanced: [{ torch: this.torch }] }); } catch { /* non supporté */ }
  },
  close() {
    cancelAnimationFrame(this.raf);
    try { this.controls?.stop(); } catch { /* déjà arrêté */ }
    this.controls = null;
    this.stream?.getTracks().forEach((t) => t.stop());
    this.stream = null;
    this.torch = false;
    this.el?.remove();
    this.el = null;
  },
};
async function waitFor(fn, ms = 8000) {
  const t0 = Date.now();
  while (!fn()) {
    if (Date.now() - t0 > ms) throw new Error('Lecteur de code-barres non chargé');
    await sleep(100);
  }
}
function manualEntry(onCode) {
  const el = openSheet(`${sheetHead('Saisir un code-barres')}
    <form class="row" data-form="ean"><input class="input grow" name="ean" inputmode="numeric" pattern="\\d{8,14}" placeholder="Ex. 3017620422003" required autofocus>
    <button class="btn primary">OK</button></form>`);
  $('form', el).addEventListener('submit', (e) => {
    e.preventDefault();
    const code = e.target.ean.value.trim();
    closeSheet();
    onCode(code);
  });
  setTimeout(() => $('input', el)?.focus(), 300);
}

const UNITS = ['', 'g', 'kg', 'ml', 'cl', 'l', 'pièce', 'c. à s.', 'c. à c.', 'pincée', 'gousse', 'tranche', 'botte', 'sachet', 'boîte', 'pot', 'verre'];
const AISLES = ['Fruits & légumes', 'Boucherie & poissonnerie', 'Crèmerie & œufs', 'Fromages', 'Boulangerie', 'Épicerie salée', 'Épicerie sucrée', 'Conserves', 'Surgelés', 'Boissons', 'Herbes & épices', 'Autres'];
const AISLE_WORDS = {
  'Fruits & légumes': 'oignon, echalote, ail, carotte, courgette, tomate, poivron, aubergine, pomme, poire, banane, citron, orange, salade, laitue, epinard, brocoli, chou, poireau, celeri, concombre, champignon, pomme de terre, patate, avocat, fraise, framboise, myrtille, kiwi, mangue, ananas, radis, navet, betterave, potiron, butternut, courge, haricot vert, petit pois, mais, fenouil, artichaut, asperge, raisin, peche, abricot, gingembre, citron vert',

};
const AISLE_INDEX = Object.entries(AISLE_WORDS)
  .flatMap(([aisle, words]) => words.split(',').map((w) => [ingKey(w), aisle]))
  .sort((a, b) => b[0].length - a[0].length);

function guessAisle(name) {
  const n = ` ${ingKey(name)} `;
  for (const [w, aisle] of AISLE_INDEX) if (n.includes(` ${w} `)) return aisle;
  for (const [w, aisle] of AISLE_INDEX) if (w.length >= 4 && n.includes(` ${w}`)) return aisle;
  return 'Autres';
}

const UNIT_RE = /^(kg|g|mg|l|cl|dl|ml|litres?|grammes?|cuill[eè]res?\s+[àa]\s+soupe|cuill\.?\s*[àa]\s*s\.?|c\.?\s*[àa]\s*s\.?|cas|cuill[eè]res?\s+[àa]\s+caf[eé]|cuill\.?\s*[àa]\s*c\.?|c\.?\s*[àa]\s*c\.?|cac|pinc[ée]es?|gousses?|tranches?|bottes?|sachets?|bo[iî]tes?|pots?|verres?|brins?|feuilles?|morceaux?)\b\.?/i;
function mapUnit(u) {
  const x = norm(u);
  if (!x) return '';
  if (/^(kg)$/.test(x)) return 'kg';
  if (/^(g|grammes?)$/.test(x)) return 'g';
  if (x === 'mg') return 'g';
  if (/^(l|litres?)$/.test(x)) return 'l';
  if (x === 'cl') return 'cl';
  if (x === 'dl') return 'cl';
  if (x === 'ml') return 'ml';
  if (/soupe|^c a s|^cas$|^cuill a s/.test(x)) return 'c. à s.';
  if (/cafe|^c a c|^cac$|^cuill a c/.test(x)) return 'c. à c.';
  if (/pincee/.test(x)) return 'pincée';
  if (/gousse/.test(x)) return 'gousse';
  if (/tranche/.test(x)) return 'tranche';
  if (/botte/.test(x)) return 'botte';
  if (/sachet/.test(x)) return 'sachet';
  if (/boite/.test(x)) return 'boîte';
  if (/pot/.test(x)) return 'pot';
  if (/verre/.test(x)) return 'verre';
  return 'pièce';
}
const FRAC = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3 };
function parseQty(s) {
  const m = String(s).match(/^\s*(?:(\d+)\s+(\d+)\/(\d+)|(\d+)\/(\d+)|(\d+(?:[.,]\d+)?)\s*([½¼¾⅓⅔])?|([½¼¾⅓⅔]))/);
  if (!m) return null;
  let v;
  if (m[1]) v = Number(m[1]) + Number(m[2]) / Number(m[3]);
  else if (m[4]) v = Number(m[4]) / Number(m[5]);
  else if (m[6]) v = Number(m[6].replace(',', '.')) + (m[7] ? FRAC[m[7]] : 0);
  else v = FRAC[m[8]];
  return isFinite(v) ? { v, len: m[0].length } : null;
}
function parseIngredientLine(line) {
  let s = String(line).replace(/\s+/g, ' ').trim();
  let qty = '';
  let unit = '';
  const q = parseQty(s);
  if (q && q.len) {
    qty = fmtNum(q.v).replace(',', '.');
    s = s.slice(q.len).trim();
    const u = s.match(UNIT_RE);
    if (u) { unit = mapUnit(u[0]); s = s.slice(u[0].length).trim(); if (norm(u[0]) === 'mg') qty = String(Number(qty) / 1000); if (norm(u[0]) === 'dl') qty = String(Number(qty) * 10); }
    else unit = 'pièce';
  }
  s = s.replace(/^(de la |de l'|de l’|d'|d’|de |des |du )/i, '').trim();
  const name = s.charAt(0).toUpperCase() + s.slice(1);
  return { name, qty, unit, aisle: guessAisle(name) };
}

const STEP_ACTIONS = {
  prep: 'Épluchage & découpe',
  four: 'Cuisson au four',
  feculent: 'Féculents & céréales',

};
function detectAction(text) {
  const t = norm(text);
  if (/\d+\s?°/.test(text) || /\b(four|enfourn\w*|gratin\w*|thermostat|th \d+|rotir|\d+ degres)\b/.test(t)) return 'four';
  if (/\b(pates|riz|quinoa|semoule|boulgour|lentilles|pommes de terre|pomme de terre|patates|coquillettes|spaghetti)\b/.test(t) && /\b(cuire|cuisson|bouillir|eau bouillante|egoutter)/.test(t)) return 'feculent';
  if (/\b(eplucher|peler|couper|emincer|hacher|ciseler|raper|tailler|laver|detailler|cubes?|rondelles?|lamelles?|epepiner)/.test(t)) return 'prep';
  if (/\b(sauce|vinaigrette|marinade|mariner|assaisonn|pesto|mayonnaise|emulsionner)/.test(t)) return 'sauce';
  if (/\b(cuire|poele|revenir|saisir|mijoter|dorer|sauter|frire|bouillir|cocotte|casserole|wok|braiser)/.test(t)) return 'cuisson';
  return 'autre';
}

function scaleQty(qty, factor) {

const isNewRecipe = () => editing && !state.recipes.some((x) => x.id === editing.id);

function onEditorInput(e) {
  const t = e.target;
  if (!editing) return;
  if (t.dataset.f) {
    const f = t.dataset.f;
    if (f === 'tags') editing.tags = t.value.split(',').map((x) => x.trim().toLowerCase()).filter(Boolean);
    else if (['servings', 'prep_min', 'cook_min'].includes(f)) editing[f] = Math.max(0, parseInt(t.value, 10) || 0);
    else editing[f] = t.value;
  }
  const ingRow = t.closest('[data-i]');
  if (t.dataset.g && ingRow) {
    const ing = editing.ingredients[Number(ingRow.dataset.i)];
    ing[t.dataset.g] = t.value;
    if (t.dataset.g === 'name' && !ing.aisleManual) {
      ing.aisle = guessAisle(t.value);
      const sel = $('[data-g="aisle"]', ingRow);
      if (sel) sel.value = ing.aisle;
    }
    if (t.dataset.g === 'aisle') ing.aisleManual = true;
  }
  const stepRow = t.closest('[data-s]');
  if (t.dataset.h && stepRow) {
    const s = editing.steps[Number(stepRow.dataset.s)];
    if (t.dataset.h === 'text') {
      s.text = t.value;
      if (!s.actionManual) {
        s.action = detectAction(t.value);
        const sel = $('[data-h="action"]', stepRow);
        if (sel) sel.value = s.action;
        if (!s.aheadManual) {
          s.ahead = AHEAD_DEFAULT.has(s.action) && s.action !== 'cuisson';
          const cb = $('[data-h="ahead"]', stepRow);
          if (cb) cb.checked = s.ahead;
        }
      }
    }
    if (t.dataset.h === 'min') s.min = Math.max(0, parseInt(t.value, 10) || 0);
  }
}
function onEditorChange(e, el) {
  const t = e.target;
  if (!editing) return;
  const stepRow = t.closest('[data-s]');
  if (t.dataset.h === 'ahead' && stepRow) { const s = editing.steps[Number(stepRow.dataset.s)]; s.ahead = t.checked; s.aheadManual = true; }
  if (t.dataset.h === 'action' && stepRow) { const s = editing.steps[Number(stepRow.dataset.s)]; s.action = t.value; s.actionManual = true; }
  if (t.dataset.g === 'aisle' || t.dataset.g === 'unit') onEditorInput(e);
  if (t.dataset.ed === 'photo' && t.files?.[0]) uploadPhoto(t.files[0], el);
}
async function onEditorClick(e, el) {
  const b = e.target.closest('[data-ed]');
  if (!b || !editing) return;
  const act = b.dataset.ed;
  if (act === 'photo') return;
  e.preventDefault();
  if (act === 'save') return saveEditor(b);
  if (act === 'import') return importFromUrl();
  if (act === 'photo-del') { editing.photo_url = null; drawEditor(el); }
  if (act === 'ing-del') { editing.ingredients.splice(Number(b.dataset.i), 1); drawEditor(el); }
  if (act === 'step-del') { editing.steps.splice(Number(b.dataset.s), 1); drawEditor(el); }
  if (act === 'step-add') {
    editing.steps.push({ text: '', min: 0, ahead: false, action: 'autre' });
    drawEditor(el);
    const areas = $$('[data-h="text"]', el);
    areas[areas.length - 1]?.focus();
  }
  if (act === 'ing-scan') {
    Scanner.open((code) => showProduct(code, {
      record: true,
      onPick: (p, score) => {
        if (!editing) return;
        const name = p.product_name_fr || p.product_name || code;
        editing.ingredients.push({ name, qty: '', unit: 'pièce', aisle: guessAisle(name), ean: p.code, score });
        drawEditor(el);
        toast('Ingrédient ajouté : indiquez la quantité');
      },
    }));
  }
}
document.addEventListener('submit', (e) => {

  if (f.dataset.edForm === 'ing' && editing) {

    const name = f.ingname.value.trim();

    editing.ingredients.push({ name: name.charAt(0).toUpperCase() + name.slice(1), qty: f.qty.value.trim().replace(',', '.'), unit: f.unit.value, aisle: guessAisle(name) });

});

async function saveEditor(btn) {
  const r = editing;
  if (!r.title.trim()) { toast('Donnez un titre à la recette'); $('[data-f="title"]', topSheet())?.focus(); return; }

      steps: r.steps.filter((s) => s.text.trim()).map(({ actionManual, aheadManual, ...s }) => ({ ...s, text: s.text.trim() })),

async function uploadPhoto(file, el) {
  toast('Envoi de la photo…');
  try {
    const blob = await resizeImage(file, 1280);
    const path = `${uid()}.jpg`;
    const { error } = await db.storage.from('recipe-photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (error) throw error;
    editing.photo_url = db.storage.from('recipe-photos').getPublicUrl(path).data.publicUrl;
    drawEditor(el);
    toast('Photo ajoutée');
  } catch (err) { fail(err, 'Photo non envoyée'); }
}
function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error('Conversion impossible'))), 'image/jpeg', 0.82);
    };
    img.onerror = () => reject(new Error('Image illisible'));
    img.src = url;
  });
}

function setupStepDrag(el) {
  const box = $('#ed-steps', el);
  if (!box) return;
  box.addEventListener('pointerdown', (e) => {
    const h = e.target.closest('[data-handle]');
    if (!h) return;
    e.preventDefault();
    const row = h.closest('.ed-step');
    row.classList.add('dragging');
    h.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const rows = $$('.ed-step', box).filter((r) => r !== row);
      const after = rows.find((r) => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
      if (after) box.insertBefore(row, after); else box.append(row);
    };
    const up = () => {
      h.removeEventListener('pointermove', move);
      h.removeEventListener('pointerup', up);
      h.removeEventListener('pointercancel', up);
      row.classList.remove('dragging');
      const order = $$('.ed-step', box).map((r) => Number(r.dataset.s));
      if (order.some((v, i) => v !== i)) {
        editing.steps = order.map((i) => editing.steps[i]);
        drawEditor(el);
      }
    };
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  });
}

function importFromUrl() {
  const el = openSheet(`${sheetHead('Importer une recette')}

  $('form', el).addEventListener('submit', async (e) => {
    e.preventDefault();

    btn.textContent = 'Import en cours…';
    try {
      const { data, error } = await db.functions.invoke('import-recipe', { body: { url: e.target.url.value.trim() } });
      if (error) {
        let msg = 'Import impossible';
        try { msg = (await error.context.json()).error || msg; } catch { /* réponse non JSON */ }
        throw new Error(msg);
      }
      const r = editing || blankRecipe();
      r.title = data.title || r.title;
      r.photo_url = data.image || r.photo_url;
      r.servings = data.servings || r.servings;
      r.prep_min = data.prep_min || 0;
      r.cook_min = data.cook_min || 0;
      r.source_url = data.source_url;
      r.ingredients = data.ingredients.map(parseIngredientLine);
      r.steps = data.steps.map((text) => { const action = detectAction(text); return { text, min: 0, action, ahead: AHEAD_DEFAULT.has(action) && action !== 'cuisson' }; });
      closeSheet();
      if (editing) { drawEditor(topSheet()); toast('Recette importée : vérifiez les quantités'); }
      else openEditor(r, { fromImport: true });
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Importer';
      toast(err.message || 'Import impossible');
    }
  });
}

// --- Mode cuisine ---
async function cookMode(id) {
  const r = recipeById(id);
  if (!r?.steps?.length) { toast('Cette recette n\'a pas d\'étapes'); return; }
  let i = 0;
  let timer = null;
  let remaining = 0;
  let lock = null;
  try { lock = await navigator.wakeLock?.request('screen'); } catch { /* non supporté */ }
  const el = document.createElement('div');
  el.className = 'cook';
  document.body.append(el);
  const stopTimer = () => { clearInterval(timer); timer = null; };
  const beep = () => {
    navigator.vibrate?.([300, 150, 300]);
    try {
      const ctx = new AudioContext();
      [0, 0.35, 0.7].forEach((t) => { const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2); });
    } catch { /* audio indisponible */ }
  };
  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const draw = () => {
    const s = r.steps[i];
    el.innerHTML = `<div class="row"><button class="icon-btn" data-c="close" aria-label="Quitter">${ICON.close}</button><b class="grow">${esc(r.title)}</b><span class="muted">${i + 1}/${r.steps.length}</span></div>
      <div class="progress"><i style="width:${((i + 1) / r.steps.length) * 100}%"></i></div>
      <div class="step-text">${esc(s.text)}</div>
      ${s.min ? `<div class="timer" id="tm">${fmt(remaining || s.min * 60)}</div><button class="btn soft block" data-c="timer" style="margin-bottom:12px">${timer ? 'Arrêter le minuteur' : `Lancer le minuteur (${s.min} min)`}</button>` : ''}
      <div class="nav"><button class="btn" data-c="prev" ${i === 0 ? 'disabled' : ''}>${ICON.back} Précédent</button>
      <button class="btn primary" data-c="next">${i === r.steps.length - 1 ? 'Terminer' : `Suivant ${ICON.next}`}</button></div>`;
  };
  const close = () => { stopTimer(); try { lock?.release(); } catch { /* déjà libéré */ } el.remove(); };
  el.addEventListener('click', (e) => {
    const c = e.target.closest('[data-c]')?.dataset.c;
    if (!c) return;
    if (c === 'close') return close();
    if (c === 'prev' && i > 0) { stopTimer(); remaining = 0; i--; }
    if (c === 'next') { if (i === r.steps.length - 1) { close(); toast('Bon appétit !'); return; } stopTimer(); remaining = 0; i++; }
    if (c === 'timer') {
      if (timer) { stopTimer(); remaining = 0; }
      else {
        remaining = r.steps[i].min * 60;
        timer = setInterval(() => {
          remaining--;
          const tm = $('#tm', el);
          if (tm) tm.textContent = fmt(Math.max(0, remaining));
          if (remaining <= 0) { stopTimer(); beep(); toast('Minuteur terminé'); draw(); }
        }, 1000);
      }
    }
    draw();
  });
  draw();
}

function renderPlanning() {
  const v = state.planView;
  const end = addDays(state.week, 6);
  return `
    <div class="week-nav"><button class="icon-btn" data-act="week" data-d="-1" aria-label="Semaine précédente">${ICON.back}</button>

      <button class="icon-btn" data-act="week-menu" aria-label="Actions de la semaine">${ICON.dots}</button></div>
    <div class="seg" role="group">${[['semaine', 'Semaine'], ['batch', 'Batch'], ['courses', 'Courses']].map(([k, l]) => `<button aria-pressed="${v === k}" data-act="plan-view" data-v="${k}">${l}</button>`).join('')}</div>
    ${v === 'semaine' ? renderWeek() : v === 'batch' ? renderBatch() : renderShopping()}`;
}

function renderWeek() {
  const today = isoDate(new Date());
  const mv = state.moving;
  const days = DAYS.map((d, i) => {
    const date = addDays(state.week, i);
    const slots = ['midi', 'soir'].map((slot) => {
      const m = state.plan.find((x) => x.day === i && x.slot === slot);
      const r = m && recipeById(m.recipe_id);
      const isMoving = mv && mv.day === i && mv.slot === slot;
      const cls = `slot ${isMoving ? 'moving' : mv ? 'target' : ''}`;
      if (!r) return `<button class="${cls}" data-act="slot" data-d="${i}" data-s="${slot}"><span class="when">${slot}</span><span class="add">${ICON.plus} Ajouter un repas</span></button>`;
      const img = safeUrl(r.photo_url);
      return `<button class="${cls}" data-act="slot" data-d="${i}" data-s="${slot}"><span class="when">${slot}</span>
        ${img ? `<img class="sthumb" src="${esc(img)}" alt="" loading="lazy">` : `<span class="sthumb">${ICON.chef}</span>`}
        <span class="grow"><span class="prod-name" style="font-size:15px">${esc(r.title)}</span><span class="meta">${ICON.users} ${m.servings} pers.</span></span></button>`;
    }).join('');
    return `<div class="day ${isoDate(date) === today ? 'today' : ''}"><h3><span>${d}</span><span class="muted small">${fmtDay(date)}</span></h3>${slots}</div>`;
  }).join('');
  const filled = state.plan.length;
  return `${mv ? `<div class="move-banner">${ICON.move}<span class="grow">Touchez la case de destination</span><button class="btn small" data-act="cancel-move">Annuler</button></div>` : ''}
    <p class="muted small" style="margin:0 0 10px">${filled}/14 repas planifiés${state.recipes.length ? '' : ' · créez d\'abord des recettes dans l\'onglet Recettes'}</p>
    <div class="day-grid">${days}</div>`;
}

function recipePicker(onPick, { title = 'Choisir une recette' } = {}) {
  if (!state.recipes.length) {
    toast('Ajoutez d\'abord des recettes');
    switchTab('recettes');
    return;
  }
  const el = openSheet(`${sheetHead(title)}
    <div class="searchbar" style="margin-bottom:10px">${ICON.search}<input class="input" type="search" placeholder="Rechercher…" data-pick-q aria-label="Rechercher"></div>
    <div id="pick-list"></div>`);
  const draw = (q = '') => {
    const nq = norm(q);
    const list = state.recipes.filter((r) => !nq || norm(r.title + ' ' + (r.tags || []).join(' ')).includes(nq));
    $('#pick-list', el).innerHTML = list.map((r) => {

async function onSlot(day, slot) {
  const m = state.plan.find((x) => x.day === day && x.slot === slot);
  if (state.moving) {
    const src = state.moving;
    state.moving = null;
    if (src.day === day && src.slot === slot) return render();
    const a = state.plan.find((x) => x.day === src.day && x.slot === src.slot);
    try {
      const ids = [a?.id, m?.id].filter(Boolean);
      const aData = a && { recipe_id: a.recipe_id, servings: a.servings };

function weekMenu() {
  const el = openSheet(`${sheetHead('Actions de la semaine')}<div class="menu-list">
    <button data-m="dup">${ICON.copy} Copier la semaine précédente</button>
    <button data-m="random">${ICON.shuffle} Remplir les cases vides au hasard</button>
    <button data-m="today">${ICON.clock} Revenir à cette semaine</button>
    <button data-m="clear" style="color:var(--danger)">${ICON.trash} Vider la semaine</button></div>`);
  el.addEventListener('click', async (e) => {
    const act = e.target.closest('[data-m]')?.dataset.m;
    if (!act) return;
    closeSheet();
    try {
      if (act === 'today') { state.week = mondayOf(new Date()); await Data.loadWeek(); }
      if (act === 'dup') {
        const { data, error } = await db.from('meal_plan').select('*').eq('week', isoDate(addDays(state.week, -7)));
        if (error) throw error;
        if (!data.length) { toast('La semaine précédente est vide'); return; }
        for (const m of data) if (!state.plan.some((x) => x.day === m.day && x.slot === m.slot)) await Data.setMeal(m.day, m.slot, m.recipe_id, m.servings);
        toast('Semaine précédente copiée dans les cases vides');
      }
      if (act === 'random') {
        if (!state.recipes.length) { toast('Ajoutez d\'abord des recettes'); return; }
        const used = new Map();
        state.plan.forEach((m) => used.set(m.recipe_id, (used.get(m.recipe_id) || 0) + 1));
        let n = 0;
        for (let d = 0; d < 7; d++) for (const slot of ['midi', 'soir']) {
          if (state.plan.some((x) => x.day === d && x.slot === slot)) continue;
          const pool = [...state.recipes].sort((a, b) => (used.get(a.id) || 0) - (used.get(b.id) || 0) || Math.random() - 0.5);
          const r = pool[0];
          used.set(r.id, (used.get(r.id) || 0) + 1);
          await Data.setMeal(d, slot, r.id, state.settings.default_servings);
          n++;
        }
        toast(n ? `${n} repas ajoutés` : 'La semaine est déjà complète');
      }
      if (act === 'clear') {
        if (!state.plan.length) return;
        if (!(await confirmSheet('Vider tous les repas de cette semaine ?', 'Vider'))) return;
        await Data.removeMeals(state.plan.map((m) => m.id));
      }
      render();
    } catch (err) { fail(err); }
  });
}

// --- Batch cooking ---
const BATCH_PHASES = [
  { key: 'prep', title: 'Mise en place : épluchage & découpe', tip: 'Préchauffez le four dès maintenant si une cuisson au four est prévue.' },
  { key: 'four', title: 'Lancer les cuissons au four', tip: 'Enfournez tout ce qui peut cuire ensemble, puis enchaînez sur les étapes suivantes pendant la cuisson.' },
  { key: 'feculent', title: 'Féculents & céréales', tip: 'Cuisez-les en grande quantité dans une seule casserole quand c\'est possible.' },
  { key: 'cuisson', title: 'Cuissons à la poêle / casserole', tip: '' },
  { key: 'sauce', title: 'Sauces, marinades & assaisonnements', tip: 'Gardez les sauces à part pour que les plats restent croquants.' },
  { key: 'autre', title: 'Autres préparations', tip: '' },
];
function computeBatch() {
  const meals = [...state.plan].sort((a, b) => a.day - b.day || (a.slot === 'midi' ? -1 : 1));
  const byRecipe = new Map();
  for (const m of meals) {
    const r = recipeById(m.recipe_id);
    if (!r) continue;
    const e = byRecipe.get(r.id) || { r, servings: 0, meals: [] };
    e.servings += m.servings;
    e.meals.push(m);
    byRecipe.set(r.id, e);
  }
  const phases = Object.fromEntries(BATCH_PHASES.map((p) => [p.key, []]));
  const sameDay = [];
  const mergedIng = new Map();
  for (const { r, servings } of byRecipe.values()) {
    const steps = (r.steps || []).filter((s) => s.ahead);
    if (!steps.length) { sameDay.push(r.title); continue; }
    const f = servings / (r.servings || 1);
    for (const s of steps) {
      phases[s.action in phases ? s.action : 'autre'].push({ recipe: r.title, text: s.text, min: Number(s.min) || 0, servings });
      if (s.action === 'prep') {
        const t = ` ${ingKey(s.text)} `;
        for (const ing of r.ingredients || []) {
          const k = ingKey(ing.name);
          const first = k.split(' ')[0];
          if (!first || !(t.includes(` ${k}`) || t.includes(` ${first}`))) continue;
          const { base, mult } = unitBase(ing.unit);
          const key = `${k}|${base}`;
          const cur = mergedIng.get(key) || { name: ing.name, base, qty: 0, recipes: new Set(), noQty: false };
          const q = parseFloat(String(ing.qty).replace(',', '.'));
          if (isFinite(q)) cur.qty += q * mult * f; else cur.noQty = true;
          cur.recipes.add(r.title);
          mergedIng.set(key, cur);
        }
      }
    }
  }
  const sum = (k) => phases[k].reduce((a, s) => a + (s.min || 5), 0);
  const ovenMax = Math.max(0, ...phases.four.map((s) => s.min || 30));
  const parallel = sum('feculent') + sum('cuisson') + sum('sauce') + sum('autre');
  const stepsCount = Object.values(phases).reduce((a, l) => a + l.length, 0);
  const total = stepsCount ? sum('prep') + Math.max(ovenMax, parallel) + 15 : 0;
  return { meals, byRecipe, phases, sameDay, mergedIng: [...mergedIng.values()], total, stepsCount };
}
function renderBatch() {
  if (!state.plan.length) return `<div class="empty">${ICON.flame}<p>Planifiez des repas pour générer votre session de batch cooking.</p><button class="btn primary" data-act="plan-view" data-v="semaine">Remplir la semaine</button></div>`;
  const b = computeBatch();
  if (!b.stepsCount) return `<div class="empty">${ICON.flame}<p>Aucune étape n'est marquée « À l'avance » dans les recettes de la semaine.</p><p class="small">Modifiez vos recettes et cochez « À l'avance » sur les étapes à préparer pendant la session.</p></div>`;
  let n = 0;
  const h = Math.floor(b.total / 60);
  const phasesHtml = BATCH_PHASES.filter((p) => b.phases[p.key].length).map((p) => {
    n++;
    const merged = p.key === 'prep' && b.mergedIng.length
      ? `<div class="ed-block small" style="margin-top:8px"><b>À préparer en une seule fois :</b><ul style="margin-top:4px">${b.mergedIng.map((m) => `<li>${esc(m.name)}${m.qty ? ` : ${esc(fmtQtyBase(m.qty, m.base))}` : ''} <span class="muted">(${esc([...m.recipes].join(', '))})</span></li>`).join('')}</ul></div>`
      : '';
    return `<div class="phase"><h3><span class="num">${n}</span>${esc(p.title)}</h3>${p.tip ? `<p class="muted small" style="margin:0">${esc(p.tip)}</p>` : ''}${merged}
      <ul>${b.phases[p.key].map((s) => `<li><span class="rec">${esc(s.recipe)}</span>${esc(s.text)}${s.min ? ` <span class="muted small">· ${s.min} min</span>` : ''}</li>`).join('')}</ul></div>`;
  }).join('');
  const storage = b.meals.map((m) => {
    const r = recipeById(m.recipe_id);
    if (!r || !(r.steps || []).some((s) => s.ahead)) return '';
    const freeze = m.day >= 3;
    return `<li><b>${DAYS[m.day]} ${m.slot}</b> — ${esc(r.title)} (${m.servings} pers.) : ${freeze ? 'au <b>congélateur</b>, à sortir la veille au réfrigérateur' : 'au <b>réfrigérateur</b>, en boîte hermétique (3 jours max)'}</li>`;
  }).join('');
  return `
    <div class="summary-box"><div><strong>${h ? `${h} h ${String(b.total % 60).padStart(2, '0')}` : `${b.total} min`}</strong><span>durée estimée</span></div>
      <div><strong>${b.byRecipe.size}</strong><span>recettes</span></div><div><strong>${b.meals.length}</strong><span>repas couverts</span></div></div>
    <p class="muted small" style="margin:0 0 12px">Session à faire le dimanche (ou la veille du premier repas). Les étapes de toutes les recettes sont regroupées par type pour enchaîner sans temps mort.</p>
    ${phasesHtml}
    <div class="phase"><h3><span class="num">${n + 1}</span>Refroidir, portionner, stocker</h3>
      <p class="muted small" style="margin:0">Laissez refroidir moins de 2 h avant de fermer les boîtes. Étiquetez chaque boîte avec le jour et le repas.</p>
      <ul>${storage}</ul></div>
    ${b.sameDay.length ? `<div class="phase"><h3>À cuisiner le jour même</h3><ul>${b.sameDay.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}`;
}

function unitBase(u) {
  switch (u) {
    case 'kg': return { base: 'g', mult: 1000 };
    case 'g': return { base: 'g', mult: 1 };
    case 'l': return { base: 'ml', mult: 1000 };
    case 'cl': return { base: 'ml', mult: 10 };
    case 'ml': return { base: 'ml', mult: 1 };
    default: return { base: u || '', mult: 1 };
  }
}
const COUNTABLE = new Set(['pièce', 'gousse', 'tranche', 'botte', 'sachet', 'boîte', 'pot', '']);
function fmtQtyBase(q, base) {
  if (base === 'g' && q >= 1000) return `${fmtNum(q / 1000)} kg`;
  if (base === 'ml' && q >= 1000) return `${fmtNum(q / 1000)} l`;
  if (COUNTABLE.has(base)) return `${Math.ceil(q - 0.01)}${base && base !== 'pièce' ? ` ${base}${Math.ceil(q - 0.01) > 1 && !base.endsWith('s') ? 's' : ''}` : ''}`;
  return `${fmtNum(q)} ${base}`;
}
function buildShopping() {
  const items = new Map();
  for (const m of state.plan) {
    const r = recipeById(m.recipe_id);
    if (!r) continue;
    const f = m.servings / (r.servings || 1);
    for (const ing of r.ingredients || []) {
      const { base, mult } = unitBase(ing.unit);
      const k = ingKey(ing.name);
      const key = `${k}|${base}`;
      const it = items.get(key) || { key, ingKey: k, name: ing.name, base, qty: 0, noQty: false, aisle: ing.aisle || guessAisle(ing.name), recipes: new Set() };
      const q = parseFloat(String(ing.qty).replace(',', '.'));
      if (isFinite(q) && q > 0) it.qty += q * mult * f; else it.noQty = true;
      it.recipes.add(r.title);
      items.set(key, it);
    }
  }
  const byAisle = new Map(AISLES.map((a) => [a, []]));
  for (const it of items.values()) (byAisle.get(it.aisle) || byAisle.get('Autres')).push(it);
  for (const l of byAisle.values()) l.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  return { byAisle, count: items.size };
}
const qtyLabel = (it) => (it.qty ? fmtQtyBase(it.qty, it.base) : '');

function shoppingText() {

async function exportData() {
  try {
    const [plan] = await Promise.all([db.from('meal_plan').select('*')]);
    if (plan.error) throw plan.error;
    const data = { app: APP_NAME, version: 1, exported_at: new Date().toISOString(), settings: state.settings, recipes: state.recipes, meal_plan: plan.data, product_links: Object.values(state.links) };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = `sauvegarde-${isoDate(new Date())}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (err) { fail(err, 'Export impossible'); }
}
async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.recipes)) throw new Error('Fichier non reconnu');
    if (!(await confirmSheet(`Importer ${d.recipes.length} recette(s) et le planning ? Les éléments existants avec le même identifiant seront remplacés.`, 'Importer', false))) return;
    if (d.recipes.length) { const r = await db.from('recipes').upsert(d.recipes); if (r.error) throw r.error; }
    if (d.product_links?.length) { const r = await db.from('product_links').upsert(d.product_links); if (r.error) throw r.error; }
    if (d.meal_plan?.length) { const r = await db.from('meal_plan').upsert(d.meal_plan.map(({ id, ...m }) => m), { onConflict: 'week,day,slot' }); if (r.error) throw r.error; }
    if (d.settings) { const { id, updated_at, ...s } = d.settings; await Data.saveSettings(s); }
    await Data.loadAll();
    await Data.loadWeek();
    closeSheet(); render(); toast('Import terminé');
  } catch (err) { fail(err, 'Import impossible'); }
}

function render() {
  const main = $('#main');
  $('#title').textContent = { scan: APP_NAME, recettes: 'Mes recettes', planning: 'Ma semaine' }[state.tab];
  $$('.tabbar button').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false'));
  main.innerHTML = state.tab === 'scan' ? renderScan() : state.tab === 'recettes' ? renderRecipes() : renderPlanning();
}
function switchTab(tab) {
  state.tab = tab;
  state.moving = null;
  store.set('tab', tab);
  render();
  window.scrollTo({ top: 0 });
}

const ACTIONS = {
  tab: (b) => { while (sheets.length) closeSheet(); switchTab(b.dataset.tab); },
  'close-sheet': () => closeSheet(),
  settings: () => openSettings(),
  scan: () => Scanner.open((code) => showProduct(code)),
  'open-product': (b) => showProduct(b.dataset.ean, { record: false }),
  'retry-product': (b) => { closeSheet(); showProduct(b.dataset.ean); },
  'scan-filter': (b) => { state.scanFilter = b.dataset.v; render(); },
  'clear-scans': async () => { if (await confirmSheet('Effacer tout l\'historique des scans ?', 'Effacer')) { try { await Data.clearScans(); render(); } catch (e) { fail(e); } } },
  'new-recipe': () => openEditor(null),
  'import-url': () => importFromUrl(),
  seed: () => seedRecipes(),
  'recipe-chip': (b) => { state.recipeChip = b.dataset.v; render(); },
  'open-recipe': (b) => openRecipe(b.dataset.id),
  'recipe-menu': (b) => recipeMenu(b.dataset.id),
  'cook-mode': (b) => cookMode(b.dataset.id),
  'toggle-fav': async (b) => {
    const r = recipeById(b.dataset.id);
    try {
      await Data.saveRecipe({ ...r, favorite: !r.favorite });
      b.classList.toggle('fav', !r.favorite);
      b.innerHTML = !r.favorite ? ICON.heartFill : ICON.heart;
      render();
      closeSheet();
      openRecipe(r.id);
    } catch (e) { fail(e); }
  },
  week: async (b) => {
    state.week = addDays(state.week, 7 * Number(b.dataset.d));
    state.moving = null;
    try { await Data.loadWeek(); } catch (e) { fail(e); }
    render();
  },
  'week-menu': () => weekMenu(),
  'plan-view': (b) => { state.planView = b.dataset.v; state.moving = null; render(); },
  slot: (b) => onSlot(Number(b.dataset.d), b.dataset.s),
  'cancel-move': () => { state.moving = null; render(); },
  'link-item': (b) => linkItem(b.dataset.k, b.dataset.n),
  'copy-list': async () => {
    try { await navigator.clipboard.writeText(shoppingText()); toast('Liste copiée'); } catch { toast('Copie impossible sur ce navigateur'); }
  },
  'share-list': async () => {
    const text = shoppingText();
    if (navigator.share) { try { await navigator.share({ title: 'Liste de courses', text }); } catch { /* partage annulé */ } }
    else { try { await navigator.clipboard.writeText(text); toast('Partage indisponible : liste copiée'); } catch { toast('Partage indisponible'); } }
  },
};

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const fn = ACTIONS[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('submit', (e) => {
  const f = e.target;
  if (f.dataset.form === 'ean-inline') {
    e.preventDefault();
    const code = f.ean.value.trim();
    if (!/^\d{8,14}$/.test(code)) { toast('Code-barres invalide (8 à 14 chiffres)'); return; }
    f.reset();
    showProduct(code);
  }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.input === 'recipe-q') {
    state.recipeQuery = e.target.value;
    $('#recipe-results').innerHTML = recipeResults(recipeFilterList());
  }
});
document.addEventListener('change', async (e) => {
  const k = e.target.dataset.check;
  if (k == null) return;
  const row = e.target.closest('.shop-item');
  row?.classList.toggle('done', e.target.checked);
  try { await Data.setCheck(k, e.target.checked); } catch (err) { e.target.checked = !e.target.checked; row?.classList.toggle('done', e.target.checked); fail(err); }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (Scanner.el) Scanner.close();
  else if (sheets.length) closeSheet();
});

(async function init() {
  document.title = APP_NAME;
  try {
    await Data.loadAll();
    await Data.loadWeek();
    render();
  } catch (err) {
    $('#main').innerHTML = `<div class="empty"><p>Impossible de charger vos données.</p><button class="btn primary" onclick="location.reload()">Réessayer</button></div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
