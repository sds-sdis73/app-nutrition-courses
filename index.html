<style>
/* Thème « Pop gourmand » : vanille, fraise, menthe, mangue et réglisse ; contours épais et boutons en relief */
:root {
  --bg: #fff3d1;
  --surface: #ffffff;
  --surface-2: #fff8e6;
  --text: #27233a;
  --ink: #27233a;
  --muted: #6e6680;
  --border: #efd9a3;
  --primary: #dc3a3a;
  --primary-strong: #b52a2d;
  --primary-soft: #ffe1dc;
  --sage-light: #ff9e94;
  --on-primary: #ffffff;
  --mint: #06d6a0;
  --mint-soft: #d9f7e8;
  --mango: #ffd166;
  --mango-strong: #ffb703;
  --mango-soft: #fff0c2;
  --sky: #3aa6ff;
  --ring-track: #ffe7c7;
  --pop-shadow: #f2c35b;
  --display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --danger: #c4553f;
  --excellent: #2e8b57;
  --bon: #8cc15a;
  --mediocre: #eea84a;
  --mauvais: #dd5b3e;
  --shadow: 0 4px 0 var(--pop-shadow);
  --radius: 18px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.45 "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary-strong); }
img { display: block; max-width: 100%; }

/* En-tête et navigation */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: calc(10px + var(--safe-t)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.topbar h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -.01em; }
main { padding: 4px 16px calc(var(--nav-h) + var(--safe-b) + 24px); max-width: 760px; margin: 0 auto; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(7, 1fr);
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: var(--surface); border-top: 1px solid var(--border);
}
.tabbar button {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; min-width: 0; padding: 0 2px; color: var(--muted); font-weight: 700; font-size: 10px; line-height: 1;
}
.tabbar button span { display: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabbar button svg { width: 22px; height: 22px; flex: none; transition: transform .2s; }
.tabbar button[aria-current="page"] { color: var(--primary-strong); }
.tabbar button[aria-current="page"] span { display: block; }
.tabbar button[aria-current="page"] svg { background: var(--primary-soft); border-radius: 999px; padding: 3px 9px; box-sizing: content-box; transform: translateY(-1px); }
body.logged-out .tabbar, body.logged-out [data-act="settings"] { display: none; }
.auth { max-width: 400px; margin: 4vh auto 0; }
.auth .logo { width: 72px; height: 72px; border-radius: 20px; background: var(--primary); color: #fff; display: grid; place-items: center; margin: 0 auto 14px; }
.auth .logo svg { width: 40px; height: 40px; }
.auth h2 { text-align: center; margin: 0 0 4px; font-size: 24px; }
.auth > p { text-align: center; margin: 0 0 20px; }
.extra-form { display: grid; grid-template-columns: 1fr 76px 44px; gap: 6px; }
.extra-form select { grid-column: 1 / -1; }
.nutri-link { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; border: 0; background: none; padding: 0 0 2px; text-align: left; font-size: 13px; color: var(--muted); }
.nutri-link svg { width: 15px; height: 15px; flex: none; color: var(--primary); }
.warn { color: var(--mediocre); font-weight: 700; }
.ntable { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 14px; margin: 10px 0; }
.nt-title { font-weight: 800; margin-bottom: 4px; }
.nt-row { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
.nt-row:last-child { border-bottom: 0; }
.nt-row > span:first-child { flex: 1; }
.nt-row.sub > span:first-child { padding-left: 14px; color: var(--muted); }
.nt-row .pct { min-width: 48px; text-align: right; color: var(--muted); font-size: 13px; }
.nt-row .pct.over { color: var(--mauvais); font-weight: 700; }
.macro-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.macro-strip div { background: var(--primary-soft); border-radius: 12px; padding: 8px 4px; text-align: center; }
.macro-strip b { display: block; font-size: 14px; }
.macro-strip span { font-size: 11px; color: var(--muted); }
.ndetails { margin: 8px 0; }
.ndetails summary { cursor: pointer; font-weight: 700; padding: 8px 0; color: var(--primary-strong); }
.ing-nutri { list-style: none; padding: 0; margin: 0; }
.ing-nutri li { padding: 8px 0; border-bottom: 1px solid var(--border); }
.food-results { max-height: 52vh; overflow-y: auto; }
.food-row { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; border-bottom: 1px solid var(--border); background: none; text-align: left; padding: 10px 2px; }
.food-row .grow > * { display: block; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--sage-light); }
.bar.ok i { background: var(--primary); } .bar.over i { background: var(--mauvais); } .bar.low i { background: var(--mediocre); }
.mbar { padding: 6px 0; }
.mbar.sub .row > span:first-child { padding-left: 14px; color: var(--muted); }
.kcal-card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; margin: 10px 0; }
.kcal-card .big { font-size: 28px; }
.kcal-card .left { text-align: center; background: var(--primary-soft); border-radius: 12px; padding: 6px 10px; }
.kcal-card .left b { display: block; font-size: 18px; color: var(--primary-strong); }
.kcal-card .left span { font-size: 11px; color: var(--muted); }
.kcal-card .left.neg b { color: var(--mauvais); }
.slot-block { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 6px 6px 6px 14px; margin: 10px 0; }
.slot-block h3 { font-size: 16px; margin: 0; }
.entry { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
.entry .nm { font-weight: 600; }
.week-chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 8px; }
.wc-col { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; }
.wc-col.today .wc-day { color: var(--primary-strong); font-weight: 800; }
.wc-val { font-size: 10px; color: var(--muted); height: 14px; }
.wc-bar { position: relative; width: 70%; height: 140px; background: var(--surface-2); border-radius: 8px; overflow: hidden; display: flex; align-items: flex-end; }
.wc-bar i { width: 100%; background: var(--primary); border-radius: 8px 8px 0 0; }
.wc-bar i.over { background: var(--mauvais); } .wc-bar i.low { background: var(--mediocre); }
.wc-bar em { position: absolute; left: 0; right: 0; height: 2px; background: var(--text); opacity: .55; }
.wc-day { font-size: 12px; color: var(--muted); font-weight: 600; }
.hero { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
.hero-top { display: flex; gap: 12px; align-items: center; }
.bubble { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; font-size: 15px; line-height: 1.35; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 18px; border: 8px solid transparent; border-right-color: var(--border); border-left: 0; }
.bubble::after { content: ""; position: absolute; left: -6px; top: 19px; border: 7px solid transparent; border-right-color: var(--surface); border-left: 0; }
.rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.ring { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ring b { font-size: 12px; } .ring span { font-size: 11px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.scan-top { min-height: 52px; font-size: 17px; }
.nlp textarea { min-height: 64px; resize: none; }
.nlp-review { margin-top: 10px; }
.nlp-line { display: flex; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.nlp-line select { min-height: 38px; padding: 6px 8px; font-size: 14px; width: 100%; }
.nlp-line input[type=number] { width: 72px; min-height: 38px; padding: 6px 8px; flex: none; }
.quickkcal { margin: 10px 0 12px; }
.quickkcal summary { cursor: pointer; font-weight: 700; color: var(--primary-strong); font-size: 14px; }
.tl-edit { border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; min-width: 0; }
.tl-edit:hover { text-decoration: underline; }
.weight .wspark { width: 100%; height: 70px; display: block; margin-top: 6px; }
.weight .advice { margin-top: 10px; padding: 10px; border-radius: 14px; background: var(--mango-soft); border: 2px dashed var(--ink); }
.steps { padding-left: 20px; margin: 8px 0 14px; } .steps li { margin-bottom: 8px; }
.seg5 button { font-size: 13px; padding: 0 2px; }
.plat-cats { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; margin-bottom: 4px; }
.plat-cats .chip { flex: none; }
.quick3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.quick3 .btn { min-height: 44px; padding: 0 6px; font-size: 14px; }
.tl-head { margin: 4px 0 8px; }
.timeline { list-style: none; margin: 0 0 16px; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
.tl-item, .tl-now { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: start; gap: 0; margin-bottom: 10px; position: relative; }
.tl-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); display: grid; place-items: center; font-size: 14px; margin-top: 3px; z-index: 1; }
.tl-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 9px 11px; min-width: 0; box-shadow: var(--shadow); }
.tl-item.done .tl-dot { border-color: var(--primary); background: var(--primary-soft); }
.tl-item.next .tl-card { border-color: var(--primary); }
.tl-item.next .tl-dot { border-color: var(--primary); }
.tl-item.missed .tl-card { background: var(--surface-2); box-shadow: none; }
.tl-item.later { opacity: .6; } .tl-item.later .tl-card { box-shadow: none; }
.tl-check { color: var(--primary-strong); font-weight: 800; margin-left: 6px; }
.tl-recipe { display: flex; gap: 8px; align-items: center; margin-top: 6px; min-width: 0; }
.tl-recipe .sthumb { width: 48px; height: 48px; flex: none; border-radius: 10px; object-fit: cover; display: grid; place-items: center; }
.tl-recipe .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 2px; }
.tl-recipe b { display: block; font-size: 14px; }
.tl-list { margin-top: 6px; }
.tl-food { display: flex; gap: 6px; align-items: center; font-size: 13px; padding: 2px 0; }
.tl-food .icon-btn { width: 30px; height: 30px; }
.tl-food .grow, .tl-card .grow, .tl-recipe .grow { min-width: 0; overflow-wrap: anywhere; }
.tl-food .icon-btn, .tl-food b { flex: none; }
.tl-actions { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.tl-actions:empty { display: none; }
.tl-now { margin: 0 0 10px; align-items: center; }
.tl-now .tl-dot { width: 12px; height: 12px; margin: 0 0 0 10px; background: #c0503a; border: 0; }
.tl-now-line { font-size: 12px; font-weight: 800; color: #c0503a; text-transform: uppercase; letter-spacing: .04em; border-top: 2px dashed #e5a99c; padding-top: 2px; }
.famille { display: flex; gap: 10px; overflow-x: auto; margin-top: 12px; padding: 4px 0; }
.fam { border: 0; background: var(--surface); border-radius: 14px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); flex: none; }
.fam.on { background: var(--primary-soft); color: var(--primary-strong); }
.comp { transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; overflow: visible; }
.comp .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5s infinite; }
.comp .eyes.closed { animation: none; }
.comp .tail { transform-box: fill-box; transform-origin: 0% 60%; animation: wag 1.8s ease-in-out infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.08); } }
@keyframes wag { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(11deg); } }
.hero-pet { padding: 8px; }
.scene { position: relative; height: 300px; border-radius: 18px; overflow: hidden; isolation: isolate; }
.scene-mini { height: 190px; }
.scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.scene .star { animation: twinkle 2.6s ease-in-out infinite; }
.scene .clouds { animation: drift 40s linear infinite alternate; }
.scene .wave { animation: drift 6s ease-in-out infinite alternate; }
.scene .steam { animation: twinkle 2s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .25; } }
@keyframes drift { to { transform: translateX(40px); } }
.scene-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; z-index: 3; }
.pill { background: rgba(255,255,255,.88); border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.pill.name { margin-left: auto; }
.pill.pop { animation: pop .5s ease; }
@keyframes pop { 40% { transform: scale(1.25); } }
.scene-bubble { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: calc(100% - 36px); max-width: 330px; z-index: 3; background: #fff; border-radius: 16px; padding: 9px 12px; font-size: 15px; line-height: 1.35; text-align: center; box-shadow: 0 3px 12px rgba(0,0,0,.14); transition: opacity .22s; color: #26302a; }
.scene-bubble::after { content: ""; position: absolute; bottom: -8px; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
.scene-bubble.fade { opacity: 0; }
.comp-walk { position: absolute; left: 50%; bottom: 6px; width: 190px; margin-left: -95px; z-index: 2; animation: wander 26s ease-in-out infinite; }
.scene-mini .comp-walk { width: 120px; margin-left: -60px; }
.comp-walk.still { animation: none; }
.comp-walk::after { content: ""; position: absolute; bottom: 2px; left: 24%; right: 24%; height: 14px; background: rgba(0,0,0,.16); border-radius: 50%; z-index: -1; }
@keyframes wander { 0%, 16% { transform: translateX(0); } 28%, 42% { transform: translateX(-62px); } 56%, 72% { transform: translateX(58px); } 86%, 100% { transform: translateX(0); } }
.comp-tap { border: 0; background: none; padding: 0; display: block; width: 100%; cursor: pointer; -webkit-tap-highlight-color: transparent; transform-origin: 50% 100%; }
.comp-tap .comp, .comp-walk > .comp { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 4px rgba(0,0,0,.12)); }
.act-hop { animation: hop .8s ease; }
.act-wiggle { animation: wiggle .9s ease; }
.act-look { animation: look 1.2s ease; }
.act-spin { animation: spin3d 1s ease; }
.act-eat { animation: eat .5s ease 3; }
.act-drink { animation: drink 1.4s ease; }
@keyframes hop { 30% { transform: translateY(-36px) scale(1.04, .96); } 55% { transform: translateY(0) scale(1.08, .9); } 72% { transform: translateY(-8px); } }
@keyframes wiggle { 20% { transform: rotate(-8deg); } 40% { transform: rotate(7deg); } 60% { transform: rotate(-5deg); } 80% { transform: rotate(3deg); } }
@keyframes look { 30%, 70% { transform: translateX(-8px) rotate(-5deg); } 50% { transform: translateX(8px) rotate(5deg); } }
@keyframes spin3d { to { transform: rotateY(360deg); } }
@keyframes eat { 50% { transform: scale(1.06, .92); } }
@keyframes drink { 30%, 70% { transform: rotate(-10deg) translateY(-4px); } }
.fx { position: absolute; bottom: 150px; z-index: 4; font-size: 24px; pointer-events: none; opacity: 0; }
.fx-up { animation: floatUp 1.6s ease-out forwards; }
.fx-gain { animation: floatUp 1.8s ease-out forwards; font-size: 18px; font-weight: 800; background: #fff6d6; color: #8a6400; border-radius: 999px; padding: 3px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.fx-drop { bottom: 110px; font-size: 34px; animation: drop 1.1s ease-in forwards; }
@keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(-10px) scale(1); } 100% { transform: translateY(-110px); opacity: 0; } }
@keyframes drop { 0% { transform: translateY(-160px); opacity: 1; } 75% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0) scale(.2); opacity: 0; } }
.pet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.bq-tabs button { font-size: 13px; white-space: nowrap; padding: 0 2px; }
.bq-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bq-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 13px; min-width: 0; }
.bq-item .btn { width: 100%; min-height: 34px; padding: 0 4px; }
.bq-emo { font-size: 38px; line-height: 70px; }
.bq-fond { display: block; position: relative; width: 100%; height: 70px; border-radius: 10px; overflow: hidden; }
.bq-fond .scene-bg { z-index: 0; }
@media (prefers-reduced-motion: reduce) { .comp-walk, .comp, .comp .tail, .comp .eyes, .scene * { animation: none !important; } }
.comp-ravi, .comp-fier { animation: jump 1.1s ease-in-out infinite; }
.comp-dodo { animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.03); } }
@keyframes jump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px) scaleY(1.02); } }
.espece { padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid transparent; }
.espece[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall 2.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .2; } }
.victoires { background: linear-gradient(160deg, #fff7e0, var(--surface)); }
.guide { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, monospace; background: var(--surface-2); border-radius: 10px; padding: 10px; margin: 6px 0; }
.wc-exp { font-size: 9px; color: var(--muted); height: 12px; }
.badge-extra { font-size: 11px; font-weight: 700; color: var(--primary-strong); background: var(--primary-soft); border-radius: 6px; padding: 1px 6px; }

/* Composants communs */
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent;
  display: inline-grid; place-items: center; color: var(--text);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.btn {
  min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none; color: var(--text);
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.soft { background: var(--primary-soft); border-color: transparent; color: var(--primary-strong); }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 12px; }
.section-title { font-size: 18px; margin: 24px 0 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.field { display: block; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface-2); outline: none;
}
.input:focus { border-color: var(--primary); }
textarea.input { resize: vertical; min-height: 72px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty svg { width: 56px; height: 56px; color: var(--primary); opacity: .8; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; z-index: 100;
  opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100vw - 32px); font-size: 15px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 24px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Feuilles (bottom sheets) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; transition: .25s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 16px calc(24px + var(--safe-b));
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-width: 760px; margin: 0 auto;
}
.sheet.full { height: 100vh; max-height: 100vh; border-radius: 0; padding-top: calc(8px + var(--safe-t)); }
.sheet-wrap.open .sheet { transform: none; }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-size: 20px; flex: 1; }
.menu-list { display: grid; gap: 4px; }
.menu-list button {
  min-height: 52px; border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 12px;
  display: flex; align-items: center; gap: 12px; font-weight: 600;
}
.menu-list button:hover { background: var(--surface-2); }
.menu-list svg { width: 22px; height: 22px; color: var(--muted); }

/* Scan */
.scan-hero {
  display: grid; gap: 12px; padding: 20px; text-align: center;
  background: linear-gradient(160deg, #86a98a 0%, var(--primary) 100%); color: #fff; border-radius: 22px;
}
.scan-hero h2 { margin: 0; font-size: 20px; }
.scan-hero p { margin: 0; opacity: .9; font-size: 15px; }
.scan-hero .btn { background: #fff; color: var(--primary-strong); border: 0; min-height: 56px; font-size: 17px; }
.manual { display: flex; gap: 8px; }
.manual .input { background: rgba(255,255,255,.18); border-color: transparent; color: #fff; }
.manual .input::placeholder { color: rgba(255,255,255,.75); }
.manual .btn { min-height: 44px; font-size: 15px; }
.prod-row {
  display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: var(--surface);
  border: 0; width: 100%; text-align: left; box-shadow: var(--shadow);
}
.prod-row + .prod-row { margin-top: 10px; }
.thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: contain; background: #fff; flex: none; border: 1px solid var(--border); }
.thumb.ph { display: grid; place-items: center; color: var(--muted); background: var(--surface-2); }
.prod-name { font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
.score-line { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-top: 2px; }
.lvl-excellent { --lvl: var(--excellent); } .lvl-bon { --lvl: var(--bon); } .lvl-mediocre { --lvl: var(--mediocre); } .lvl-mauvais { --lvl: var(--mauvais); } .lvl-na { --lvl: #9aa59e; }
.dot { background: var(--lvl); }

.prod-head { display: flex; gap: 14px; align-items: flex-start; }
.prod-head img, .prod-head .ph { width: 96px; height: 96px; border-radius: 14px; object-fit: contain; background: #fff; border: 1px solid var(--border); flex: none; }
.big-score { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.big-score .dot { width: 20px; height: 20px; }
.big-score strong { font-size: 22px; }
.analysis h3 { font-size: 17px; margin: 22px 0 6px; display: flex; justify-content: space-between; }
.analysis h3 span { font-size: 13px; color: var(--muted); font-weight: 500; }
.crit { display: grid; grid-template-columns: 36px 1fr auto; gap: 4px 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.crit .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); grid-row: span 2; }
.crit .ico svg { width: 20px; height: 20px; }
.crit .lbl { font-weight: 700; }
.crit .sub { color: var(--muted); font-size: 14px; grid-column: 2; }
.crit .val { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; grid-row: span 2; }
.gauge { grid-column: 1 / -1; position: relative; height: 8px; border-radius: 4px; display: flex; overflow: hidden; margin-top: 6px; }
.gauge i { flex: 1; } .gauge i + i { margin-left: 2px; }
.gauge b { position: absolute; top: -3px; width: 4px; height: 14px; border-radius: 2px; background: var(--text); }
.alt-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x mandatory; }
.alt-card { flex: none; width: 150px; scroll-snap-align: start; background: var(--surface-2); border-radius: 14px; padding: 10px; border: 0; text-align: left; }
.alt-card img, .alt-card .ph { width: 100%; height: 100px; object-fit: contain; background: #fff; border-radius: 10px; margin-bottom: 8px; }
.badge-u { display: inline-block; font-size: 11px; font-weight: 800; background: #e30613; color: #fff; padding: 2px 6px; border-radius: 6px; margin-top: 4px; }

/* Scanner */
.scanner { position: fixed; inset: 0; z-index: 80; background: #000; color: #fff; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scanner .frame {
  position: absolute; left: 50%; top: 42%; width: min(80vw, 340px); height: min(46vw, 190px); transform: translate(-50%, -50%);
  border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); border: 3px solid rgba(255,255,255,.9);
}
.scanner .frame::after { content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d; animation: scanline 1.6s ease-in-out infinite alternate; }
@keyframes scanline { from { transform: translateY(-60px); } to { transform: translateY(60px); } }
.scanner .top { position: absolute; top: calc(12px + var(--safe-t)); left: 12px; right: 12px; display: flex; justify-content: space-between; }
.scanner .top .icon-btn { background: rgba(0,0,0,.45); color: #fff; }
.scanner .hint { position: absolute; left: 16px; right: 16px; top: calc(42% + min(23vw, 95px) + 24px); text-align: center; font-weight: 600; }
.scanner .bottom { position: absolute; left: 16px; right: 16px; bottom: calc(24px + var(--safe-b)); display: flex; justify-content: center; }

/* Recettes */
.searchbar { position: relative; }
.searchbar svg { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--muted); }
.searchbar .input { padding-left: 40px; }
.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
.recipe-card { border: 0; padding: 0; text-align: left; overflow: hidden; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.recipe-card .cover { aspect-ratio: 4/3; width: 100%; object-fit: cover; background: var(--primary-soft); }
.recipe-card .cover.ph { display: grid; place-items: center; color: var(--primary); }
.recipe-card .cover.ph svg { width: 40px; height: 40px; }
.recipe-card .body { padding: 10px 12px 12px; }
.recipe-card h3 { font-size: 15px; margin: 0 0 4px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; gap: 10px; font-size: 13px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.meta svg { width: 15px; height: 15px; vertical-align: -3px; }
.fav { color: #e0475b; }
.detail-cover { width: calc(100% + 32px); margin: -8px -16px 12px; aspect-ratio: 16/10; object-fit: cover; background: var(--primary-soft); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.stepper button { width: 40px; height: 40px; border: 0; background: var(--surface-2); font-size: 20px; font-weight: 700; }
.stepper span { min-width: 44px; text-align: center; font-weight: 700; }
.ing-list { list-style: none; padding: 0; margin: 0; }
.ing-list li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
.ing-list .q { min-width: 84px; font-weight: 700; color: var(--primary-strong); }
.step-list { list-style: none; padding: 0; margin: 0; counter-reset: s; }
.step-list li { position: relative; padding: 10px 0 12px 44px; border-bottom: 1px solid var(--border); }
.step-list li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-strong); display: grid; place-items: center; font-weight: 800; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.ahead { background: var(--primary-soft); color: var(--primary-strong); }
.tag.warn-tag { background: #fdebd0; color: #9a5b00; }
.ns { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: #fff; font-weight: 900; font-size: 16px; flex: none; }
.ns.small { width: 20px; height: 20px; font-size: 12px; border-radius: 6px; }
.ntable.cmp .nt-row { display: grid; grid-template-columns: 1fr 72px 72px 22px; gap: 6px; }
.ntable.cmp .nt-row > span:first-child { flex: none; }
.ntable.cmp .up { color: var(--excellent); font-weight: 800; } .ntable.cmp .down { color: var(--mauvais); font-weight: 800; }
.shop-item .acts button[data-act="have-item"] { font-size: 12px; gap: 2px; padding: 0 6px; }
.offline-banner { background: #fdebd0; color: #7a4a00; border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.offline-banner svg { width: 18px; height: 18px; flex: none; }
.shop-item .price { font-weight: 700; color: var(--primary-strong); font-size: 13px; white-space: nowrap; }

/* Éditeur */
.ed-block { background: var(--surface-2); border-radius: 14px; padding: 12px; }
.ed-ing { display: grid; grid-template-columns: 70px 92px 1fr 40px; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.ed-ing .aisle { grid-column: 1 / 4; }
.ed-ing .score { grid-column: 4; justify-self: center; }
.ed-ing .input { min-height: 40px; padding: 8px; background: var(--surface); }
.ed-step { display: grid; grid-template-columns: 32px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.ed-step.dragging { opacity: .6; }
.handle { touch-action: none; cursor: grab; color: var(--muted); display: grid; place-items: start center; padding-top: 10px; }
.handle svg { width: 22px; height: 22px; }
.ed-step .input { background: var(--surface); }
.ed-step .opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.ed-step .opts .input { min-height: 38px; padding: 6px 8px; width: auto; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; min-height: 38px; }
.check input { width: 20px; height: 20px; accent-color: var(--primary); }
.photo-pick { position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: var(--primary-soft); display: grid; place-items: center; color: var(--primary-strong); font-weight: 700; border: 2px dashed color-mix(in srgb, var(--primary) 40%, transparent); }
.photo-pick .row { white-space: nowrap; }
.photo-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* Mode cuisine */
.cook { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; padding: calc(12px + var(--safe-t)) 20px calc(20px + var(--safe-b)); }
.cook .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0 24px; }
.cook .progress i { display: block; height: 100%; background: var(--primary); transition: width .3s; }
.cook .step-text { font-size: clamp(22px, 5.5vw, 30px); line-height: 1.4; font-weight: 600; flex: 1; overflow-y: auto; }
.cook .timer { font-size: 44px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; margin: 16px 0; }
.cook .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cook .nav .btn { min-height: 60px; font-size: 18px; }

/* Planning */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { border: 0; background: none; min-height: 40px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.week-nav { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
.week-nav strong { flex: 1; text-align: center; }
.day { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 12px; }
.day + .day { margin-top: 10px; }
.day.today { outline: 2px solid var(--primary); }
.day h3 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; }
.slot { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; border: 0; background: none; text-align: left; padding: 6px 0; border-radius: 10px; }
.slot + .slot { border-top: 1px dashed var(--border); }
.slot .when { width: 44px; flex: none; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.slot .sthumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--primary-soft); flex: none; display: grid; place-items: center; color: var(--primary); }
.slot .sthumb svg { width: 20px; height: 20px; }
.slot .add { color: var(--primary-strong); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.slot .add svg { width: 20px; height: 20px; }
.slot.target { background: var(--primary-soft); }
.slot.moving { outline: 2px dashed var(--primary); }
.move-banner { position: sticky; top: calc(64px + var(--safe-t)); z-index: 10; background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; }
.phase { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
.phase + .phase { margin-top: 12px; }
.phase h3 { margin: 0 0 4px; font-size: 17px; display: flex; gap: 10px; align-items: center; }
.phase h3 .num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 14px; flex: none; }
.phase ul { margin: 8px 0 0; padding-left: 20px; }
.phase li { margin: 6px 0; }
.phase li .rec { font-size: 12px; font-weight: 700; color: var(--primary-strong); background: var(--primary-soft); border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
.summary-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.summary-box div { background: var(--surface); border-radius: 14px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
.summary-box strong { display: block; font-size: 22px; }
.summary-box span { font-size: 12px; color: var(--muted); }
.aisle h3 { font-size: 15px; margin: 18px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.shop-item { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.shop-item input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--primary); }
.shop-item.done .nm { text-decoration: line-through; color: var(--muted); }
.shop-item .nm { font-weight: 600; }
.shop-item .for { font-size: 12px; color: var(--muted); }
.shop-item .acts { display: flex; gap: 4px; }
.shop-item .acts a, .shop-item .acts button { min-height: 36px; min-width: 36px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 700; text-decoration: none; color: var(--text); }
.shop-item .acts .linked { background: #e30613; border-color: #e30613; color: #fff; }
.shop-item .acts svg { width: 18px; height: 18px; }
@media (min-width: 700px) { .day-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .day-grid .day + .day { margin-top: 0; } }

/* ---------- Pop gourmand : composants ---------- */
h1, h2, h3, .topbar h1, .sheet-head h2, .section-title, .tl-head, .tl-card .row > b, .ring svg text, .scene-bubble, .bubble { font-family: var(--display); }
h1, h2, h3, .sheet-head h2, .section-title, .tl-head { font-weight: 800; letter-spacing: -.005em; }
.topbar h1 { color: var(--primary); font-weight: 800; font-size: 26px; }
.btn { border: 2px solid var(--ink); border-radius: 16px; box-shadow: 0 3px 0 var(--ink); font-weight: 800; transition: transform .08s, box-shadow .08s; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--primary); border-color: var(--ink); color: var(--on-primary); }
.btn.soft { background: var(--mango-soft); border-color: var(--ink); color: var(--ink); }
.btn.small { box-shadow: 0 2px 0 var(--ink); }
.btn.small:active:not(:disabled) { transform: translateY(2px); }
.btn:disabled { box-shadow: none; }
.quick3 .btn:first-child { background: var(--primary); color: var(--on-primary); }
.quick3 .btn:nth-child(2) { background: #dff1ff; }
.quick3 .btn:nth-child(3) { background: var(--mango-soft); }
.pet-actions .btn:first-child { background: var(--mint-soft); }
.card, .ntable, .kcal-card, .slot-block, .day, .tl-card, .hero { border: 2px solid var(--ink); }
.hero { box-shadow: 0 5px 0 var(--ink); border-radius: 24px; }
.scene { border: 2px solid var(--ink); }
.day.today { outline: 3px solid var(--primary); outline-offset: 2px; }
.icon-btn:hover { background: var(--mango-soft); }
.chip { border: 2px solid var(--ink); font-weight: 800; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--ink); color: var(--on-primary); }
.seg { background: var(--mango-soft); border: 2px solid var(--ink); border-radius: 16px; }
.seg button { color: var(--ink); opacity: .75; border-radius: 11px; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); opacity: 1; box-shadow: 0 2px 0 var(--ink); }
.input, select.input, textarea.input { border: 2px solid var(--border); background: var(--surface); border-radius: 14px; }
.input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--mango); }
.tabbar { border-top: 2px solid var(--ink); }
.tabbar button[aria-current="page"] { color: var(--primary-strong); }
.tabbar button[aria-current="page"] svg { background: var(--primary); color: var(--on-primary); box-shadow: 0 2px 0 var(--ink); }
.pill { background: var(--ink); color: var(--mango); box-shadow: none; }
.scene-bubble { border: 2px solid var(--ink); font-weight: 700; font-size: 16px; box-shadow: 0 3px 0 var(--ink); }
.scene-bubble::before { content: ""; position: absolute; bottom: -11px; left: 50%; margin-left: -10px; border: 10px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
.bubble { border: 2px solid var(--ink); }
.fam { border: 2px solid transparent; }
.fam.on { background: var(--primary-soft); color: var(--primary-strong); border-color: var(--ink); }
.ring b { font-weight: 800; }
.timeline::before { background: repeating-linear-gradient(var(--ink) 0 6px, transparent 6px 12px); opacity: .35; }
.tl-dot { background: var(--mango); border: 2px solid var(--ink); }
.tl-item.done .tl-dot { background: var(--mint); border-color: var(--ink); }
.tl-item.done .tl-card { background: var(--mint-soft); }

// ---------------------------------------------------------------------------
// Utilitaires
// ---------------------------------------------------------------------------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const ingKey = (s) => norm(s).split(' ').map((w) => (w.length > 3 ? w.replace(/(s|x)$/, '') : w)).join(' ');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* stockage indisponible */ } },
};

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
function fail(err, msg = 'Une erreur est survenue') {
  console.error(err);
  toast(`${msg}${navigator.onLine ? '' : ' (hors ligne)'}`);
}

function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const fmtDay = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

function fmtNum(n) {
  if (!isFinite(n)) return '';
  const r = n >= 10 ? Math.round(n) : Math.round(n * 10) / 10;
  return String(r).replace('.', ',');
}

// ---------------------------------------------------------------------------
// État global
// ---------------------------------------------------------------------------
const state = {
  user: null,
  foyer: null,
  compte: null,
  comptes: [],
  authMode: 'login',
  tab: store.get('tab', 'aujourdhui'),
  offline: false,
  push: null,
  settings: { store_name: 'Super U Porte de Savoie Montmélian', store_slug: 'superu-montmelian', default_servings: 2 },
  recipes: [],
  links: {},
  scans: [],
  week: mondayOf(new Date()),
  plan: [],
  checks: {},
  extras: [],
  members: [],
  journal: [],
  placards: [],
  restes: [],
  favoris: [],
  perso: [],
  activites: [],
  eau: [],
  compagnons: [],
  bilans: [],
  pesees: [],
  peseesOk: false,
  day: new Date(),
  suiviMember: store.get('suiviMember', null),
  suiviView: 'jour',
  recipeQuery: '',
  recipeChip: 'tous',
  scanFilter: 'tous',
  moving: null,
};
const recipeById = (id) => state.recipes.find((r) => r.id === id);

// ---------------------------------------------------------------------------
// Accès aux données (Supabase)
// ---------------------------------------------------------------------------
// Tables réservées à l'utilisateur connecté (la sécurité RLS filtre par user_id).
const T = {
  settings: 'reglages',
  recipes: 'recettes',
  plan: 'planning_repas',
  scans: 'historique_scans',
  links: 'liens_produits',
  checks: 'courses_coches',
  extras: 'courses_ajouts',
  members: 'foyer_membres',
  journal: 'journal',
  placards: 'placards',
  restes: 'restes',
  favoris: 'aliments_favoris',
  perso: 'produits_perso',
  activites: 'activites',
  eau: 'hydratation',
  compagnons: 'compagnons',
  bilans: 'bilans',
  pesees: 'pesees',
  resume: 'resume_jour',
};
const PHOTO_BUCKET = 'photos-recettes';
const me = () => state.user?.id;
const foyer = () => state.foyer?.id;
// Colonnes d'appartenance posées sur chaque ligne créée.
const own = () => ({ user_id: me(), foyer_id: foyer() });

const Data = {
  async loadAll() {
    const [s, r, l, sc, mb, pl, rs, fv, pp, cp] = await Promise.all([
      db.from(T.settings).select('*').eq('foyer_id', foyer()).maybeSingle(),
      db.from(T.recipes).select('*').eq('foyer_id', foyer()).order('updated_at', { ascending: false }),
      db.from(T.links).select('*').eq('foyer_id', foyer()),
      db.from(T.scans).select('*').eq('foyer_id', foyer()).order('scanned_at', { ascending: false }).limit(150),
      db.from(T.members).select('*').eq('foyer_id', foyer()).order('ordre').order('created_at'),
      db.from(T.placards).select('*').eq('foyer_id', foyer()).order('name'),
      db.from(T.restes).select('*').eq('foyer_id', foyer()).order('dlc'),
      db.from(T.favoris).select('*').eq('foyer_id', foyer()).order('created_at'),
      db.from(T.perso).select('*').eq('foyer_id', foyer()).order('name'),
      db.from(T.compagnons).select('*').eq('foyer_id', foyer()),
    ]);
    for (const res of [s, r, l, sc, mb, pl, rs, fv, pp, cp]) if (res.error) throw res.error;
    state.favoris = fv.data;
    state.perso = pp.data;
    state.compagnons = cp.data;
    state.members = mb.data;
    state.placards = pl.data;
    state.restes = rs.data;
    if (!state.placards.some((x) => x.type === 'basique')) await Data.seedBasiques().catch((e) => console.warn(e));
    if (s.data) state.settings = s.data;
    else {
      const ins = await db.from(T.settings).insert(own()).select().single();
      if (ins.error) throw ins.error;
      state.settings = ins.data;
    }
    state.recipes = r.data;
    state.links = Object.fromEntries(l.data.map((x) => [x.ingredient, x]));
    state.scans = sc.data;
    await Data.loadPesees().catch(() => { state.peseesOk = false; });
  },
  async loadWeek() {
    const week = isoDate(state.week);
    const [p, c, x, j, ac, bl, eu] = await Promise.all([
      db.from(T.plan).select('*').eq('foyer_id', foyer()).eq('week', week),
      db.from(T.checks).select('*').eq('foyer_id', foyer()).eq('week', week),
      db.from(T.extras).select('*').eq('foyer_id', foyer()).eq('week', week).order('created_at'),
      db.from(T.journal).select('*').eq('foyer_id', foyer()).gte('date', week).lte('date', isoDate(addDays(state.week, 6))).order('created_at'),
      db.from(T.activites).select('*').eq('foyer_id', foyer()).gte('date', isoDate(addDays(state.week, -7))).lte('date', isoDate(addDays(state.week, 6))).order('date'),
      db.from(T.bilans).select('*').eq('foyer_id', foyer()).gte('date', isoDate(addDays(state.week, -7))).lte('date', isoDate(addDays(state.week, 6))),
      db.from(T.eau).select('*').eq('foyer_id', foyer()).gte('date', isoDate(addDays(state.week, -7))).lte('date', isoDate(addDays(state.week, 6))).order('heure'),
    ]);
    for (const res of [p, c, x, j, ac, bl, eu]) if (res.error) throw res.error;
    state.eau = eu.data;
    state.activites = ac.data;
    state.bilans = bl.data;
    state.plan = p.data;
    state.checks = Object.fromEntries(c.data.map((r) => [r.item, r.checked]));
    state.extras = x.data;
    state.journal = j.data;
    if (state.loaded) Offline.saveWeek();
  },
  async saveMember(m) {
    const { data, error } = await db.from(T.members).upsert({ ...m, ...own() }).select().single();
    if (error) throw error;
    const i = state.members.findIndex((x) => x.id === data.id);
    if (i >= 0) state.members[i] = data; else state.members.push(data);
    return data;
  },
  async deleteMember(id) {

function additiveInfo(tag) {
  const code = String(tag).replace(/^[a-z]{2}:/, '').toUpperCase();
  const base = code.match(/^E\d+[A-Z]?/)?.[0] || code;
  const info = ADDITIVES[code] || ADDITIVES[base] || ADDITIVES[base.replace(/[A-Z]$/, '')];
  return { code: base, name: info ? info[0] : 'Additif', risk: info ? info[1] : 0, known: !!info };
}

const isOrganic = (p) => (p.labels_tags || []).some((l) => ['en:organic', 'en:eu-organic', 'fr:ab-agriculture-biologique', 'fr:agriculture-biologique'].includes(l));
const isBeverage = (p) => p.nutriscore_data?.is_beverage === 1 || p.nutriscore_data?.is_beverage === true || (p.categories_tags || []).includes('en:beverages');

function computeScore(p) {
  const grade = String(p.nutriscore_grade || '').toLowerCase();
  if (!/^[a-e]$/.test(grade)) return { total: null };
  const band = { a: [48, 60], b: [36, 47], c: [24, 35], d: [12, 23], e: [0, 11] }[grade];
  let nutri = { a: 60, b: 45, c: 30, d: 15, e: 0 }[grade];
  if (!isBeverage(p) && typeof p.nutriscore_score === 'number') nutri = Math.round((60 * (19 - p.nutriscore_score)) / 27);
  nutri = clamp(nutri, band[0], band[1]);

  const additives = [...new Set(p.additives_tags || [])].map(additiveInfo);
  let add = 30;
  let cap = 100;
  for (const a of additives) {
    if (a.risk === 3) { add = 0; cap = 49; }
    else if (a.risk === 2) add -= 10;
    else if (a.risk === 1) add -= 4;
  }
  add = clamp(add, 0, 30);
  const bio = isOrganic(p) ? 10 : 0;
  return { total: Math.min(cap, nutri + add + bio), nutri, add, bio, additives, grade };
}

function scoreLevel(total) {
  if (total == null) return { lvl: 'na', label: 'Non noté' };
  if (total >= 75) return { lvl: 'excellent', label: 'Excellent' };
  if (total >= 50) return { lvl: 'bon', label: 'Bon' };
  if (total >= 25) return { lvl: 'mediocre', label: 'Médiocre' };
  return { lvl: 'mauvais', label: 'Mauvais' };
}
const scoreHtml = (total, cls = 'score-line') => {
  const s = scoreLevel(total);
  return `<span class="${cls} lvl-${s.lvl}"><span class="dot"></span>${total == null ? s.label : `${total}/100 · ${s.label}`}</span>`;
};

function gaugeHtml(value, th, neg) {
  const max = th[th.length - 1] * 1.5;
  const colors = neg ? ['excellent', 'bon', 'mediocre', 'mauvais'] : ['mauvais', 'bon', 'excellent'];
  const pos = clamp((value / max) * 100, 0, 98.5);
  return `<div class="gauge">${colors.map((c) => `<i style="background:var(--${c})"></i>`).join('')}<b style="left:${pos}%"></b></div>`;
}

function analyse(p, sc) {
  const defects = [];
  const qualities = [];
  const n = p.nutriments || {};
  const bev = isBeverage(p);
  for (const def of NUTRIENTS) {
    const v = n[def.key];
    if (typeof v !== 'number') continue;
    const th = bev && def.bev ? def.bev : def.t;
    const val = `${fmtNum(v)} ${def.unit}`;
    if (def.neg) {
      const lvl = v <= th[0] ? 0 : v <= th[1] ? 1 : v <= th[2] ? 2 : 3;
      const item = { icon: def.icon, label: def.label, sub: def.txt[lvl], val, lvl: RISK[lvl].lvl, gauge: gaugeHtml(v, th, true) };
      (lvl >= 2 ? defects : qualities).push(item);
    } else if (v >= th[0] && !bev) {
      const lvl = v >= th[1] ? 1 : 0;
      qualities.push({ icon: def.icon, label: def.label, sub: def.txt[lvl], val, lvl: lvl ? 'excellent' : 'bon', gauge: gaugeHtml(v, th, false) });
    }
  }
  const risky = sc.additives.filter((a) => a.risk > 0);
  if (risky.length) defects.unshift({ icon: 'flask', label: 'Additifs', sub: `${risky.length} additif${risky.length > 1 ? 's' : ''} à risque`, val: '', lvl: RISK[Math.max(...risky.map((a) => a.risk))].lvl });
  else if (!sc.additives.length) qualities.unshift({ icon: 'flask', label: 'Additifs', sub: 'Sans additifs', val: '', lvl: 'excellent' });
  if (sc.bio) qualities.unshift({ icon: 'leaf', label: 'Bio', sub: 'Produit naturel', val: '', lvl: 'excellent' });
  return { defects, qualities };
}

function altCategories(p) {

// Même famille : profils en graisses et protéines proches (une confiture n'est pas une alternative à une pâte à tartiner).
function sameFamily(a, b) {
  const na = a.nutriments || {};
  const nb = b.nutriments || {};
  const fa = Number(na.fat_100g) || 0;
  const fb = Number(nb.fat_100g) || 0;
  const pa = Number(na.proteins_100g) || 0;
  const pb = Number(nb.proteins_100g) || 0;
  return Math.abs(fa - fb) <= Math.max(8, fa * 0.5) && Math.abs(pa - pb) <= Math.max(6, pa * 0.5);
}
async function findAlternatives(p, current) {
  const hidden = hiddenAlts();
  for (const cat of altCategories(p)) {
    const key = `${cat}|${p.code}`;
    let d = altCache.get(key);
    if (!d) {
      const url = `${OFF}/search?categories_tags=${encodeURIComponent(cat)}&countries_tags=en:france&sort_by=nutriscore_score&page_size=80&fields=${OFF_FIELDS}`;
      d = await fetchJson(url);
      altCache.set(key, { products: (d.products || []).slice(0, 80) });
      d = altCache.get(key);
    }
    const list = (d.products || [])
      .filter((x) => x.code !== p.code && (x.product_name_fr || x.product_name) && !hidden.has(`${p.code}:${x.code}`))
      .filter((x) => (x.categories_tags || []).includes(cat) && sameFamily(p, x))
      .map((x) => ({ ...x, _s: computeScore(x).total }))
      .filter((x) => x._s != null && x._s >= Math.min(75, (current ?? 0) + 10));
    if (list.length) {
      list.sort((a, b) => (isU(b) - isU(a)) || (b._s - a._s));
      return list.slice(0, 12);
    }
  }
  return [];
}

const COMPOSITE = /plats composes|sandwich|pizza|feuilletes|soupes|entrees|desserts|viennoiseries|gateaux|biscuits|confiserie|aliments infantiles|sauces/;
function matchScore(words, a) {
  let s = 0;
  let hits = 0;
  for (const w of words) {
    if (a.words.includes(w)) { s += 3; hits++; }
    else if (a.words.some((x) => x.startsWith(w) && w.length >= 4)) { s += 1.5; hits++; }
  }
  if (!hits) return 0;
  if (a.words[0] === words[0]) s += 2.5;
  if (hits < words.length) s -= (words.length - hits) * 1.5;
  s -= Math.max(0, a.words.length - words.length) * 0.25;
  if (/\bcru\b|\bcrue\b/.test(a.key)) s += 1.2;
  if (/\bnature\b/.test(a.key)) s += 0.4;
  if (COMPOSITE.test(norm(a.groupe))) s -= 2;
  if (a.noKcal) s -= 3;
  // En recette, les légumineuses sont le plus souvent en conserve, prêtes à l'emploi.
  if (a.groupe === 'légumineuses' && /appertise/.test(a.key)) s += 2;
  return s;
}

const Scanner = {
  el: null, stream: null, controls: null, raf: 0, done: false,
  async open(onCode) {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      toast('Caméra indisponible : ouvrez l\'app en https');
      return manualEntry(onCode);
    }
    if (!store.get('camExplained', false)) {
      const ok = await new Promise((resolve) => {
        let done = false;
        const el = openSheet(`<div style="text-align:center;padding:8px 4px 4px">
          <div style="width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center">${ICON.camera.replace('<svg', '<svg width="36" height="36"')}</div>
          <h2 style="margin:0 0 8px">Autoriser l'appareil photo</h2>
          <p class="muted" style="margin:0 0 18px">Pour scanner le code-barres d'un produit, l'application a besoin d'accéder à votre appareil photo. Aucune image n'est enregistrée.</p>
          <button class="btn primary block" data-x="yes">Autoriser l'accès</button>
          <button class="btn block" data-x="no" style="margin-top:8px;border:0">Saisir le code à la main</button></div>`,
          { onClose: () => { if (!done) resolve(null); } });
        el.addEventListener('click', (e) => {
          const b = e.target.closest('[data-x]');
          if (!b) return;
          done = true;
          resolve(b.dataset.x === 'yes');
          closeSheet();
        });
      });
      if (ok === null) return;
      if (!ok) return manualEntry(onCode);
      store.set('camExplained', true);
    }
    this.done = false;
    this.el = document.createElement('div');
    this.el.className = 'scanner';
    this.el.innerHTML = `<video playsinline muted autoplay></video><div class="frame"></div>
      <div class="top"><button class="icon-btn" data-sc="close" aria-label="Fermer">${ICON.close}</button>
      <button class="icon-btn" data-sc="torch" aria-label="Lampe" hidden>${ICON.sparkle}</button></div>
      <div class="hint">Placez le code-barres dans le cadre</div>
      <div class="bottom"><button class="btn" data-sc="manual">Saisir le code</button></div>`;
    document.body.append(this.el);
    this.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sc]');
      if (!b) return;
      if (b.dataset.sc === 'close') this.close();
      if (b.dataset.sc === 'manual') { this.close(); manualEntry(onCode); }
      if (b.dataset.sc === 'torch') this.toggleTorch();
    });
    const video = $('video', this.el);
    const found = (code) => {
      if (this.done || !/^\d{8,14}$/.test(code)) return;
      this.done = true;
      navigator.vibrate?.(80);
      this.close();
      onCode(code);
    };
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = this.stream;
      await video.play();
      const track = this.stream.getVideoTracks()[0];
      if (track?.getCapabilities?.().torch) $('[data-sc="torch"]', this.el).hidden = false;

      const formats = 'BarcodeDetector' in window ? await Promise.resolve(BarcodeDetector.getSupportedFormats?.()).catch(() => []) : [];
      const native = Array.isArray(formats) && formats.includes('ean_13');
      if (native) {
        const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
        const loop = async () => {
          if (!this.el || this.done) return;
          try {
            const codes = await detector.detect(video);
            if (codes[0]) return found(codes[0].rawValue);
          } catch { /* image non prête */ }
          this.raf = requestAnimationFrame(loop);
        };
        loop();
      } else {
        await waitFor(() => window.ZXingBrowser);
        const reader = new ZXingBrowser.BrowserMultiFormatReader();
        this.controls = await reader.decodeFromVideoElement(video, (res) => { if (res) found(res.getText()); });
      }
    } catch (e) {
      this.close();
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
        openSheet(`${sheetHead('Accès à la caméra refusé')}<p>Pour scanner, autorisez l'appareil photo :</p>
          <ul class="muted"><li><b>iPhone</b> : Réglages › Safari › Appareil photo › Autoriser</li><li><b>Android</b> : icône à gauche de l'adresse › Autorisations › Caméra</li></ul>
          <button class="btn primary block" data-act="close-sheet">Compris</button>`);
      } else {
        fail(e, 'Impossible de démarrer la caméra');
      }
    }
  },
  async toggleTorch() {
    const track = this.stream?.getVideoTracks()[0];
    if (!track) return;
    this.torch = !this.torch;
    try { await track.applyConstraints({ advanced: [{ torch: this.torch }] }); } catch { /* non supporté */ }
  },
  close() {
    cancelAnimationFrame(this.raf);
    try { this.controls?.stop(); } catch { /* déjà arrêté */ }
    this.controls = null;
    this.stream?.getTracks().forEach((t) => t.stop());
    this.stream = null;
    this.torch = false;
    this.el?.remove();
    this.el = null;
  },
};
async function waitFor(fn, ms = 8000) {
  const t0 = Date.now();
  while (!fn()) {
    if (Date.now() - t0 > ms) throw new Error('Lecteur de code-barres non chargé');
    await sleep(100);
  }
}
function manualEntry(onCode) {

    <button class="btn primary">OK</button></form>`);
  $('form', el).addEventListener('submit', (e) => {
    e.preventDefault();

const UNIT_RE = /^(kg|g|mg|l|cl|dl|ml|litres?|grammes?|cuill[eè]res?\s+[àa]\s+soupe|cuill\.?\s*[àa]\s*s\.?|c\.?\s*[àa]\s*s\.?|cas|cuill[eè]res?\s+[àa]\s+caf[eé]|cuill\.?\s*[àa]\s*c\.?|c\.?\s*[àa]\s*c\.?|cac|pinc[ée]es?|gousses?|tranches?|bottes?|sachets?|bo[iî]tes?|pots?|verres?|brins?|feuilles?|morceaux?)\b\.?/i;
function mapUnit(u) {
  const x = norm(u);
  if (!x) return '';
  if (/^(kg)$/.test(x)) return 'kg';
  if (/^(g|grammes?)$/.test(x)) return 'g';
  if (x === 'mg') return 'g';
  if (/^(l|litres?)$/.test(x)) return 'l';
  if (x === 'cl') return 'cl';
  if (x === 'dl') return 'cl';
  if (x === 'ml') return 'ml';
  if (/soupe|^c a s|^cas$|^cuill a s/.test(x)) return 'c. à s.';
  if (/cafe|^c a c|^cac$|^cuill a c/.test(x)) return 'c. à c.';
  if (/pincee/.test(x)) return 'pincée';
  if (/gousse/.test(x)) return 'gousse';
  if (/tranche/.test(x)) return 'tranche';
  if (/botte/.test(x)) return 'botte';
  if (/sachet/.test(x)) return 'sachet';
  if (/boite/.test(x)) return 'boîte';
  if (/pot/.test(x)) return 'pot';
  if (/verre/.test(x)) return 'verre';
  return 'pièce';
}
const FRAC = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3 };
function parseQty(s) {
  const m = String(s).match(/^\s*(?:(\d+)\s+(\d+)\/(\d+)|(\d+)\/(\d+)|(\d+(?:[.,]\d+)?)\s*([½¼¾⅓⅔])?|([½¼¾⅓⅔]))/);
  if (!m) return null;
  let v;
  if (m[1]) v = Number(m[1]) + Number(m[2]) / Number(m[3]);
  else if (m[4]) v = Number(m[4]) / Number(m[5]);
  else if (m[6]) v = Number(m[6].replace(',', '.')) + (m[7] ? FRAC[m[7]] : 0);
  else v = FRAC[m[8]];
  return isFinite(v) ? { v, len: m[0].length } : null;
}
function parseIngredientLine(line) {
  let s = String(line).replace(/\s+/g, ' ').trim();
  let qty = '';
  let unit = '';
  const q = parseQty(s);
  if (q && q.len) {
    qty = fmtNum(q.v).replace(',', '.');
    s = s.slice(q.len).trim();
    const u = s.match(UNIT_RE);
    if (u) { unit = mapUnit(u[0]); s = s.slice(u[0].length).trim(); if (norm(u[0]) === 'mg') qty = String(Number(qty) / 1000); if (norm(u[0]) === 'dl') qty = String(Number(qty) * 10); }
    else unit = 'pièce';
  }
  s = s.replace(/^(de la |de l'|de l’|d'|d’|de |des |du )/i, '').trim();
  const name = s.charAt(0).toUpperCase() + s.slice(1);
  return { name, qty, unit, aisle: guessAisle(name) };
}

const Prices = {
  mem: new Map(),
  pending: new Set(),
  // Prix médian des relevés Open Prices (EUR, à l'unité, 12 derniers mois).
  async open(ean) {
    if (!/^\d{8,14}$/.test(ean || '')) return null;
    if (this.mem.has(ean)) return this.mem.get(ean);
    const cached = store.get(`op:${ean}`, null);
    if (cached && Date.now() - cached.t < 7 * 864e5) { this.mem.set(ean, cached.p); return cached.p; }
    if (this.pending.has(ean)) return null;
    this.pending.add(ean);
    try {
      const r = await fetch(`https://prices.openfoodfacts.org/api/v1/prices?product_code=${encodeURIComponent(ean)}&order_by=-date&size=50`);
      const d = r.ok ? await r.json() : { items: [] };
      const limit = isoDate(addDays(new Date(), -365));
      const vals = (d.items || []).filter((x) => x.currency === 'EUR' && x.price_per !== 'KILOGRAM' && x.price > 0 && (x.date || '') >= limit).map((x) => Number(x.price)).sort((a, b) => a - b);
      const p = vals.length ? { price: Math.round(vals[Math.floor(vals.length / 2)] * 100) / 100, n: vals.length, source: 'openprices' } : { price: null, n: 0, source: 'openprices' };
      this.mem.set(ean, p);
      store.set(`op:${ean}`, { t: Date.now(), p });
      return p;
    } catch { this.mem.set(ean, { price: null, n: 0, source: 'openprices', failed: Date.now() }); return null; } finally { this.pending.delete(ean); }
  },
  // Lecture serveur du prix Courses U (souvent bloquée par le site : résultat nul possible).
  async coursesU(url) {
    try {
      const { data, error } = await db.functions.invoke('prix-coursesu', { body: { url, store_slug: state.settings.store_slug } });
      if (error) return { price: null, reason: 'fonction indisponible' };
      return data || { price: null };
    } catch { return { price: null, reason: 'réseau' }; }
  },
  // Prix d'un article de la liste : mémorisé (manuel ou Courses U) sinon Open Prices (cache).
  of(it) {
    const link = state.links[it.ingKey];
    if (link?.prix) return { price: Number(link.prix), source: link.prix_source || 'manuel', date: link.prix_date };
    const ean = link?.ean || it.ean;
    if (ean) { const op = this.mem.get(ean) || store.get(`op:${ean}`, null)?.p; if (op?.price) return { price: op.price, source: 'openprices', n: op.n }; }
    return null;
  },
  // Lance les recherches manquantes puis redessine la liste.
  warm(items) {
    const eans = [...new Set(items.map((it) => state.links[it.ingKey]?.ean || it.ean).filter((e) => e && !this.mem.has(e) && !store.get(`op:${e}`, null)))];
    if (!eans.length) return;
    Promise.all(eans.slice(0, 12).map((e) => this.open(e))).then((res) => { if (state.tab === 'courses' && res.some((p) => p?.price)) render(); });
  },
};

function memberConflicts(m, r) {

  for (const w of free) if ((r.ingredients || []).some((i) => ingKey(i.name).includes(ingKey(w)))) hits.push(w);

}

      const ings = (r.ingredients || []).map((i) => ingKey(i.name)).filter(Boolean);
      const have = ings.filter((k) => keys.some((p) => keyMatches(k, p) || k.split(' ').some((w) => w.length > 3 && p.split(' ').includes(w))));
      const typedHit = ings.filter((k) => typed.some((p) => keyMatches(k, p) || k.split(' ').some((w) => w.length > 3 && p.split(' ').includes(w)))).length;
      return { r, cover: ings.length ? have.length / ings.length : 0, typedHit, missing: (r.ingredients || []).filter((i) => !have.includes(ingKey(i.name))).map((i) => i.name) };
    }).filter((x) => x.typedHit > 0).sort((a, b) => b.typedHit - a.typedHit || b.cover - a.cover);
    $('[data-results]', el).innerHTML = scored.slice(0, 20).map(({ r, cover, missing }) => `<button class="prod-row" data-act="open-recipe" data-id="${r.id}"><div class="grow"><div class="prod-name">${esc(r.title)}</div>
      <div class="muted small">${Math.round(cover * 100)} % des ingrédients${missing.length ? ` · il manque : ${esc(missing.slice(0, 4).join(', '))}${missing.length > 4 ? '…' : ''}` : ' · tout est là'}</div></div></button>`).join('')
      || '<p class="muted">Aucune recette ne contient ces ingrédients.</p>';
  };
  el.addEventListener('input', draw);
  el.addEventListener('change', draw);
  draw();
  setTimeout(() => $('[data-ings]', el)?.focus(), 250);
}

const totalMin = (r) => (Number(r.prep_min) || 0) + (Number(r.cook_min) || 0);
function recipeFilterList() {
  const q = norm(state.recipeQuery);
  const chip = state.recipeChip;
  return state.recipes.filter((r) => {
    if (q && !norm(`${r.title} ${(r.tags || []).join(' ')} ${(r.ingredients || []).map((i) => i.name).join(' ')}`).includes(q)) return false;
    if (chip === 'favoris') return r.favorite || r.avis === 'adore';
    if (chip === 'a_tester') return r.avis === 'a_tester';
    if (chip === 'rapide') return totalMin(r) > 0 && totalMin(r) <= 30;
    if (chip.startsWith('#')) return (r.tags || []).includes(chip.slice(1));
    return true;
  });
}
function recipeCard(r) {

}

const avisBadge = (r) => (r.avis && AVIS[r.avis] ? `<span class="${AVIS[r.avis][1]}">${AVIS[r.avis][0]}</span>` : '');
function renderRecipes() {

function scaleQty(qty, factor) {
  const v = parseFloat(String(qty).replace(',', '.'));
  return isFinite(v) ? fmtNum(v * factor) : qty;
}
function recipeScoreAvg(r) {
  const scored = (r.ingredients || []).filter((i) => typeof i.score === 'number');
  if (!scored.length) return null;
  return { avg: Math.round(scored.reduce((a, i) => a + i.score, 0) / scored.length), n: scored.length };
}

function recipeNutritionHtml(r) {

    <div class="macro-strip">${['kcal', 'prot', 'gluc', 'lip', 'fib'].map((k) => {

      <ul class="ing-nutri">${rn.lines.map((l) => `<li><div class="row"><b class="grow">${esc(l.ing.name)}</b><span>${l.n ? `${Math.round(l.n.kcal)} kcal` : '—'}</span></div>
        <div class="muted small">${l.g != null ? `${fmtNum(l.g)} g` : 'quantité non précisée'} · ${l.src ? `${l.src.type === 'off' ? 'produit scanné' : `Ciqual : ${esc(l.src.label)}${l.src.auto ? ' (auto)' : ''}`}` : '<span style="color:var(--mediocre)">aliment non reconnu</span>'}</div></li>`).join('')}</ul>
      <p class="muted small">Pour corriger un aliment ou un poids, modifiez la recette. Source : table Ciqual 2025 (Anses).</p></details>`;

function onEditorInput(e) {
  const t = e.target;
  if (!editing) return;
  if (t.dataset.f) {
    const f = t.dataset.f;
    if (f === 'tags') editing.tags = t.value.split(',').map((x) => x.trim().toLowerCase()).filter(Boolean);
    else if (['servings', 'prep_min', 'cook_min'].includes(f)) editing[f] = Math.max(0, parseInt(t.value, 10) || 0);
    else editing[f] = t.value;
  }
  const ingRow = t.closest('[data-i]');
  if (t.dataset.g && ingRow) {
    const ing = editing.ingredients[Number(ingRow.dataset.i)];
    ing[t.dataset.g] = t.value;
    if (t.dataset.g === 'name' && !ing.aisleManual) {
      ing.aisle = guessAisle(t.value);
      const sel = $('[data-g="aisle"]', ingRow);
      if (sel) sel.value = ing.aisle;
    }
    if (t.dataset.g === 'aisle') ing.aisleManual = true;
  }
  const stepRow = t.closest('[data-s]');
  if (t.dataset.h && stepRow) {
    const s = editing.steps[Number(stepRow.dataset.s)];
    if (t.dataset.h === 'text') {
      s.text = t.value;
      if (!s.actionManual) {
        s.action = detectAction(t.value);
        const sel = $('[data-h="action"]', stepRow);
        if (sel) sel.value = s.action;
        if (!s.aheadManual) {
          s.ahead = AHEAD_DEFAULT.has(s.action) && s.action !== 'cuisson';
          const cb = $('[data-h="ahead"]', stepRow);
          if (cb) cb.checked = s.ahead;
        }
      }
    }
    if (t.dataset.h === 'min') s.min = Math.max(0, parseInt(t.value, 10) || 0);
  }
}

function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error('Conversion impossible'))), 'image/jpeg', 0.82);
    };
    img.onerror = () => reject(new Error('Image illisible'));
    img.src = url;
  });
}

function setupStepDrag(el) {
  const box = $('#ed-steps', el);
  if (!box) return;
  box.addEventListener('pointerdown', (e) => {
    const h = e.target.closest('[data-handle]');
    if (!h) return;
    e.preventDefault();
    const row = h.closest('.ed-step');
    row.classList.add('dragging');
    h.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const rows = $$('.ed-step', box).filter((r) => r !== row);
      const after = rows.find((r) => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
      if (after) box.insertBefore(row, after); else box.append(row);
    };
    const up = () => {
      h.removeEventListener('pointermove', move);
      h.removeEventListener('pointerup', up);
      h.removeEventListener('pointercancel', up);
      row.classList.remove('dragging');
      const order = $$('.ed-step', box).map((r) => Number(r.dataset.s));
      if (order.some((v, i) => v !== i)) {
        editing.steps = order.map((i) => editing.steps[i]);
        drawEditor(el);
      }
    };
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  });
}

// --- Mode cuisine ---
async function cookMode(id) {
  const r = recipeById(id);
  if (!r?.steps?.length) { toast('Cette recette n\'a pas d\'étapes'); return; }
  let i = 0;
  let timer = null;
  let remaining = 0;
  let lock = null;
  try { lock = await navigator.wakeLock?.request('screen'); } catch { /* non supporté */ }
  const el = document.createElement('div');
  el.className = 'cook';
  document.body.append(el);
  const stopTimer = () => { clearInterval(timer); timer = null; };
  const beep = () => {
    navigator.vibrate?.([300, 150, 300]);
    try {
      const ctx = new AudioContext();
      [0, 0.35, 0.7].forEach((t) => { const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2); });
    } catch { /* audio indisponible */ }
  };
  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const draw = () => {
    const s = r.steps[i];
    el.innerHTML = `<div class="row"><button class="icon-btn" data-c="close" aria-label="Quitter">${ICON.close}</button><b class="grow">${esc(r.title)}</b><span class="muted">${i + 1}/${r.steps.length}</span></div>
      <div class="progress"><i style="width:${((i + 1) / r.steps.length) * 100}%"></i></div>
      <div class="step-text">${esc(s.text)}</div>
      ${s.min ? `<div class="timer" id="tm">${fmt(remaining || s.min * 60)}</div><button class="btn soft block" data-c="timer" style="margin-bottom:12px">${timer ? 'Arrêter le minuteur' : `Lancer le minuteur (${s.min} min)`}</button>` : ''}
      <div class="nav"><button class="btn" data-c="prev" ${i === 0 ? 'disabled' : ''}>${ICON.back} Précédent</button>
      <button class="btn primary" data-c="next">${i === r.steps.length - 1 ? 'Terminer' : `Suivant ${ICON.next}`}</button></div>`;
  };
  const close = () => { stopTimer(); try { lock?.release(); } catch { /* déjà libéré */ } el.remove(); };
  el.addEventListener('click', (e) => {
    const c = e.target.closest('[data-c]')?.dataset.c;
    if (!c) return;
    if (c === 'close') return close();
    if (c === 'prev' && i > 0) { stopTimer(); remaining = 0; i--; }
    if (c === 'next') { if (i === r.steps.length - 1) { close(); markCooked(r.id).then(() => render()).catch(() => {}); resteSheet({ recipeId: r.id, ask: true }); return; } stopTimer(); remaining = 0; i++; }
    if (c === 'timer') {
      if (timer) { stopTimer(); remaining = 0; }
      else {
        remaining = r.steps[i].min * 60;
        timer = setInterval(() => {
          remaining--;
          const tm = $('#tm', el);
          if (tm) tm.textContent = fmt(Math.max(0, remaining));
          if (remaining <= 0) { stopTimer(); beep(); toast('Minuteur terminé'); draw(); }
        }, 1000);
      }
    }
    draw();
  });
  draw();
}

async function onSlot(day, slot) {
  const m = state.plan.find((x) => x.day === day && x.slot === slot);
  if (state.moving) {
    const src = state.moving;
    state.moving = null;
    if (src.day === day && src.slot === slot) return render();
    const a = state.plan.find((x) => x.day === src.day && x.slot === src.slot);
    try {
      const ids = [a?.id, m?.id].filter(Boolean);
      const aData = a && { ...a };
      const bData = m && { ...m };
      await Data.removeMeals(ids, { keepRestes: true });
      if (aData) await Data.setMeal(day, slot, aData.recipe_id, aData.servings, aData);
      if (bData) await Data.setMeal(src.day, src.slot, bData.recipe_id, bData.servings, bData);
