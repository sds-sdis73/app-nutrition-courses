function weekMenu() {
  const el = openSheet(`${sheetHead('Actions de la semaine')}<div class="menu-list">
    <button data-m="dup">${ICON.copy} Copier la semaine précédente</button>
    <button data-m="random">${ICON.shuffle} Remplir les cases vides au hasard</button>
    <button data-m="today">${ICON.clock} Revenir à cette semaine</button>
    <button data-m="clear" style="color:var(--danger)">${ICON.trash} Vider la semaine</button></div>`);
  el.addEventListener('click', async (e) => {
    const act = e.target.closest('[data-m]')?.dataset.m;
    if (!act) return;
    closeSheet();
    try {
      if (act === 'today') { state.week = mondayOf(new Date()); state.day = new Date(); await Data.loadWeek(); }
      if (act === 'dup') {
        const { data, error } = await db.from(T.plan).select('*').eq('foyer_id', foyer()).eq('week', isoDate(addDays(state.week, -7)));
        if (error) throw error;
        if (!data.length) { toast('La semaine précédente est vide'); return; }
        for (const m of data) if (!state.plan.some((x) => x.day === m.day && x.slot === m.slot)) await Data.setMeal(m.day, m.slot, m.recipe_id, m.servings, m);
        toast('Semaine précédente copiée dans les cases vides');
      }
      if (act === 'random') {
        if (!state.recipes.length) { toast('Ajoutez d\'abord des recettes'); return; }
        const used = new Map();
        state.plan.forEach((m) => used.set(m.recipe_id, (used.get(m.recipe_id) || 0) + 1));
        let n = 0;
        for (let d = 0; d < 7; d++) for (const slot of ['midi', 'soir']) {
          if (state.plan.some((x) => x.day === d && x.slot === slot)) continue;
          const ok = state.recipes.filter((r) => r.avis !== 'jamais' && !conflictsFor(state.members, r).length);
          const pool = [...(ok.length ? ok : state.recipes)].sort((a, b) => (used.get(a.id) || 0) - (used.get(b.id) || 0) || (a.derniere_cuisson || '').localeCompare(b.derniere_cuisson || '') || Math.random() - 0.5);
          const r = pool[0];
          used.set(r.id, (used.get(r.id) || 0) + 1);
          await Data.setMeal(d, slot, r.id, state.settings.default_servings);
          n++;
        }
        toast(n ? `${n} repas ajoutés` : 'La semaine est déjà complète');
      }
      if (act === 'clear') {
        if (!state.plan.length) return;
        if (!(await confirmSheet('Vider tous les repas de cette semaine ?', 'Vider'))) return;
        await Data.removeMeals(state.plan.map((m) => m.id));
      }
      render();
    } catch (err) { fail(err); }
  });
}

// --- Batch cooking ---
const BATCH_PHASES = [
  { key: 'prep', title: 'Mise en place : épluchage & découpe', tip: 'Préchauffez le four dès maintenant si une cuisson au four est prévue.' },
  { key: 'four', title: 'Lancer les cuissons au four', tip: 'Enfournez tout ce qui peut cuire ensemble, puis enchaînez sur les étapes suivantes pendant la cuisson.' },
  { key: 'feculent', title: 'Féculents & céréales', tip: 'Cuisez-les en grande quantité dans une seule casserole quand c\'est possible.' },
  { key: 'cuisson', title: 'Cuissons à la poêle / casserole', tip: '' },
  { key: 'sauce', title: 'Sauces, marinades & assaisonnements', tip: 'Gardez les sauces à part pour que les plats restent croquants.' },
  { key: 'autre', title: 'Autres préparations', tip: '' },
];
function computeBatch() {
  const meals = [...state.plan].sort((a, b) => a.day - b.day || (a.slot === 'midi' ? -1 : 1));
  const byRecipe = new Map();
  for (const m of meals) {
    const r = recipeById(m.recipe_id);
    if (!r || m.reste_id) continue;
    const e = byRecipe.get(r.id) || { r, servings: 0, meals: [] };
    e.servings += mealServings(m);
    e.meals.push(m);
    byRecipe.set(r.id, e);
  }
  const phases = Object.fromEntries(BATCH_PHASES.map((p) => [p.key, []]));
  const sameDay = [];
  const mergedIng = new Map();
  for (const { r, servings } of byRecipe.values()) {
    const steps = (r.steps || []).filter((s) => s.ahead);
    if (!steps.length) { sameDay.push(r.title); continue; }
    const f = servings / (r.servings || 1);
    for (const s of steps) {
      phases[s.action in phases ? s.action : 'autre'].push({ recipe: r.title, text: s.text, min: Number(s.min) || 0, servings });
      if (s.action === 'prep') {
        const t = ` ${ingKey(s.text)} `;
        for (const ing of r.ingredients || []) {
          const k = ingKey(ing.name);
          const first = k.split(' ')[0];
          if (!first || !(t.includes(` ${k}`) || t.includes(` ${first}`))) continue;
          const { base, mult } = unitBase(ing.unit);
          const key = `${k}|${base}`;
          const cur = mergedIng.get(key) || { name: ing.name, base, qty: 0, recipes: new Set(), noQty: false };
          const q = parseFloat(String(ing.qty).replace(',', '.'));
          if (isFinite(q)) cur.qty += q * mult * f; else cur.noQty = true;
          cur.recipes.add(r.title);
          mergedIng.set(key, cur);
        }
      }
    }
  }
  const sum = (k) => phases[k].reduce((a, s) => a + (s.min || 5), 0);
  const ovenMax = Math.max(0, ...phases.four.map((s) => s.min || 30));
  const parallel = sum('feculent') + sum('cuisson') + sum('sauce') + sum('autre');
  const stepsCount = Object.values(phases).reduce((a, l) => a + l.length, 0);
  const total = stepsCount ? sum('prep') + Math.max(ovenMax, parallel) + 15 : 0;
  return { meals, byRecipe, phases, sameDay, mergedIng: [...mergedIng.values()], total, stepsCount };
}

  return `${restes}

    <p class="muted small" style="margin:0 0 12px">Session à faire le dimanche (ou la veille du premier repas). Les étapes de toutes les recettes sont regroupées par type pour enchaîner sans temps mort.</p>
    ${phasesHtml}
    <div class="phase"><h3><span class="num">${n + 1}</span>Refroidir, portionner, stocker</h3>
      <p class="muted small" style="margin:0">Laissez refroidir moins de 2 h avant de fermer les boîtes. Étiquetez chaque boîte avec le jour et le repas.</p>
      <ul>${storage}</ul></div>
    ${b.sameDay.length ? `<div class="phase"><h3>À cuisiner le jour même</h3><ul>${b.sameDay.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}`;
}

// --- Liste de courses ---
function unitBase(u) {
  switch (u) {
    case 'kg': return { base: 'g', mult: 1000 };
    case 'g': return { base: 'g', mult: 1 };
    case 'l': return { base: 'ml', mult: 1000 };
    case 'cl': return { base: 'ml', mult: 10 };
    case 'ml': return { base: 'ml', mult: 1 };
    default: return { base: u || '', mult: 1 };
  }
}
const COUNTABLE = new Set(['pièce', 'gousse', 'tranche', 'botte', 'sachet', 'boîte', 'pot', '']);
function fmtQtyBase(q, base) {
  if (base === 'g' && q >= 1000) return `${fmtNum(q / 1000)} kg`;
  if (base === 'ml' && q >= 1000) return `${fmtNum(q / 1000)} l`;
  if (COUNTABLE.has(base)) return `${Math.ceil(q - 0.01)}${base && base !== 'pièce' ? ` ${base}${Math.ceil(q - 0.01) > 1 && !base.endsWith('s') ? 's' : ''}` : ''}`;
  return `${fmtNum(q)} ${base}`;
}
function buildShopping() {
  const items = new Map();
  for (const m of state.plan) {
    const r = recipeById(m.recipe_id);
    if (!r || m.reste_id) continue;
    const f = mealServings(m) / (r.servings || 1);
    for (const ing of r.ingredients || []) {
      const { base, mult } = unitBase(ing.unit);
      const k = ingKey(ing.name);
      const key = `${k}|${base}`;
      const it = items.get(key) || { key, ingKey: k, name: ing.name, base, qty: 0, noQty: false, aisle: ing.aisle || guessAisle(ing.name), recipes: new Set(), ean: ing.ean || null };
      const q = parseFloat(String(ing.qty).replace(',', '.'));
      if (isFinite(q) && q > 0) it.qty += q * mult * f; else it.noQty = true;
      it.recipes.add(r.title);
      items.set(key, it);
    }
  }
  for (const e of state.extras) {
    items.set(`extra:${e.id}`, { key: `extra:${e.id}`, extraId: e.id, ingKey: ingKey(e.name), name: e.name, qtyText: e.qty || '', aisle: e.aisle, recipes: new Set(), checked: e.checked });
  }
  // Placards : les basiques sont exclus, les stocks « j'en ai » mis de côté pour la semaine.
  const skippedBasics = [];
  const inStock = [];
  for (const it of [...items.values()]) {
    if (it.extraId) continue;
    const pl = inPlacard(it.ingKey);
    if (!pl) continue;
    items.delete(it.key);
    (pl.type === 'basique' ? skippedBasics : inStock).push({ ...it, placard: pl });
  }
  const byAisle = new Map(AISLES.map((a) => [a, []]));
  for (const it of items.values()) (byAisle.get(it.aisle) || byAisle.get('Autres')).push(it);
  for (const l of byAisle.values()) l.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  return { byAisle, count: items.size, skippedBasics, inStock };
}
const qtyLabel = (it) => (it.extraId ? it.qtyText : it.qty ? fmtQtyBase(it.qty, it.base) : '');
const isChecked = (it) => (it.extraId ? !!it.checked : !!state.checks[it.key]);

function shoppingText() {
  const { byAisle } = buildShopping();
  const lines = [`Liste de courses – semaine du ${fmtDay(state.week)}`, `Magasin : ${state.settings.store_name}`, ''];
  for (const [aisle, list] of byAisle) {
    const todo = list.filter((it) => !isChecked(it));
    if (!todo.length) continue;
    lines.push(aisle.toUpperCase());
    for (const it of todo) {
      const link = state.links[it.ingKey];
      const pr = Prices.of(it);
      lines.push(`- ${qtyLabel(it) ? `${qtyLabel(it)} ` : ''}${it.name}${pr ? ` (${fmtEur(pr.price)})` : ''}${link ? ` → ${link.url}` : ''}`);
    }
    lines.push('');
  }
  return lines.join('\n').trim();
}
function linkItem(k, name) {
  const cur = state.links[k];
  const el = openSheet(`${sheetHead(`Produit pour « ${name} »`)}
    <ol class="muted small" style="margin-top:0;padding-left:18px"><li>Ouvrez la recherche Courses U et choisissez le produit.</li><li>Copiez l'adresse de sa page (elle contient <code>/p/</code>).</li><li>Collez-la ci-dessous : elle sera réutilisée à chaque liste.</li></ol>
    <a class="btn soft block" href="${esc(cuSearch(name))}" target="_blank" rel="noopener">${ICON.search} Rechercher « ${esc(name)} » sur Courses U</a>
    <form class="stack" style="margin-top:12px" data-form="link">
      <label class="field"><span>Lien du produit Courses U</span><input class="input" name="url" type="url" inputmode="url" required placeholder="https://www.coursesu.com/p/…" value="${esc(cur?.url || '')}"></label>
      <label class="field"><span>Nom du produit (facultatif)</span><input class="input" name="label" placeholder="Ex. Oignons jaunes U 1 kg" value="${esc(cur?.label || '')}"></label>
      <div class="grid2"><label class="field"><span>Prix (€, facultatif)</span><input class="input" name="prix" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(cur?.prix ?? '')}" placeholder="${cur?.prix_source === 'openprices' ? 'auto' : 'ex. 1,89'}"></label>
        <label class="field"><span>Code-barres (facultatif)</span><input class="input" name="ean" inputmode="numeric" value="${esc(cur?.ean || '')}" placeholder="pour le prix moyen"></label></div>
      ${cur?.prix ? `<p class="muted small" style="margin:0">Prix actuel : ${fmtEur(Number(cur.prix))} (${PRICE_SRC[cur.prix_source] || 'mémorisé'}${cur.prix_date ? `, ${fmtDay(isoToDate(cur.prix_date))}` : ''}).</p>` : ''}
      <button class="btn primary block">Mémoriser</button>
      ${cur ? '<button type="button" class="btn danger block" data-x="del">Oublier ce produit</button>' : ''}
    </form>`);
  const form = $('form', el);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = safeUrl(form.url.value.trim());
    if (!url || !/(^|\.)coursesu\.com$/.test(new URL(url).hostname)) { toast('Collez un lien coursesu.com'); return; }
    let label = form.label.value.trim();
    if (!label) { const m = url.match(/\/p\/([^/]+)\//); label = m ? decodeURIComponent(m[1]).replace(/-+/g, ' ').replace(/^\w/, (c) => c.toUpperCase()) : ''; }
    const manual = parseFloat(form.prix.value.replace(',', '.'));
    const ean = form.ean.value.trim() || null;
    const pid = url.match(/\/(\d+)\.html/)?.[1] || null;
    const extra = { ean, pid };
    if (manual > 0 && manual !== Number(cur?.prix)) Object.assign(extra, { prix: manual, prix_source: 'manuel', prix_date: isoDate(new Date()) });
    try {
      await Data.saveLink(k, url, label, extra);
      closeSheet(); render(); toast('Produit mémorisé');
      // En arrière-plan : prix Courses U si possible, sinon prix moyen Open Prices.
      if (!(manual > 0)) {
        const cu = await Prices.coursesU(url);
        if (cu?.price) await Data.saveLink(k, url, label, { prix: cu.price, prix_source: 'coursesu', prix_date: isoDate(new Date()) });
        else if (ean) await Prices.open(ean);
        if (state.tab === 'courses') render();
      }
    } catch (err) { fail(err); }
  });
  $('[data-x="del"]', el)?.addEventListener('click', async () => {
    try { await Data.deleteLink(k); closeSheet(); render(); } catch (err) { fail(err); }
  });
}

const rnd = (l) => l[Math.floor(Math.random() * l.length)];
const Pet = {
  queue: [],
  lines: [],
  timer: null,
  greeted: false,
  el: () => document.querySelector('[data-scene]'),
  start() {
    if (this.timer) return;

  stop() { clearInterval(this.timer); this.timer = null; this.greeted = false; this.queue = []; this.lines = []; },
  idle() {
    const sc = this.el();

    const r = Math.random();
    if (r < 0.5) this.act(rnd(['act-hop', 'act-wiggle', 'act-look', 'act-look', 'act-spin']));

  act(cls, ms = 1200) {

  },
  fx(txt, { n = 1, cls = 'fx-up', spread = 24 } = {}) {
    const sc = this.el();
    if (!sc) return;
    const walk = sc.querySelector('.comp-walk');
    const x = walk ? walk.getBoundingClientRect().left - sc.getBoundingClientRect().left + walk.offsetWidth / 2 : sc.offsetWidth / 2;
    for (let i = 0; i < n; i++) {
      const s2 = document.createElement('span');
      s2.className = `fx ${cls}`;
      s2.textContent = txt;
      s2.style.left = `${x - 14 + (Math.random() - 0.5) * spread * 2}px`;
      s2.style.animationDelay = `${i * 0.18}s`;
      sc.appendChild(s2);

    }
  },
  // Les réactions sont mises en file puis jouées sur la scène affichée (après le prochain rendu).
  play(kind, arg) {

    if (!this.el() || !this.queue.length) return;

    if (kind === 'miam') { this.fx(arg.emoji, { cls: 'fx-drop', spread: 0 }); setTimeout(() => { this.act('act-eat', 1600); this.fx(arg.fav ? '💖' : '❤️', { n: arg.fav ? 4 : 2 }); }, 900); this.say(rnd(arg.fav ? PET_MSG.favori : PET_MSG.miam)); return; }

const Rewards = {

// Critères du jour : atteindre sans dépasser.
function dayCriteria(m, date) {
  const md = memberDay(m, date);
  const nd = needs(m, date);
  const ex = expense(m, date);
  const t = md.total;
  const ratio = nd.kcal ? t.kcal / nd.kcal : 0;
  const items = [
    { key: 'cible', label: 'Calories dans la cible (90–105 %)', ok: ratio >= 0.9 && ratio <= 1.05, detail: `${Math.round(t.kcal)} / ${nd.kcal} kcal (${Math.round(ratio * 100)} %)`, over: ratio > 1.05, under: ratio < 0.9 },
    { key: 'proteines', label: 'Assez de protéines', ok: t.prot >= nd.prot * 0.9, detail: `${fmtNum(t.prot)} / ${nd.prot} g` },
    { key: 'fibres', label: 'Assez de fibres', ok: t.fib >= nd.fib * 0.8, detail: `${fmtNum(t.fib)} / ${nd.fib} g` },
    { key: 'sucres', label: 'Sucres sous le repère', ok: t.kcal > 0 && t.suc <= nd.suc, detail: `${fmtNum(t.suc)} / ≤ ${nd.suc} g` },
    { key: 'sel', label: 'Sel sous le repère', ok: t.kcal > 0 && t.sel <= nd.sel, detail: `${fmtNum(t.sel)} / ≤ ${nd.sel} g` },
    { key: 'journal', label: 'Journée renseignée', ok: md.entries.length >= 3, detail: `${md.entries.length} entrée(s)` },
    { key: 'bouge', label: 'Bouger', ok: ex.active >= (Number(m.objectif_kcal_actives) || 300), detail: `${ex.active} / ${Number(m.objectif_kcal_actives) || 300} kcal actives`, na: !ex.seances.length },
    { key: 'eau', label: 'Bien hydraté·e', ok: waterTotal(m, date) >= waterGoal(m, date) * 0.9, detail: `${fmtL(waterTotal(m, date))} / ${fmtL(waterGoal(m, date))}`, na: !waterDay(m, date).length },
  ];
  const counted = items.filter((i) => !i.na);
  const score = counted.filter((i) => i.ok).length;
  const cible = items[0].ok;
  const shells = score * 2 + (cible && score >= 5 ? 5 : 0);
  return { items, counted, score, max: counted.length, cible, shells, empty: md.entries.length === 0 };
}
const MSG = {
  cible: ['Pile dans la cible, sans en faire trop : c\'est exactement ça.', 'Objectif atteint et respecté. Tu n\'as rien forcé, tu as juste bien fait.', 'Équilibre parfait aujourd\'hui. Ta régularité vaut plus que n\'importe quel exploit.'],

  over: ['Un peu au-dessus aujourd\'hui, et alors ? Une journée ne fait pas une semaine.', 'Repas copieux ? Ça arrive à tout le monde. Demain repart à zéro, sans compensation.'],
  faim: ['Rien noté depuis ce matin… tu as mangé ? Note-le vite, même à peu près.', 'Mon ventre gargouille pour toi. Un tap sur le journal et c\'est réglé.'],
  matin: ['Bonjour ! Un bon petit-déjeuner et la journée est lancée.', 'Nouvelle journée, nouvelle page. On y va tranquillement.'],

};
const pick = (k, c) => { const l = MSG[k] || MSG.content; return l[Math.floor(Date.now() / 36e5) % l.length].replace('{serie}', c?.serie ?? 0); };
function companionMood(m, c) {
  const h = new Date().getHours();
  const date = new Date();
  const cr = dayCriteria(m, date);
  const ex = expense(m, date);
  if (h >= 22) return 'dodo';
  if ((c?.serie || 0) >= 7 && h < 11) return 'fier';
  if (ex.active >= (Number(m.objectif_kcal_actives) || 300) * 1.3) return 'sportif';
  if (h < 11 && cr.empty) return 'matin';
  if (h >= 14 && cr.empty) return 'faim';
  const ratio = cr.items[0].over ? 'rassasie' : cr.items[0].ok || h < 19 ? 'content' : 'content';
  return cr.cible && h >= 19 ? 'ravi' : ratio;
}

// Bilan de la veille : calcule, enregistre, met à jour coquillages et série, puis affiche une fois par jour.
async function evaluateYesterday() {
  const y = addDays(new Date(), -1);
  const iso = isoDate(y);
  const todo = state.members.filter((m) => companionOf(m) && !state.bilans.some((b) => b.member_id === m.id && b.date === iso));
  if (!todo.length) return;
  // La veille peut appartenir à la semaine précédente (lundi) : on charge alors son journal et son planning à part.
  let swap = null;
  if (mondayOf(y).getTime() !== state.week.getTime()) {
    const wk = isoDate(mondayOf(y));
    const [j, p] = await Promise.all([
      db.from(T.journal).select('*').eq('foyer_id', foyer()).eq('date', iso),
      db.from(T.plan).select('*').eq('foyer_id', foyer()).eq('week', wk),
    ]);
    if (j.error || p.error) return;
    swap = { week: state.week, plan: state.plan, journal: state.journal };
    Object.assign(state, { week: mondayOf(y), plan: p.data, journal: j.data });
  }
  const crits = new Map();
  try { for (const m of todo) crits.set(m.id, dayCriteria(m, y)); } finally { if (swap) Object.assign(state, swap); }
  const results = [];
  for (const m of todo) {
    const c = companionOf(m);
    const cr = crits.get(m.id);
    if (!cr || cr.empty) continue;
    const serie = cr.score >= 3 ? (c.serie || 0) + 1 : 0;
    try {
      await Data.saveBilan({ member_id: m.id, date: iso, score: cr.score, criteres: Object.fromEntries(cr.items.map((i) => [i.key, i.ok])), coquillages: cr.shells });
      await Data.saveCompagnon({ ...c, coquillages: (c.coquillages || 0) + cr.shells, serie, meilleure_serie: Math.max(c.meilleure_serie || 0, serie) });
      results.push({ m, c: companionOf(m), cr, serie });
    } catch (e) { console.warn('bilan', e); }
  }
  if (!results.length || store.get(`bilanShown:${iso}`, false)) return;
  store.set(`bilanShown:${iso}`, true);
  const me = results.find((r) => r.m.id === journalMember()?.id) || results[0];
  bilanSheet(me, y);
  render();
}

        closeSheet(); render();

        if (cc.coquillages < prix) return;
        const patch = { coquillages: cc.coquillages - prix, accessoires: [...(cc.accessoires || []), b.dataset.buy] };
        if (b.dataset.kind === 'fond') patch.fond = b.dataset.buy.slice(5);
        await Data.saveCompagnon({ ...cc, ...patch });
        Pet.play('achat', b.dataset.kind === 'fond' ? 'Waouh, quel nouveau décor !' : 'Je suis trop beau·belle comme ça !');
      } else if (b.dataset.fond) await Data.saveCompagnon({ ...cc, fond: b.dataset.fond });
      else { const k = b.dataset.wear; const acc = (cc.accessoires || []).map((a) => (a.replace(/^!/, '') === k ? (a.startsWith('!') ? k : `!${k}`) : a)); await Data.saveCompagnon({ ...cc, accessoires: acc }); }
      draw(); render();
    } catch (err) { fail(err); }
  });
}

}
// Anneau de progression SVG.
function ring(value, max, color, label, sub) {
  const pct = max ? clamp(value / max, 0, 1) : 0;
  const r = 26; const circ = 2 * Math.PI * r;
  return `<div class="ring"><svg viewBox="0 0 64 64" width="72" height="72"><circle cx="32" cy="32" r="${r}" stroke="var(--ring-track)" stroke-width="9" fill="none"/>
    <circle cx="32" cy="32" r="${r}" stroke="${color}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${(pct * circ).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 32 32)"/>
    <text x="32" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="var(--text)">${value < 10 && value % 1 ? fmtNum(Math.round(value * 10) / 10) : Math.round(value)}</text></svg><b>${label}</b><span class="muted small">${sub}</span></div>`;
}

// ---------------------------------------------------------------------------
// Aujourd'hui : fil chronologique de la journée du membre choisi (repas, eau, activités, rappels).
// ---------------------------------------------------------------------------
const SLOT_TIME = { 'petit-dejeuner': '07:30', collation: '10:30', midi: '12:30', gouter: '16:30', soir: '19:30' };
const WATER_POINTS = [['10:00', 0.25, 'Matinée'], ['13:00', 0.5, 'Midi'], ['16:30', 0.7, 'Après-midi'], ['19:30', 0.85, 'Soirée'], ['21:30', 1, 'Avant de dormir']];
// Délai après l'horaire indicatif avant de considérer un repas comme « rien de noté » (chacun mange à son rythme).
const plusMin = (t, m) => { const [h, mi] = t.split(':').map(Number); const x = Math.min(23 * 60 + 59, h * 60 + mi + m); return `${String(Math.floor(x / 60)).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`; };
const lateAfter = (slot, t) => (slot === 'petit-dejeuner' ? '11:00' : plusMin(t, 150));
function renderToday() {
  const today = new Date();
  const iso = isoDate(today);
  const di = dayIndex(today);
  const now = nowHM();
  const members = state.members;
  const greet = today.getHours() < 12 ? 'Bonjour' : today.getHours() < 18 ? 'Bon après-midi' : 'Bonsoir';
  const me = journalMember();
  const head = `<p class="muted" style="margin:0 0 10px">${greet} · ${today.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</p>`;
  if (!me) return `${head}<div class="card" style="padding:12px"><p class="muted small" style="margin:0 0 8px">Ajoutez les membres du foyer pour suivre repas, hydratation et activités.</p><button class="btn primary small" data-act="foyer">${ICON.users} Configurer le foyer</button></div>`;
  const c = companionOf(me);
  const md = memberDay(me, today);
  const nd = needs(me, today);
  const ex = expense(me, today);
  const water = waterTotal(me, today);
  const wGoal = waterGoal(me, today);
  const past = (t) => t <= now;
  const kcalOf = (list) => Math.round(list.reduce((t, e) => t + (e.n.kcal || 0), 0));
  const eatenSoFar = kcalOf(md.entries.filter((e) => e.type === 'journal' || past(SLOT_TIME[e.slot] || '12:00')));
  const items = [];

  // Repas
  for (const [slot, label] of SLOTS) {
    const entries = md.entries.filter((e) => e.slot === slot);
    if (slot === 'collation' && !entries.length) continue;
    // Collation : placée à l'heure réelle de la première saisie.
    const first = slot === 'collation' && state.journal.find((j) => entries.some((e) => e.id === j.id))?.created_at;
    const t = first ? new Date(first).toTimeString().slice(0, 5) : SLOT_TIME[slot];
    const meal = di >= 0 && ['midi', 'soir'].includes(slot) ? state.plan.find((x) => x.day === di && x.slot === slot && mealEaters(x).some((y) => y.id === me.id)) : null;
    const r = meal && recipeById(meal.recipe_id);
    const done = entries.some((e) => e.type === 'journal') || (r && past(t));
    let body = '';
    if (r) {
      const img = safeUrl(r.photo_url);
      body += `<div class="tl-recipe">${img ? `<img class="sthumb" src="${esc(img)}" alt="">` : `<span class="sthumb">${ICON.chef}</span>`}
        <span class="grow"><b>${esc(r.title)}</b><span class="meta">${ICON.users} ${esc(mealWho(meal))}${meal.reste_id ? '<span class="tag ahead">Reste</span>' : ''}${totalMin(r) && !meal.reste_id ? `<span>${ICON.clock} ${totalMin(r)} min</span>` : ''}</span></span>
        <button class="icon-btn" data-act="open-recipe" data-id="${r.id}" aria-label="Voir la recette">${ICON.chef}</button>${!meal.reste_id && !past(t) ? `<button class="icon-btn" data-act="cook-mode" data-id="${r.id}" aria-label="Mode cuisine">${ICON.play}</button>` : ''}</div>`;
    }
    const journal = entries.filter((e) => e.type === 'journal');
    if (journal.length) body += `<div class="tl-list">${journal.map((e) => `<div class="tl-food"><button class="grow tl-edit" data-act="journal-edit" data-id="${e.id}" aria-label="Corriger ${esc(e.label)}">${esc(e.label)}${e.detail ? ` <span class="muted">· ${esc(e.detail)}</span>` : ''}</button><b>${Math.round(e.n.kcal || 0)}</b><button class="icon-btn" data-act="journal-del" data-id="${e.id}" aria-label="Supprimer">${ICON.trash}</button></div>`).join('')}</div>`;
    let actions = '';
    const late = past(lateAfter(slot, t));
    const yIso = isoDate(addDays(today, -1));
    const ySure = mondayOf(addDays(today, -1)).getTime() === state.week.getTime();
    const likeY = !entries.length && (!ySure || state.journal.some((j) => j.date === yIso && j.member_id === me.id && j.slot === slot)) ? `<button class="btn small" data-act="journal-like-yesterday" data-slot="${slot}">↺ Comme hier</button>` : '';
    if (!entries.length && late) actions = `<span class="muted small grow">Rien de noté</span>${likeY}<button class="btn small soft" data-act="journal-add" data-slot="${slot}">${ICON.plus} Noter</button>`;
    else if (!entries.length && ['midi', 'soir'].includes(slot) && di >= 0) actions = `<button class="btn small primary" data-act="journal-add" data-slot="${slot}">${ICON.plus} Noter</button>${likeY}<button class="btn small" data-act="suggest">${ICON.sparkle} Une idée ?</button><button class="btn small soft" data-act="slot" data-d="${di}" data-s="${slot}">Planifier</button>`;
    else if (!entries.length) actions = `<span class="muted small grow">${past(t) ? 'À noter quand tu veux' : 'À venir'}</span>${likeY}<button class="btn small soft" data-act="journal-add" data-slot="${slot}">${ICON.plus} Noter</button>`;
    else actions = `<button class="btn small" data-act="journal-add" data-slot="${slot}" style="margin-left:auto">${ICON.plus} Ajouter</button>`;
    const k = kcalOf(entries);
    items.push({ t, kind: 'repas', state: done ? 'done' : late ? 'missed' : 'next', icon: slot === 'petit-dejeuner' ? '☕' : slot === 'gouter' || slot === 'collation' ? '🍎' : '🍽️',
      title: label, side: k ? `${k} kcal` : '', body: body + `<div class="tl-actions">${actions}</div>` });
  }

  // Activités
  for (const a of dayActs(me.id, iso).filter((x) => x.kind === 'seance')) {
    const t = a.heure || '18:00';
    const planned = a.statut === 'prevu';
    items.push({ t, kind: 'sport', state: planned ? (past(t) ? 'missed' : 'next') : 'done', icon: '🏃', title: esc(a.label || 'Activité'),
      side: `${Math.round(Number(a.kcal) || 0)} kcal`,
      body: `<div class="tl-actions"><span class="muted small grow">${a.minutes ? `${a.minutes} min · ` : ''}${planned ? (past(t) ? 'prévue, c\'est fait ?' : 'prévue') : 'faite'}</span>${planned ? `<button class="btn small primary" data-act="activite-done" data-id="${a.id}">C'est fait</button>` : ''}<button class="icon-btn" data-act="activite-del" data-id="${a.id}" aria-label="Supprimer">${ICON.trash}</button></div>` });
  }

  // Hydratation : repères au fil de la journée, avec les boissons de la plage
  const drinks = waterDay(me, today);
  let prev = '00:00';
  for (const [t, frac, moment] of WATER_POINTS) {
    const inWin = drinks.filter((x) => x.heure > prev && x.heure <= t);
    const upTo = drinks.filter((x) => x.heure <= t).reduce((s2, x) => s2 + x.ml, 0);
    const target = Math.round((wGoal * frac) / 50) * 50;
    const isNext = !past(t) && past(prev);
    prev = t;
    if (!past(t) && !isNext) { items.push({ t, kind: 'eau', state: 'later', icon: '💧', title: `Hydratation · ${moment}`, side: `objectif ${fmtL(target)}`, body: '' }); continue; }
    const ok = upTo >= target * 0.9;
    items.push({ t, kind: 'eau', state: isNext ? 'next' : ok ? 'done' : 'missed', icon: '💧', title: `Hydratation · ${moment}`,
      side: `${fmtL(upTo)} / ${fmtL(target)}`,
      body: `<div class="tl-actions">${inWin.length ? `<span class="muted small grow">${inWin.length} boisson${inWin.length > 1 ? 's' : ''} · ${fmtL(inWin.reduce((s2, x) => s2 + x.ml, 0))}</span>` : `<span class="muted small grow">${isNext ? `Encore ${fmtL(Math.max(0, target - upTo))}` : 'Aucune boisson notée'}</span>`}${isNext || !ok ? `<button class="btn small soft" data-act="eau-add" data-ml="250">+250 ml</button>` : ''}</div>` });
  }

  // Rappels : reste à sortir du congélateur pour demain, restes du frigo à finir
  const tomorrow = dayIndex(addDays(today, 1));
  if (tomorrow >= 0) for (const meal of state.plan.filter((x) => x.day === tomorrow && x.reste_id)) {
    const rs = state.restes.find((x) => x.id === meal.reste_id);
    const r = rs && rs.stockage === 'congel' && recipeById(rs.recipe_id);
    if (r) items.push({ t: '19:00', kind: 'rappel', state: past('19:00') ? 'missed' : 'next', icon: '❄️', title: 'Sortir du congélateur', side: '', body: `<p class="muted small" style="margin:0">${esc(r.title)} pour ${meal.slot === 'midi' ? 'le déjeuner' : 'le dîner'} de demain.</p>` });
  }
  const frigo = restesFor(today).filter((x) => x.stockage === 'frigo' && x.dlc <= iso);
  for (const x of frigo) { const r = recipeById(x.recipe_id); if (r) items.push({ t: '12:00', kind: 'rappel', state: 'next', icon: '🥡', title: 'Reste à finir aujourd\'hui', side: '', body: `<p class="muted small" style="margin:0">${esc(r.title)} · ${esc(resteLabel(x))}</p>` }); }

  // Bilan du soir
  const cr = dayCriteria(me, today);
  const okCount = cr.items.filter((x) => x.ok).length;
  items.push({ t: '21:45', kind: 'bilan', state: past('21:45') ? 'done' : 'later', icon: '🌙', title: 'Bilan de la journée', side: `${okCount} / ${cr.items.length}`,
    body: `<div class="tl-actions"><span class="muted small grow">${cr.items.filter((x) => x.ok).map((x) => x.label).slice(0, 3).join(' · ') || 'Les objectifs se remplissent au fil des repas'}</span><button class="btn small" data-act="tab" data-tab="suivi">Détail</button></div>` });

  // Ce qui est déjà fait passe avant « Maintenant », même si l'horaire indicatif est plus tard (repas noté en avance).
  for (const x of items) { x.ord = x.t; if (x.state === 'done' && x.t > now) x.t = now; }
  items.sort((a, b) => a.t.localeCompare(b.t) || a.ord.localeCompare(b.ord) || (a.kind === 'repas' ? -1 : 1));
  const nowIdx = items.findIndex((x) => x.t > now);
  const nowMark = '<li class="tl-now"><span class="tl-dot"></span><span class="tl-now-line">Maintenant</span></li>';
  const li = (x) => `<li class="tl-item ${x.kind} ${x.state}"><span class="tl-dot">${x.icon}</span>
    <div class="tl-card"><div class="row"><b class="grow">${x.title}</b>${x.side ? `<span class="small muted">${x.side}</span>` : ''}${x.state === 'done' ? '<span class="tl-check">✓</span>' : ''}</div>${x.body}</div></li>`;
  const timeline = items.map((x, i) => (i === nowIdx ? nowMark : '') + li(x)).join('') + (nowIdx < 0 ? nowMark : '');

  const mood = c ? companionMood(me, c) : 'content';
  const nextMeal = di >= 0 && ['midi', 'soir'].map((sl) => state.plan.find((x) => x.day === di && x.slot === sl && SLOT_TIME[sl] > now)).find(Boolean);
  const nextAct = dayActs(me.id, iso).find((a) => a.statut === 'prevu' && (a.heure || '') > now);
  Pet.lines = c && c.messages !== false ? [pick(mood, c), ...PET_MSG.idle,
    water < wGoal ? `Encore ${fmtL(wGoal - water)} d'eau pour ton objectif. On trinque ? 💧` : 'Objectif d\'eau atteint, bravo !',
    nextMeal ? `Au menu ${nextMeal.slot === 'midi' ? 'ce midi' : 'ce soir'} : ${recipeById(nextMeal.recipe_id)?.title || 'surprise'}. J'ai hâte !` : '',
    nextAct ? `${nextAct.label} à ${nextAct.heure} : je viens avec toi !` : '',
    c.coquillages >= 20 ? `On a ${c.coquillages} coquillages… un petit tour à la boutique ?` : ''].filter(Boolean) : [];
  const scene = c ? `<div class="scene" data-scene>${sceneSvg(c.fond || 'jardin')}
      <div class="scene-top"><span class="pill" data-shells>${c.coquillages} 🐚</span><span class="pill">🔥 ${c.serie} j</span><span class="pill name">${esc(c.nom)}</span></div>
      ${c.messages === false ? '' : `<div class="scene-bubble" data-bubble>${esc(pick(mood, c))}</div>`}
      <div class="comp-walk"><button class="comp-tap" data-act="pet" aria-label="Faire un câlin à ${esc(c.nom)}">${companionSvg(c, mood, 190)}</button></div></div>
    <div class="pet-actions"><button class="btn" data-act="nourrir">🍓 Nourrir</button><button class="btn" data-act="boutique">🎀 Boutique</button></div>`
    : `<div class="scene">${sceneSvg('jardin')}<div class="scene-bubble">Un compagnon pour ${esc(me.nom)} ? Il t'encourage et ne gronde jamais.</div><div class="comp-walk still" style="opacity:.9">${companionSvg({ espece: 'loutre' }, 'matin', 170)}</div></div>
    <div class="pet-actions" style="grid-template-columns:1fr"><button class="btn primary" data-act="adopt">${ICON.sparkle} Adopter un compagnon · ${WELCOME_SHELLS} 🐚 offerts</button></div>`;
  const hero = `<div class="hero hero-pet">${scene}
      <div class="rings">${ring(eatenSoFar, nd.kcal, 'var(--primary)', `${eatenSoFar} / ${nd.kcal} kcal`, 'mangé')}${ring(ex.active, Number(me.objectif_kcal_actives) || 300, 'var(--mango-strong)', `${ex.active} / ${me.objectif_kcal_actives || 300} kcal`, 'activité')}${ring(water / 1000, wGoal / 1000, 'var(--sky)', `${fmtL(water)} / ${fmtL(wGoal)}`, 'eau')}</div>
      ${members.length > 1 ? `<div class="famille">${members.map((x) => { const cx = companionOf(x); return `<button class="fam ${x.id === me.id ? 'on' : ''}" data-act="famille" data-m="${x.id}">${cx ? companionSvg(cx, 'content', 40) : `<span class="thumb ph" style="width:40px;height:40px;border-radius:50%">${esc(x.nom[0])}</span>`}<span>${esc(x.nom)}</span></button>`; }).join('')}</div>` : ''}</div>`;
  WidgetSync.schedule(me, { date: iso, nom: me.nom, kcal: eatenSoFar, besoin: nd.kcal, actif: ex.active, actifObj: Number(me.objectif_kcal_actives) || 300, eau: water, eauObj: wGoal,
    prochain: nextMeal ? `${nextMeal.slot === 'midi' ? 'Midi' : 'Soir'} : ${recipeById(nextMeal.recipe_id)?.title || ''}` : '',
    compagnon: c ? { nom: c.nom, espece: c.espece, coquillages: c.coquillages, serie: c.serie, humeur: mood, message: c.messages === false ? '' : pick(mood, c) } : null });
  if (c && !Pet.greeted) { Pet.greeted = true; Pet.play('hello', `${greet} ${me.nom} ! ${today.getHours() < 11 ? 'Bien dormi ?' : 'Content·e de te voir !'}`); }
  return `${head}${hero}
    <div class="quick3"><button class="btn" data-act="journal-add" data-slot="${defaultSlot()}">🍽️ Repas</button><button class="btn" data-act="eau-add" data-ml="250">💧 +250 ml</button><button class="btn" data-act="activite-add">🏃 Activité</button></div>
    <h3 class="tl-head">La journée de ${esc(me.nom)}</h3>
    <ol class="timeline">${timeline}</ol>`;
}
// Widget iPhone (Scriptable) : l'app publie le résumé du jour dans resume_jour (table facultative), au plus toutes les 4 s et seulement s'il change.
const WidgetSync = {
  last: '', timer: null, off: false,
  schedule(m, data) {
    if (this.off || state.offline || !m) return;
    const json = JSON.stringify(data);
    if (json === this.last) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(async () => {
      try {
        const { error } = await db.from(T.resume).upsert({ ...own(), member_id: m.id, date: data.date, data: { ...data, maj: new Date().toISOString() }, updated_at: new Date().toISOString() }, { onConflict: 'member_id,date' });
        if (error) { if (/relation|does not exist|schema cache/i.test(error.message)) this.off = true; return; }
        this.last = json;
      } catch { /* hors ligne : on réessaiera au prochain affichage */ }
    }, 4000);
  },
};

// Propose des recettes pour le dîner : restes d'abord, puis rapides, aimées, non cuisinées récemment, sans aversion.
function suggestSheet() {
  const today = new Date();

  if (di < 0) { toast('Revenez à la semaine en cours pour planifier ce repas'); return; }

  const score = (r) => (r.avis === 'adore' || r.favorite ? 3 : 0) + (totalMin(r) && totalMin(r) <= 30 ? 2 : 0) + (r.avis === 'a_tester' ? 1 : 0) + Math.min(3, (Date.now() - new Date(r.derniere_cuisson || '2000-01-01')) / (14 * 864e5)) + Math.random();

        await Data.setMeal(di, slot, x.recipe_id, state.settings.default_servings, { reste_id: x.id });
        const meal = state.plan.find((y) => y.day === di && y.slot === slot);

      } else await Data.setMeal(di, slot, b.dataset.rid, state.settings.default_servings, existing ? { ...existing, reste_id: null } : {});
      render(); toast(`${slot === 'midi' ? 'Déjeuner' : 'Dîner'} planifié`);
    } catch (err) { fail(err); }
  });
}

const VAPID_PUBLIC = 'BGtcjD-H4BoUOSKDxhxrXqjtVqj6m8JHnqBbcOv3kK-BUTulfwV9ewxlZsF8oKogOEKtFFfZhehR6XtzDA8_5rw';
const PUSH_DEFAULTS = { batch: true, congel: true, courses: true, courses_day: 5, courses_hour: 9, planning: true, bilan: true };
const Push = {
  supported: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  standaloneHint: () => /iPhone|iPad/.test(navigator.userAgent) && !window.navigator.standalone && !matchMedia('(display-mode: standalone)').matches,
  async current() {
    if (!this.supported()) return null;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) { state.push = null; return null; }
    const { data } = await db.from('push_abonnements').select('*').eq('endpoint', sub.endpoint).maybeSingle();
    state.push = data || null;
    return state.push;
  },
  async subscribe() {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('Notifications refusées par le navigateur');
    const reg = await navigator.serviceWorker.ready;
    const key = Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(VAPID_PUBLIC.length / 4) * 4, '=')), (c) => c.charCodeAt(0));
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const j = sub.toJSON();
    const row = { endpoint: sub.endpoint, keys: j.keys, prefs: state.push?.prefs || PUSH_DEFAULTS, ua: navigator.userAgent.slice(0, 200), ...own() };
    const { data, error } = await db.from('push_abonnements').upsert(row, { onConflict: 'endpoint' }).select().single();
    if (error) throw error;
    state.push = data;
  },
  async unsubscribe() {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { await db.from('push_abonnements').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
    state.push = null;
  },
  async savePrefs(prefs) {
    if (!state.push) return;
    const { error } = await db.from('push_abonnements').update({ prefs }).eq('endpoint', state.push.endpoint);
    if (error) throw error;
    state.push.prefs = prefs;
  },
};

const SLOTS = [['petit-dejeuner', 'Petit-déjeuner'], ['midi', 'Déjeuner'], ['gouter', 'Goûter'], ['soir', 'Dîner'], ['collation', 'Collation']];
const slotLabel = (k) => SLOTS.find(([s]) => s === k)?.[1] || k;
const nutriCache = new Map();
function portionN(r) {
  const key = `${r.id}|${r.updated_at}|${CQ.ready}`;
  if (!nutriCache.has(key)) nutriCache.set(key, recipeNutrition(r).perPortion);
  return nutriCache.get(key);
}
const dayIndex = (d) => Math.round((mondayOf(d) - state.week) / 864e5) === 0 ? (d.getDay() + 6) % 7 : -1;

// Ce qu'un membre a mangé un jour donné : repas planifiés (sa part) + journal.
function memberDay(member, date) {
  const iso = isoDate(date);
  const di = dayIndex(date);
  const entries = [];
  if (di >= 0) {
    for (const meal of state.plan.filter((x) => x.day === di)) {
      const r = recipeById(meal.recipe_id);
      if (!r || !mealEaters(meal).some((x) => x.id === member.id)) continue;
      const f = memberFactor(member);
      entries.push({ type: 'plan', slot: meal.slot, label: r.title, detail: `planning · ${fmtPortions(f)}`, n: scaleN(portionN(r), f), member, recipeId: r.id });
    }
  }
  for (const j of state.journal.filter((x) => x.date === iso && x.member_id === member.id)) {
    entries.push({ type: 'journal', id: j.id, slot: j.slot, label: j.label, detail: j.grams ? `${fmtNum(Number(j.grams))} g` : j.portions ? fmtPortions(Number(j.portions)) : '', n: { ...zeroN(), ...j.n }, member });
  }
  const total = entries.reduce((t, e) => addN(t, e.n), zeroN());
  return { entries, total };
}
function suiviMembers() {
  const id = state.suiviMember;
  if (id === 'foyer') return state.members;
  const m = memberById(id) || state.members[0];
  return m ? [m] : [];
}
function groupDay(members, date) {
  const days = members.map((m) => memberDay(m, date));
  const need = members.reduce((t, m) => addN(t, needs(m, date)), zeroN());
  return { entries: days.flatMap((d) => d.entries), total: days.reduce((t, d) => addN(t, d.total), zeroN()), need };
}

function bar(value, target, { max = false } = {}) {
  const pct = target ? (value / target) * 100 : 0;
  const cls = max ? (pct > 100 ? 'over' : 'ok') : pct >= 90 && pct <= 115 ? 'ok' : pct > 115 ? 'over' : 'low';
  return `<div class="bar ${cls}"><i style="width:${clamp(pct, 0, 100)}%"></i></div>`;
}
function macroBars(total, need) {
  return NUTRI_KEYS.filter((d) => d.k !== 'kcal').map((d) => `<div class="mbar ${d.sub ? 'sub' : ''}"><div class="row"><span class="grow">${d.label}</span>
    <b>${fmtNum(total[d.k])}</b><span class="muted small">&nbsp;/ ${d.max ? '≤ ' : ''}${fmtNum(need[d.k])} ${d.unit}</span></div>${bar(total[d.k], need[d.k], { max: d.max })}</div>`).join('');
}
function kcalCard(total, need, sub) {

  return `<div class="kcal-card"><div class="row"><div class="grow"><div class="muted small">${esc(sub)}</div>

      <div class="left ${left < 0 ? 'neg' : ''}"><b>${Math.abs(left)}</b><span>${left < 0 ? 'kcal en trop' : 'kcal restantes'}</span></div></div>
    ${bar(total.kcal, need.kcal)}</div>`;
}

// Suivi du poids : dernière pesée, tendance, courbe, conseil d'ajustement de l'objectif.
function weightCard(m) {
  if (!state.peseesOk || !m) return '';
  const list = state.pesees.filter((x) => x.member_id === m.id);
  const t = weightTrend(list);
  if (!t) return `<div class="ntable weight"><div class="row"><div class="nt-title grow" style="margin:0">⚖️ Poids</div><button class="btn small primary" data-act="pesee">Me peser</button></div>

  const pts = t.points.slice(-30);
  const lo = Math.min(...pts.map((p) => Math.min(p.kg, p.trend))) - 0.5;
  const hi = Math.max(...pts.map((p) => Math.max(p.kg, p.trend))) + 0.5;
  const W = 300; const H = 70;
  const x = (i) => (pts.length === 1 ? W / 2 : 8 + (i * (W - 16)) / (pts.length - 1));
  const y = (v) => 6 + ((hi - v) * (H - 12)) / (hi - lo || 1);
  const spark = `<svg class="wspark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polyline fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p, i) => `${x(i).toFixed(1)},${y(p.trend).toFixed(1)}`).join(' ')}"/>
    ${pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3" fill="var(--mango-strong)" stroke="var(--ink)" stroke-width="1"/>`).join('')}</svg>`;
  const s = t.slopeWeek;
  const trendTxt = s == null ? `Tendance après 2 semaines et 4 pesées (${t.n} pour l'instant)` : `${s > 0 ? '+' : ''}${fmtNum(s)} kg/semaine sur 4 semaines`;
  const adv = weightAdvice(m, list);
  const later = store.get(`weightLater:${m.id}`, null);
  const showAdv = adv && !(later && (Date.now() - isoToDate(later).getTime()) / 864e5 < 14) && Number(m.kcal_perso) !== adv.kcal;

    ${spark}<p class="muted small" style="margin:2px 0 0">${trendTxt}</p>
    ${showAdv ? `<div class="advice"><p class="small" style="margin:0">${esc(adv.why)} On peut ajuster l'objectif de ${adv.delta > 0 ? '+' : ''}${adv.delta} kcal, sans rien changer d'autre.</p>
      <div class="row" style="gap:6px;margin-top:8px"><button class="btn small primary" data-act="weight-apply" data-m="${m.id}" data-kcal="${adv.kcal}">Passer à ${adv.kcal} kcal/jour</button><button class="btn small" data-act="weight-later" data-m="${m.id}">Plus tard</button></div></div>` : ''}</div>`;

// Dépense du jour : pas, kcal actives, total, solde ; séances avec suppression ; ajout manuel.
function expenseBlock(members, date) {
  const total = members.reduce((t, m) => t + expense(m, date).total, 0);
  const active = members.reduce((t, m) => t + expense(m, date).active, 0);
  const activeGoal = members.reduce((t, m) => t + (Number(m.objectif_kcal_actives) || 300), 0);
  const eaten = members.reduce((t, m) => t + memberDay(m, date).total.kcal, 0);
  const water = members.reduce((t, m) => t + waterTotal(m, date), 0);
  const waterG = members.reduce((t, m) => t + waterGoal(m, date), 0);
  const solde = Math.round(eaten - total);
  const seances = members.flatMap((m) => dayActs(m.id, isoDate(date)).filter((a) => a.kind === 'seance').map((a) => ({ ...a, who: m.nom })));
  return `<div class="ntable"><div class="row"><div class="nt-title grow" style="margin:0">Activité & hydratation</div>
      <button class="btn small soft" data-act="eau-sheet">💧 Eau</button><button class="btn small soft" data-act="activite-add">${ICON.plus} Activité</button></div>
    <div class="macro-strip" style="grid-template-columns:repeat(4,1fr);margin:8px 0">
      <div><b>${Math.round(total)}</b><span>kcal dépensées</span></div><div><b>${active}</b><span>kcal actives</span></div><div><b>${fmtL(water)}</b><span>bu</span></div>
      <div style="${solde > 0 ? 'background:#fdebd0' : ''}"><b>${solde > 0 ? '+' : ''}${solde}</b><span>solde</span></div></div>
    <div class="mbar"><div class="row"><span class="grow">Calories actives</span><b>${active}</b><span class="muted small">&nbsp;/ ${activeGoal} kcal</span></div>${bar(active, activeGoal)}</div>
    <div class="mbar"><div class="row"><span class="grow">Hydratation</span><b>${fmtL(water)}</b><span class="muted small">&nbsp;/ ${fmtL(waterG)}</span></div>${bar(water, waterG)}</div>
    ${seances.map((a) => `<div class="entry"><div class="grow"><div class="nm">${esc(a.label || 'Activité')}${a.statut === 'prevu' ? ' <span class="tag">prévue</span>' : ''}</div><div class="muted small">${members.length > 1 ? `${esc(a.who)} · ` : ''}${a.heure ? `${a.heure} · ` : ''}${a.minutes ? `${a.minutes} min` : ''}</div></div><span class="small"><b>${Math.round(Number(a.kcal) || 0)}</b> kcal</span>${a.statut === 'prevu' ? `<button class="btn small soft" data-act="activite-done" data-id="${a.id}">Faite</button>` : ''}<button class="icon-btn" data-act="activite-del" data-id="${a.id}" aria-label="Supprimer">${ICON.trash}</button></div>`).join('')}
    <p class="muted small" style="margin:6px 0 0">Dépense estimée : métabolisme de base × 1,2 + activités faites (les activités prévues ne comptent qu'une fois validées).</p></div>`;
}
const nowHM = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

function activiteSheet(member, prefill) {
  const m = member || journalMember();
  if (!m) { toast('Ajoutez d\'abord un membre'); return; }
  const el = openSheet(`${sheetHead('Ajouter une activité')}
    <form class="stack" data-form="activite">
      <div class="grid2"><label class="field"><span>Pour</span><select class="input" name="member">${state.members.map((x) => `<option value="${x.id}" ${x.id === m.id ? 'selected' : ''}>${esc(x.nom)}</option>`).join('')}</select></label>
        <label class="field"><span>Date</span><input class="input" type="date" name="date" value="${isoDate(state.tab === 'suivi' ? state.day : new Date())}" required></label></div>
      <label class="field"><span>Activité</span><select class="input" name="type">${Object.keys(MET_CATS).map((cat) => `<optgroup label="${esc(cat)}">${MET.map(([l, , c], i) => (c === cat ? `<option value="${i}">${esc(l)}</option>` : '')).join('')}</optgroup>`).join('')}</select></label>
      <div class="grid2"><label class="field"><span>Durée (min)</span><input class="input" type="number" name="minutes" min="1" max="600" inputmode="numeric" value="30" required></label>
        <label class="field"><span>Intensité</span><select class="input" name="intensite"><option value="0.8">Tranquille</option><option value="1" selected>Normale</option><option value="1.25">Soutenue</option></select></label></div>
      <div class="grid2"><label class="field"><span>Heure</span><input class="input" type="time" name="heure" value="${nowHM()}" required></label>
        <label class="field"><span>Calories (calculées)</span><input class="input" type="number" name="kcal" min="0" inputmode="numeric"></label></div>
      <div class="seg" role="group" style="grid-template-columns:1fr 1fr;margin:0"><button type="button" data-st="fait" aria-pressed="true">Déjà faite</button><button type="button" data-st="prevu" aria-pressed="false">Prévue</button></div>
      <button class="btn primary block">Enregistrer</button></form>`);
  const f = $('form', el);
  let kcalManual = false;
  const calc = () => {
    if (kcalManual) return;
    const mm = memberById(f.member.value) || m;
    const met = MET[Number(f.type.value)][1] * Number(f.intensite.value);
    f.kcal.value = Math.round(met * (Number(mm.poids_kg) || 70) * (Number(f.minutes.value) || 0) / 60);
  };
  let statut = 'fait';
  let manual = false;
  const autoStatut = () => {
    if (manual) return;
    const future = f.date.value > isoDate(new Date()) || (f.date.value === isoDate(new Date()) && f.heure.value > nowHM());
    statut = future ? 'prevu' : 'fait';
    $$('[data-st]', el).forEach((b) => b.setAttribute('aria-pressed', b.dataset.st === statut));
  };
  if (prefill?.heure) f.heure.value = prefill.heure;
  calc();
  autoStatut();
  el.addEventListener('click', (e) => { const b = e.target.closest('[data-st]'); if (!b) return; statut = b.dataset.st; manual = true; $$('[data-st]', el).forEach((x) => x.setAttribute('aria-pressed', x === b)); });
  f.addEventListener('input', (e) => {
    if (e.target.name === 'kcal') kcalManual = f.kcal.value !== '';
    else if (['type', 'minutes', 'intensite', 'member'].includes(e.target.name)) { kcalManual = false; calc(); }
    if (['date', 'heure'].includes(e.target.name)) autoStatut();
  });
  f.addEventListener('change', (e) => { if (['type', 'intensite', 'member'].includes(e.target.name)) { kcalManual = false; calc(); } });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await Data.addActivite({ member_id: f.member.value, date: f.date.value, heure: f.heure.value, statut, source: 'manuel', kind: 'seance', ref: uid(), label: MET[Number(f.type.value)][0], kcal: Number(f.kcal.value) || 0, minutes: Number(f.minutes.value) || null });
      closeSheet(); toast(statut === 'prevu' ? 'Activité prévue' : `${f.kcal.value} kcal dépensées ajoutées`); render();
    } catch (err) { fail(err); }
  });
}

function renderSuiviWeek() {

  const need = days[0].need;
  const top = Math.max(need.kcal * 1.3, ...days.map((d) => d.total.kcal));
  const avg = scaleN(days.reduce((t, d) => addN(t, d.total), zeroN()), 1 / 7);
  const today = isoDate(new Date());
  return `${weekNav()}
    ${members.length === 1 ? weightCard(members[0]) : ''}
    <div class="week-chart">${days.map((d, i) => `<button class="wc-col ${isoDate(d.date) === today ? 'today' : ''}" data-act="suivi-open-day" data-i="${i}">
      <span class="wc-val">${state.bilans.some((b) => b.date === isoDate(d.date) && b.criteres?.cible && members.some((m) => m.id === b.member_id)) ? '⭐' : d.total.kcal ? Math.round(d.total.kcal) : ''}</span>
      <span class="wc-bar"><i class="${d.total.kcal > need.kcal * 1.15 ? 'over' : d.total.kcal >= need.kcal * 0.9 ? 'ok' : 'low'}" style="height:${(d.total.kcal / top) * 100}%"></i>
        <em style="bottom:${(need.kcal / top) * 100}%"></em></span>
      <span class="wc-day">${DAYS[i].slice(0, 3)}</span><span class="wc-exp">${(() => { const e = members.reduce((t, m) => t + expense(m, d.date).total, 0); return e ? `−${Math.round(e)}` : ''; })()}</span></button>`).join('')}</div>
    <p class="muted small" style="margin:4px 0 12px">Trait horizontal : besoin quotidien (${Math.round(need.kcal)} kcal) ; sous chaque jour, la dépense. Touchez un jour pour le détail.</p>
    ${(() => { const dep = days.reduce((t, d) => t + members.reduce((u, m) => u + expense(m, d.date).total, 0), 0) / 7; const sol = Math.round(avg.kcal - dep); return `<div class="ntable"><div class="nt-row"><span>Dépense moyenne par jour</span><b>${Math.round(dep)} kcal</b><span class="pct"></span></div><div class="nt-row"><span>Solde moyen (mangé − dépensé)</span><b class="${sol > 0 ? 'warn' : ''}">${sol > 0 ? '+' : ''}${sol} kcal</b><span class="pct"></span></div></div>`; })()}
    ${kcalCard(avg, need, 'Moyenne par jour sur la semaine')}
    <div class="ntable">${macroBars(avg, need)}</div>
    ${(() => { const all = [...buildShopping().byAisle.values()].flat(); let t = 0; let n = 0; for (const it of all) { const pr = Prices.of(it); if (pr) { t += pr.price; n++; } } return n ? `<div class="ntable"><div class="nt-row"><span>Coût estimé des courses de la semaine</span><b>${fmtEur(t)}</b><span class="pct">${n}/${all.length} art.</span></div></div>` : ''; })()}
    ${(() => { const bl = state.bilans.filter((b) => members.some((m) => m.id === b.member_id) && b.date >= isoDate(state.week) && b.date <= isoDate(addDays(state.week, 6))); if (!bl.length) return ''; const cible = bl.filter((b) => b.criteres?.cible).length; const keys = ['cible', 'proteines', 'fibres', 'sucres', 'sel', 'journal', 'bouge', 'eau']; const labels = { cible: 'calories dans la cible', proteines: 'protéines', fibres: 'fibres', sucres: 'sucres maîtrisés', sel: 'sel maîtrisé', journal: 'journée renseignée', bouge: 'activité', eau: 'hydratation' }; const top = keys.map((k) => [k, bl.filter((b) => b.criteres?.[k]).length]).sort((a, b) => b[1] - a[1]).slice(0, 3); const best = Math.max(0, ...members.map((m) => companionOf(m)?.meilleure_serie || 0)); return `<div class="ntable victoires"><div class="nt-title">🏅 Petites victoires</div><div class="nt-row"><span>Jours dans la cible cette semaine</span><b>${cible} / ${bl.length}</b></div><div class="nt-row"><span>Meilleure série</span><b>${best} jour${best > 1 ? 's' : ''}</b></div><div class="nt-row"><span>Points forts</span><b class="small">${top.filter((t) => t[1]).map((t) => labels[t[0]]).join(', ') || '—'}</b></div></div>`; })()}
    <div class="ntable"><div class="nt-title">Total de la semaine</div>
      ${NUTRI_KEYS.filter((x) => x.main).map((x) => `<div class="nt-row"><span>${x.label}</span><b>${fmtN(avg[x.k] * 7, x.unit)}</b><span class="pct">${Math.round((avg[x.k] / need[x.k]) * 100)} %</span></div>`).join('')}</div>`;
}

// Corriger une entrée du journal : quantité, repas, date (valeurs recalculées à partir de la quantité d'origine).
function journalEdit(id) {
  if (String(id).startsWith('local:')) { toast('Modification possible après la synchronisation'); return; }
  const j = state.journal.find((x) => x.id === id);
  if (!j) return;
  const isPortion = j.portions != null && j.grams == null;
  const base = Number(isPortion ? j.portions : j.grams) || null;
  const el = openSheet(`${sheetHead('Corriger l\'entrée')}
    <form class="stack" data-form="jedit"><p style="margin:0"><b>${esc(j.label)}</b></p>
      <div class="grid2"><label class="field"><span>Repas</span><select class="input" name="slot">${SLOTS.map(([k, l]) => `<option value="${k}" ${k === j.slot ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="field"><span>Date</span><input class="input" type="date" name="date" value="${esc(j.date)}" required></label></div>
      ${base ? `<label class="field"><span>Quantité (${isPortion ? 'portions' : 'g'})</span><input class="input" type="number" name="qty" min="0.1" step="any" inputmode="decimal" value="${base}" required></label>`
        : `<label class="field"><span>Calories</span><input class="input" type="number" name="kcal" min="1" max="5000" inputmode="numeric" value="${Math.round(Number(j.n?.kcal) || 0)}" required></label>`}
      <div data-preview class="muted small"></div>
      <button class="btn primary block">Enregistrer</button>
      <button type="button" class="btn danger block" data-x="del">Supprimer l'entrée</button></form>`);
  const f = $('form', el);
  const newN = () => (base ? scaleN({ ...zeroN(), ...j.n }, (parseFloat(f.qty.value) || 0) / base) : { ...zeroN(), ...j.n, kcal: parseInt(f.kcal.value, 10) || 0 });
  const prev = () => { $('[data-preview]', el).textContent = `${Math.round(newN().kcal)} kcal · ${fmtNum(newN().prot)} g de protéines`; };
  prev();
  f.addEventListener('input', prev);
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const patch = { slot: f.slot.value, date: f.date.value, n: newN() };
    if (base) patch[isPortion ? 'portions' : 'grams'] = parseFloat(f.qty.value);
    try { await Data.updateJournal(id, patch); closeSheet(); toast('Entrée corrigée'); render(); } catch (err) { fail(err); }
  });
  $('[data-x="del"]', el).addEventListener('click', async () => { try { await Data.deleteJournal(id); closeSheet(); render(); } catch (err) { fail(err); } });
}
// « Comme hier » : recopie ce que le membre a noté hier au même repas.
async function likeYesterday(slot) {
  const m = journalMember();
  if (!m) return;
  const today = isoDate(new Date());
  const y = isoDate(addDays(new Date(), -1));
  try {
    const rows = (await Data.journalOn(y, [m.id])).filter((r) => r.slot === slot);
    if (!rows.length) { toast(`Rien de noté hier au ${slotLabel(slot).toLowerCase()}`); return; }
    for (const r of rows) await Data.addJournal({ date: today, member_id: m.id, slot, label: r.label, source: r.source, ref: r.ref, grams: r.grams, portions: r.portions, n: r.n });
    toast(`${rows.length} élément${rows.length > 1 ? 's' : ''} repris d'hier`);
    render();
  } catch (e) { fail(e); }
}
// Copie les entrées de la veille (membres affichés) sur le jour sélectionné.
async function copyYesterday() {
  const members = suiviMembers();
  const y = isoDate(addDays(state.day, -1));
  try {
    const rows = await Data.journalOn(y, members.map((m) => m.id));
    if (!rows.length) { toast('Rien dans le journal de la veille'); return; }
    for (const r of rows) await Data.addJournal({ date: isoDate(state.day), member_id: r.member_id, slot: r.slot, label: r.label, source: r.source, ref: r.ref, grams: r.grams, portions: r.portions, n: r.n });
    toast(`${rows.length} entrée${rows.length > 1 ? 's' : ''} copiée${rows.length > 1 ? 's' : ''}`);
    render();
  } catch (e) { fail(e); }
}
async function addHabits(slot) {
  const members = suiviMembers();
  let n = 0;
  try {
    for (const m of members) {
      for (const f of state.favoris.filter((x) => x.slot === slot && (!x.member_id || x.member_id === m.id))) {
        await Data.addJournal({ date: isoDate(state.day), member_id: m.id, slot, label: f.label, source: f.source, ref: f.ref, grams: f.grams, portions: f.portions, n: f.n });
        n++;
      }
    }
    toast(n ? `${n} habituel${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''}` : 'Aucun habituel pour ce repas');
    render();
  } catch (e) { fail(e); }
}

function defaultSlot() {
  const h = new Date().getHours();
  return h < 10 ? 'petit-dejeuner' : h < 14 ? 'midi' : h < 18 ? 'gouter' : 'soir';
}
// Saisie de la quantité. Pour une recette, per100 = valeurs d'une portion standard et la quantité est en portions.
function quantitySheet(o) {
  const member = (o.memberId && memberById(o.memberId)) || journalMember();
  if (!member) { toast('Ajoutez d\'abord les membres du foyer'); openFoyer(); return; }
  const isRecipe = !!o.portions;
  const unit = isRecipe ? 'portion(s)' : 'g';
  const def = isRecipe ? Math.round(memberFactor(member) * 100) / 100 : o.defaultGrams || 100;
  const quick = isRecipe ? [0.5, 1, 1.5, 2] : o.portionG ? [0.5, 1, 1.5, 2].map((k) => Math.round(o.portionG * k)) : [...new Set([50, 100, 150, 200, o.defaultGrams].filter(Boolean))].sort((a, b) => a - b);
  const chipLabel = (q) => (isRecipe ? fmtNum(q) : o.portionG ? `${{ 0.5: '½ portion', 1: '1 portion', 1.5: '1,5 portion', 2: '2 portions' }[Math.round((q / o.portionG) * 2) / 2] || ''} <span class="muted">${q} g</span>` : `${fmtNum(q)} g`);
  const date = state.tab === 'suivi' ? state.day : new Date();
  const el = openSheet(`${sheetHead(o.label)}
    <form class="stack" data-form="qty">
      <div class="grid2">
        <label class="field"><span>Pour</span><select class="input" name="member">${state.members.map((m) => `<option value="${m.id}" ${m.id === member.id ? 'selected' : ''}>${esc(m.nom)}</option>`).join('')}</select></label>
        <label class="field"><span>Repas</span><select class="input" name="slot">${SLOTS.map(([k, l]) => `<option value="${k}" ${k === (o.slot || defaultSlot()) ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      <label class="field"><span>Date</span><input class="input" type="date" name="date" value="${isoDate(date)}" required></label>
      <label class="field"><span>Quantité (${unit})</span><input class="input" type="number" name="qty" min="0.1" step="any" inputmode="decimal" value="${def}" required></label>
      <div class="chips${o.portionG ? ' wrap' : ''}">${quick.map((q) => `<button type="button" class="chip" data-q="${q}">${chipLabel(q)}</button>`).join('')}</div>
      <div data-preview></div>
      <label class="check"><input type="checkbox" name="fav"> Ajouter à mes habituels (${slotLabel(o.slot || defaultSlot())})</label>
      <button class="btn primary block">Ajouter au journal</button>
    </form>`);
  const f = $('form', el);
  const preview = () => {
    const q = parseFloat(f.qty.value) || 0;
    const n = scaleN(o.per100, isRecipe ? q : q / 100);
    $('[data-preview]', el).innerHTML = `<div class="macro-strip">${['kcal', 'prot', 'gluc', 'lip', 'fib'].map((k) => { const d = NUTRI_KEYS.find((x) => x.k === k); return `<div><b>${fmtN(n[k], d.unit).replace(' ', '&nbsp;')}</b><span>${d.label}</span></div>`; }).join('')}</div>`;
    return { q, n };
  };
  preview();
  f.addEventListener('input', preview);
  el.addEventListener('click', (e) => { const b = e.target.closest('[data-q]'); if (b) { f.qty.value = b.dataset.q; preview(); } });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const { q, n } = preview();
    if (!(q > 0)) return;
    try {
      await Data.addJournal({ date: f.date.value, member_id: f.member.value, slot: f.slot.value, label: o.label, source: o.source, ref: o.ref || null, grams: isRecipe ? null : q, portions: isRecipe ? q : null, n });
      if (f.fav.checked) await Data.addFavori({ member_id: f.member.value, slot: f.slot.value, label: o.label, source: o.source, ref: o.ref || null, grams: isRecipe ? null : q, portions: isRecipe ? q : null, n }).catch(() => {});
      closeSheet();
      toast(`Ajouté : ${Math.round(n.kcal)} kcal`);
      render();
    } catch (err) { fail(err); }
  });
}

      </div>
      <label class="field"><span>Activité physique</span><select class="input" name="activite">${Object.entries(ACTIVITY).map(([k, a]) => `<option value="${k}" ${k === v.activite ? 'selected' : ''}>${a.label}</option>`).join('')}</select></label>
      <label class="field"><span>Objectif</span><select class="input" name="objectif">${Object.entries(OBJECTIF).map(([k, o]) => `<option value="${k}" ${k === v.objectif ? 'selected' : ''}>${o.label}</option>`).join('')}</select></label>
      <div class="kcal-card" data-calc></div>
      <div class="field"><span>Évite (allergies, régime, dégoûts)</span>
        <div class="chips" style="flex-wrap:wrap">${Object.entries(EVITE).map(([k, d]) => `<button type="button" class="chip" aria-pressed="${(v.evite || []).includes(k)}" data-evite="${k}">${d.label}</button>`).join('')}</div>
        <input class="input" name="evite_libre" placeholder="Autres, séparés par des virgules (ex. coriandre, olives)" value="${esc((v.evite || []).filter((k) => k.startsWith('mot:')).map((k) => k.slice(4)).join(', '))}"></div>
      <div class="grid2"><label class="field"><span>Objectif kcal actives / jour</span><input class="input" type="number" name="objectif_kcal_actives" min="50" max="3000" step="50" inputmode="numeric" value="${esc(v.objectif_kcal_actives ?? 300)}"></label>
        <label class="field"><span>Objectif d'eau (ml, vide = auto)</span><input class="input" type="number" name="objectif_eau_ml" min="300" max="5000" step="50" inputmode="numeric" value="${esc(v.objectif_eau_ml ?? '')}" placeholder="auto"></label></div>
      <label class="field"><span>Besoin personnalisé (kcal/jour, facultatif)</span><input class="input" type="number" name="kcal_perso" min="500" max="6000" inputmode="numeric" value="${esc(v.kcal_perso ?? '')}" placeholder="Laisser vide pour le calcul automatique"></label>
      <button class="btn primary block">Enregistrer</button>
      ${m ? '<button type="button" class="btn danger block" data-x="del">Retirer du foyer</button>' : ''}
    </form>`);
  const f = $('form', el);
  const read = () => ({ ...(m ? { id: m.id } : {}), nom: f.nom.value.trim(), sexe: f.sexe.value, naissance: f.naissance.value, poids_kg: parseFloat(f.poids_kg.value), taille_cm: parseFloat(f.taille_cm.value), activite: f.activite.value, objectif: f.objectif.value, kcal_perso: parseInt(f.kcal_perso.value, 10) || null,
    objectif_kcal_actives: parseInt(f.objectif_kcal_actives.value, 10) || 300, objectif_eau_ml: parseInt(f.objectif_eau_ml.value, 10) || null,
    evite: [...$$('[data-evite][aria-pressed="true"]', f).map((b) => b.dataset.evite), ...f.evite_libre.value.split(',').map((x) => x.trim()).filter(Boolean).map((x) => `mot:${x}`)] });
  f.addEventListener('click', (e) => { const b = e.target.closest('[data-evite]'); if (b) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); });
  const calc = () => {
    const x = read();
    const box = $('[data-calc]', el);
    if (!x.naissance || !(x.poids_kg > 0) || !(x.taille_cm > 0)) { box.innerHTML = '<span class="muted small">Renseignez date de naissance, poids et taille pour calculer les besoins.</span>'; return; }
    const nd = needs(x);
    box.innerHTML = `<div class="row"><div class="grow"><div class="muted small">Besoin estimé${x.kcal_perso ? ' (personnalisé)' : ''}</div><b class="big">${nd.kcal}</b> kcal/jour</div>
      <div class="left"><b>${fmtNum(nd.kcal / REF_KCAL)}</b><span>portion standard</span></div></div>
      <div class="muted small" style="margin-top:6px">Protéines ${nd.prot} g · Glucides ${nd.gluc} g · Lipides ${nd.lip} g · Fibres ${nd.fib} g</div>
      ${x.kcal_perso ? `<div class="muted small">Calcul automatique : ${computedKcal(x)} kcal</div>` : ''}`;
  };
  calc();
  f.addEventListener('input', calc);
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await Data.saveMember({ ...read(), ordre: m ? m.ordre : state.members.length });
      closeSheet(); onDone?.(); render(); toast('Membre enregistré');
    } catch (err) { fail(err, 'Enregistrement impossible'); }
  });
  $('[data-x="del"]', el)?.addEventListener('click', async () => {
    if (!(await confirmSheet(`Retirer ${m.nom} du foyer ? Son journal sera supprimé.`, 'Retirer'))) return;
    try { await Data.deleteMember(m.id); closeSheet(); onDone?.(); render(); } catch (err) { fail(err); }
  });
}

      <p class="muted small" style="margin:0">Pour changer de magasin : sur coursesu.com, choisissez votre magasin, puis copiez l'adresse de sa page (elle commence par <code>coursesu.com/drive-</code>).</p>
      <h3 style="margin:16px 0 0">Repas</h3>
      <label class="field"><span>Nombre de personnes par défaut</span><input class="input" type="number" min="1" max="20" name="default_servings" value="${s.default_servings}"></label>

      <label class="btn">${ICON.upload} Importer<input type="file" accept="application/json" data-x="import" hidden></label></div>

  });
  const form = $('form', el);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const raw = form.store_slug.value.trim();
    const slug = (raw.match(/drive-([a-z0-9-]+)/i)?.[1] || raw.replace(/^drive-/, '')).toLowerCase();
    if (!/^[a-z0-9-]+$/.test(slug)) { toast('Adresse du magasin invalide'); return; }
    try {
      await Data.saveSettings({ store_name: form.store_name.value.trim(), store_slug: slug, default_servings: clamp(parseInt(form.default_servings.value, 10) || 2, 1, 20) });
      closeSheet(); render(); toast('Paramètres enregistrés');
    } catch (err) { fail(err); }
  });
  $('[data-x="export"]', el).addEventListener('click', exportData);
  $('[data-x="import"]', el).addEventListener('change', (e) => e.target.files[0] && importData(e.target.files[0]));

async function exportData() {
  try {
    const [plan] = await Promise.all([db.from(T.plan).select('*').eq('foyer_id', foyer())]);
    if (plan.error) throw plan.error;
    const data = { app: APP_NAME, version: 1, exported_at: new Date().toISOString(), settings: state.settings, recipes: state.recipes, meal_plan: plan.data, product_links: Object.values(state.links) };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = `sauvegarde-${isoDate(new Date())}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (err) { fail(err, 'Export impossible'); }
}
async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.recipes)) throw new Error('Fichier non reconnu');
    if (!(await confirmSheet(`Importer ${d.recipes.length} recette(s) et le planning ? Les éléments existants avec le même identifiant seront remplacés.`, 'Importer', false))) return;
    // Les éléments importés sont rattachés au compte connecté ; les recettes reçoivent de nouveaux identifiants.
    const ids = new Map(d.recipes.map((r) => [r.id, uid()]));
    if (d.recipes.length) { const r = await db.from(T.recipes).insert(d.recipes.map((x) => ({ ...x, id: ids.get(x.id), ...own() }))); if (r.error) throw r.error; }
    if (d.product_links?.length) { const r = await db.from(T.links).upsert(d.product_links.map(({ id, ...l }) => ({ ...l, ...own() }))); if (r.error) throw r.error; }
    const plan = (d.meal_plan || []).filter((m) => ids.has(m.recipe_id)).map(({ id, ...m }) => ({ ...m, recipe_id: ids.get(m.recipe_id), ...own() }));
    if (plan.length) { const r = await db.from(T.plan).upsert(plan, { onConflict: 'foyer_id,week,day,slot' }); if (r.error) throw r.error; }
    if (d.settings) { const { id, user_id, updated_at, ...s } = d.settings; await Data.saveSettings(s); }
    await Data.loadAll();
    await Data.loadWeek();
    closeSheet(); render(); toast('Import terminé');
  } catch (err) { fail(err, 'Import impossible'); }
}

  if (f.dataset.form === 'extra') {
    e.preventDefault();
    const raw = f.xname.value.trim();
    if (!raw) return;
    const name = raw.charAt(0).toUpperCase() + raw.slice(1);
    const aisle = f.xaisle.value || guessAisle(name);
    Data.addExtra(name, f.xqty.value.trim(), aisle)
      .then(() => { render(); toast(`Ajouté au rayon ${aisle}`); $('[data-form="extra"] [name="xname"]')?.focus(); })
      .catch((err) => fail(err));
    return;
  }
  if (f.dataset.form === 'ean-inline') {
    e.preventDefault();
    const code = f.ean.value.trim();
